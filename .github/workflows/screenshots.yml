# Manual: runs the screenshot UI test on a small and a large iPhone simulator and uploads the
# screenshots (artifact "screenshots"). Start it with: gh workflow run screenshots.yml
name: screenshots

on:
  workflow_dispatch:
    inputs:
      runner:
        # arm64 macOS runners can sit unacquired for a long time ("capacity constraints",
        # 2026-10-20); fall back with -f runner=macos-15-intel.
        description: macOS makinesi
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel, macos-26]

jobs:
  screens:
    name: Ekran görüntüleri (simülatör)
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: En yeni Xcode'u seç
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projeyi üret
        working-directory: ios
        run: xcodegen generate
      - name: Simülatörleri seç (küçük + büyük iPhone)
        id: sims
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          devices = [(rt, d) for rt, ds in data["devices"].items() if "iOS" in rt for d in ds]
          devices.sort(key=lambda p: [int(n) for n in re.findall(r"\d+", p[0].split("iOS")[-1])])
          def pick(test):
              found = [d for _, d in devices if test(d["name"])]
              return found[-1]["udid"] if found else ""
          print("small=" + pick(lambda n: n.startswith("iPhone SE")))
          print("large=" + pick(lambda n: "Pro Max" in n))
          PY
          cat "$GITHUB_OUTPUT"
      - name: UI testini çalıştır ve görüntüleri çıkar
        working-directory: ios
        env:
          SMALL: ${{ steps.sims.outputs.small }}
          LARGE: ${{ steps.sims.outputs.large }}
        run: |
          mkdir -p out shots
          run_on() {
            name="$1"; udid="$2"
            [ -n "$udid" ] || { echo "no simulator for $name"; return 0; }
            # Sign to run locally (simulator only; embeds the App Group entitlement). Fall back to unsigned.
            xcodebuild test -project Lockglow.xcodeproj -scheme Lockglow -destination "id=$udid" \
              -only-testing:LockglowUITests -only-testing:LockglowWidgetSnapshots -resultBundlePath "out/$name.xcresult" \
              CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
              > "out/$name.log" 2>&1 \
            || { echo "signed run failed on $name, retrying unsigned"; rm -rf "out/$name.xcresult";
                 xcodebuild test -project Lockglow.xcodeproj -scheme Lockglow -destination "id=$udid" \
                   -only-testing:LockglowUITests -only-testing:LockglowWidgetSnapshots -resultBundlePath "out/$name.xcresult" \
                   CODE_SIGNING_ALLOWED=NO > "out/$name.log" 2>&1 || echo "test run failed on $name"; }
            grep -E "error:|Test Case .* (passed|failed)|\*\* TEST" "out/$name.log" | tail -20 || true
            if [ -d "out/$name.xcresult" ]; then
              xcrun xcresulttool export attachments --path "out/$name.xcresult" --output-path "shots/$name" || true
            fi
          }
          run_on small "$SMALL"
          run_on large "$LARGE"
          find shots -type f | head -40
      - name: Görüntüleri yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ios/shots
            ios/out/*.log
          if-no-files-found: warn
          retention-days: 7
