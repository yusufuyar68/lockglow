# Manual: runs the screenshot UI tests on iPhone simulators and uploads the screenshots (artifact
# "screenshots"). Start it with:
#   gh workflow run screenshots.yml -R yusufuyar68/lockglow --ref <branch> -f runner=macos-15-intel
# Passes (input "gecisler", separated by spaces):
#   se        iPhone SE, light: the small-screen layout check
#   pro       iPhone NN Pro (6.3", 1206 x 2622), light: the App Store's required size
#   promax    iPhone NN Pro Max (6.9", 1320 x 2868), light
#   se-koyu, pro-koyu, promax-koyu   the same in dark mode
#   ipad, ipad-koyu   the newest 13" iPad: the iPad tests only (LockglowIPadTests: the wide layout
#             in landscape and portrait, the keyboard keys); the iPhone walkthrough is not run there
# Each pass starts from an erased simulator with the status bar at 9:41, full Wi-Fi and cellular
# bars and a full battery (no "Carrier"). Screenshots land in shots/<pass>/ (raw xcresult export
# with manifest.json) and named/<pass>/<attachment name>.png. A pass whose UI test runner did not
# start is run once more (UI tests only) as "<pass>-retry": out/<pass>-retry.log, shots/<pass>-retry/.
# Input "olcum" = evet: after the passes, the launch and widget timings (LaunchPerformanceTests,
# WidgetPerformanceTests; skipped otherwise) on an erased simulator: out/olcum.log, job summary.
# Only the timings: -f gecisler=yok -f olcum=evet.
name: screenshots

on:
  workflow_dispatch:
    inputs:
      runner:
        # arm64 macOS runners can sit unacquired for a long time ("capacity constraints",
        # 2026-10-20); fall back with -f runner=macos-15-intel.
        description: macOS makinesi
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel, macos-26]
      gecisler:
        description: "Geçişler (boşlukla): se, pro, promax, se-koyu, pro-koyu, promax-koyu, ipad, ipad-koyu"
        type: string
        default: se pro pro-koyu
      quiz_gecisi:
        # The gap-fill quiz comes 10 minutes after a missed word: one pass waits for it.
        description: "Quiz için ~8 dk bekleyen geçiş (boş: hiçbiri)"
        type: string
        default: pro
      olcum:
        description: "Açılış ve widget ölçümleri (evet: geçişlerden sonra ayrı bir simülatörde)"
        type: choice
        default: hayir
        options: [hayir, evet]

jobs:
  screens:
    name: Ekran görüntüleri (simülatör)
    runs-on: ${{ inputs.runner || 'macos-15' }}
    # Two light passes took 39 min on the Intel runner (22 Oct); three passes with the new screens
    # and the quiz wait (~7 min) need more.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: En yeni Xcode'u seç
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projeyi üret
        working-directory: ios
        run: xcodegen generate
      - name: Simülatörleri seç (SE, Pro, Pro Max, iPad)
        id: sims
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          def version(text):
              return [int(n) for n in re.findall(r"\d+", text)]
          devices = [(version(rt.split("iOS")[-1]), version(d["name"]), d)
                     for rt, ds in data["devices"].items() if "iOS" in rt for d in ds]
          # Newest runtime first, then the newest model of that runtime.
          devices.sort(key=lambda p: (p[0], p[1]))
          def pick(pattern):
              found = [d for _, _, d in devices if re.fullmatch(pattern, d["name"])]
              return found[-1]["udid"] if found else ""
          print("se=" + pick(r"iPhone SE.*"))
          print("pro=" + pick(r"iPhone \d+ Pro"))
          print("promax=" + pick(r"iPhone \d+ Pro Max"))
          print("ipad=" + (pick(r"iPad Pro 13-inch.*") or pick(r"iPad Air 13-inch.*") or pick(r"iPad.*")))
          PY
          cat "$GITHUB_OUTPUT"
      - name: Testleri derle
        working-directory: ios
        env:
          FIRST: ${{ steps.sims.outputs.se || steps.sims.outputs.pro }}
        run: |
          mkdir -p out
          # Sign to run locally (simulator only; embeds the App Group entitlement). Fall back to unsigned.
          # Every device's images (ENABLE_ONLY_ACTIVE_RESOURCES=NO): the iPad pass runs this
          # iPhone-destination build too.
          xcodebuild build-for-testing -project Lockglow.xcodeproj -scheme Lockglow -destination "id=$FIRST" \
            -derivedDataPath build/dd ENABLE_ONLY_ACTIVE_RESOURCES=NO \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
            > out/build.log 2>&1 \
          || { echo "signed build failed, retrying unsigned"
               xcodebuild build-for-testing -project Lockglow.xcodeproj -scheme Lockglow -destination "id=$FIRST" \
                 -derivedDataPath build/dd ENABLE_ONLY_ACTIVE_RESOURCES=NO CODE_SIGNING_ALLOWED=NO > out/build.log 2>&1; } \
          || { grep -E "error:" out/build.log | sort -u | head -50; tail -20 out/build.log; exit 1; }
          grep -E "error:|warning:.*UITests" out/build.log | sort -u | head -50 || true
          tail -3 out/build.log
      - name: UI testlerini çalıştır ve görüntüleri çıkar
        working-directory: ios
        env:
          GECISLER: ${{ inputs.gecisler || 'se pro pro-koyu' }}
          QUIZ_PASS: ${{ inputs.quiz_gecisi }}
          SIM_SE: ${{ steps.sims.outputs.se }}
          SIM_PRO: ${{ steps.sims.outputs.pro }}
          SIM_PROMAX: ${{ steps.sims.outputs.promax }}
          SIM_IPAD: ${{ steps.sims.outputs.ipad }}
        run: |
          mkdir -p out shots named
          # 9:41 today in the runner's time zone, as ISO 8601: simctl formats an ISO time itself
          # (a plain "9:41" is not shown on every simulator version).
          TIME="$(python3 -c 'import datetime; print(datetime.datetime.now().astimezone().replace(hour=9, minute=41, second=0, microsecond=0).isoformat())')"
          prepare() {
            udid="$1"; appearance="$2"
            xcrun simctl shutdown "$udid" 2>/dev/null || true
            # A fresh simulator for every pass: the tests expect a new install (first card
            # "breakfast", no progress, no own words).
            xcrun simctl erase "$udid" || { echo "::warning::could not erase $udid"; return 1; }
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b > /dev/null || true
            xcrun simctl ui "$udid" appearance "$appearance" || echo "could not set appearance $appearance"
            # One override per group: on 22 Oct the single call with every flag was refused
            # ("Invalid argument"), so each group is tried on its own and the result is listed.
            xcrun simctl status_bar "$udid" override --time "$TIME" \
              || xcrun simctl status_bar "$udid" override --time "9:41" \
              || echo "status bar: time refused"
            xcrun simctl status_bar "$udid" override --batteryState charged --batteryLevel 100 \
              || echo "status bar: battery refused"
            xcrun simctl status_bar "$udid" override --dataNetwork wifi --wifiMode active --wifiBars 3 \
              || echo "status bar: wifi refused"
            xcrun simctl status_bar "$udid" override --cellularMode active --cellularBars 4 \
              || echo "status bar: cellular refused"
            xcrun simctl status_bar "$udid" override --operatorName '' \
              || echo "status bar: operator name refused"
            xcrun simctl status_bar "$udid" list || true
          }
          # One xcodebuild run on $udid: $1 names its log, result bundle and shots folder; the
          # rest are its -only-testing flags.
          run_tests() {
            run="$1"; shift
            xcodebuild test-without-building -project Lockglow.xcodeproj -scheme Lockglow \
              -destination "id=$udid" -derivedDataPath build/dd "$@" \
              -resultBundlePath "out/$run.xcresult" > "out/$run.log" 2>&1 \
              || echo "test run failed on $run"
            grep -E "error:|Test Case .* (passed|failed)|\*\* TEST" "out/$run.log" | tail -40 || true
            if [ -d "out/$run.xcresult" ]; then
              xcrun xcresulttool export attachments --path "out/$run.xcresult" --output-path "shots/$run" || true
            fi
          }
          run_pass() {
            name="$1"
            case "$name" in
              se|se-koyu) udid="$SIM_SE" ;;
              pro|pro-koyu) udid="$SIM_PRO" ;;
              promax|promax-koyu) udid="$SIM_PROMAX" ;;
              ipad|ipad-koyu) udid="$SIM_IPAD" ;;
              *) echo "unknown pass $name"; return 0 ;;
            esac
            [ -n "$udid" ] || { echo "no simulator for $name"; return 0; }
            case "$name" in *-koyu) appearance=dark ;; *) appearance=light ;; esac
            # The widget renders do not depend on the simulator: once per run is enough.
            # An iPad pass runs the iPad tests only (the iPhone walkthrough expects iPhone screens).
            ui="LockglowUITests"
            case "$name" in ipad*) ui="LockglowUITests/LockglowIPadTests" ;; esac
            only="-only-testing:$ui"
            if [ -z "$WIDGETS_DONE" ]; then
              only="$only -only-testing:LockglowWidgetSnapshots"; WIDGETS_DONE=1
            fi
            # xcodebuild hands TEST_RUNNER_* variables to the tests without the prefix
            # (testCaptureWaitedQuiz reads LOCKGLOW_QUIZ_WAIT).
            if [ "$name" = "$QUIZ_PASS" ]; then
              export TEST_RUNNER_LOCKGLOW_QUIZ_WAIT=1
            else
              unset TEST_RUNNER_LOCKGLOW_QUIZ_WAIT
            fi
            echo "::group::$name ($appearance, $udid)"
            prepare "$udid" "$appearance" || { echo "skipping $name"; echo "::endgroup::"; return 0; }
            # shellcheck disable=SC2086
            run_tests "$name" $only
            # On 22 Oct the UI test runner of "se" and "pro" did not start ("The test runner failed
            # to initialize for UI testing ... Timed out waiting for AX loaded notification"), so no
            # UI test ran. Once more then, on an erased simulator, the UI tests only (the widget
            # renders are done); its log and pictures are "<pass>-retry".
            if grep -qi "failed to initialize for UI testing" "out/$name.log" \
              && ! grep -qF "Test Case '-[LockglowUITests." "out/$name.log"; then
              echo "::warning::$name: the UI test runner did not start, trying once more"
              if prepare "$udid" "$appearance"; then
                run_tests "$name-retry" "-only-testing:$ui"
              else
                echo "could not prepare $name again"
              fi
            fi
            xcrun simctl status_bar "$udid" clear || true
            xcrun simctl shutdown "$udid" || true
            echo "::endgroup::"
          }
          WIDGETS_DONE=
          for pass in $GECISLER; do
            run_pass "$pass"
          done
          # Copy each screenshot under its attachment name ("1-akis_0_<uuid>.png" -> "1-akis.png").
          # Images only: XCTest's own attachments on a failure have names with quotes, which the
          # artifact upload refuses. A retry's pictures go with its pass ("pro-retry" -> named/pro).
          python3 - <<'PY'
          import json, pathlib, re, shutil
          for manifest in pathlib.Path("shots").glob("*/manifest.json"):
              target = pathlib.Path("named") / re.sub(r"-retry$", "", manifest.parent.name)
              target.mkdir(parents=True, exist_ok=True)
              for test in json.loads(manifest.read_text()):
                  for item in test.get("attachments", []):
                      source = manifest.parent / item["exportedFileName"]
                      name = re.sub(r"_\d+_[0-9A-F-]{36}(?=\.\w+$)", "", item["suggestedHumanReadableName"])
                      name = re.sub(r'[\\/"<>:|*?\r\n]', "_", name)
                      if source.exists() and source.suffix.lower() in (".png", ".jpg", ".jpeg"):
                          shutil.copyfile(source, target / name)
          PY
          find named -type f | sort || true
      - name: Ölçümler (açılış süresi, widget zaman çizelgesi ve belleği)
        if: inputs.olcum == 'evet'
        working-directory: ios
        env:
          SIM: ${{ steps.sims.outputs.pro || steps.sims.outputs.se }}
        run: |
          mkdir -p out
          [ -n "$SIM" ] || { echo "no simulator for the timings"; exit 1; }
          # An erased simulator: the launch test measures a fresh install, like a new user.
          xcrun simctl shutdown "$SIM" 2>/dev/null || true
          xcrun simctl erase "$SIM"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b > /dev/null || true
          # The timing tests skip themselves without this (xcodebuild drops the TEST_RUNNER_ prefix).
          export TEST_RUNNER_LOCKGLOW_PERF=1
          xcodebuild test-without-building -project Lockglow.xcodeproj -scheme Lockglow \
            -destination "id=$SIM" -derivedDataPath build/dd \
            -only-testing:LockglowUITests/LaunchPerformanceTests \
            -only-testing:LockglowWidgetSnapshots/WidgetPerformanceTests \
            -resultBundlePath out/olcum.xcresult > out/olcum.log 2>&1 \
            || echo "the timing run failed"
          grep -E "measured|\[ölçüm\]|Test Case .* (passed|failed|skipped)|error:" out/olcum.log | tail -80 || true
          {
            echo "### Ölçümler (simülatör, $(xcrun simctl list devices | grep "$SIM" | head -1 | sed 's/ (.*//' | xargs))"
            echo '```'
            grep -E "measured|\[ölçüm\]" out/olcum.log | sed -E "s/^.*Test Case '-\[[A-Za-z]+\.//; s/\]' measured/ measured/" || echo "no measurement"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl shutdown "$SIM" || true
      - name: Görüntüleri yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ios/shots
            ios/named
            ios/out/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Sonuç (başarısız test varsa kırmızı)
        working-directory: ios
        run: |
          failed="$(grep -hE "Test Case .* failed" out/*.log | sort -u || true)"
          ran="$(cat out/*.log | grep -cE "Test Case .* (passed|failed)" || true)"
          echo "### Ekran görüntüleri" >> "$GITHUB_STEP_SUMMARY"
          echo "Çalışan test: $ran" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            { echo; echo "Başarısız:"; echo '```'; echo "$failed"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "$failed"
            exit 1
          fi
          [ "${ran:-0}" -gt 0 ] || { echo "no test ran"; exit 1; }
