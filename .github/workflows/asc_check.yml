# Manual: checks the App Store Connect secrets without printing them.
# Shape of the .p8 / Issuer ID / Key ID, then one authenticated API call (HTTP status only).
#   gh workflow run asc_check.yml
name: asc-check

on:
  workflow_dispatch:
    inputs:
      operation: {type: choice, options: [legacy, testflight], default: legacy}
      build_number: {description: "testflight mode: exact numeric build number", type: string}

jobs:
  check:
    if: inputs.operation != 'testflight'
    name: App Store Connect anahtarını sına
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Biçim kontrolü (değerler yazılmaz)
        run: |
          python3 - <<'EOF'
          import os, re
          kid = os.environ["ASC_KEY_ID"]; iss = os.environ["ASC_ISSUER_ID"]; p8 = os.environ["ASC_KEY_P8"]
          print("key_id: uzunluk", len(kid), "| 10 büyük harf/rakam:", bool(re.fullmatch(r"[A-Z0-9]{10}", kid)))
          print("issuer: uzunluk", len(iss), "| UUID biçimi:", bool(re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", iss)))
          print("p8: karakter", len(p8), "| satır", len(p8.splitlines()), "| CR var:", "\r" in p8, "| BOM var:", p8.startswith("﻿"),
                "| NUL var:", "\x00" in p8)
          print("p8: BEGIN PRIVATE KEY:", "-----BEGIN PRIVATE KEY-----" in p8, "| END PRIVATE KEY:", "-----END PRIVATE KEY-----" in p8)
          EOF
      - name: Apple'a deneme isteği
        run: |
          pip install -q pyjwt cryptography
          python3 - <<'EOF'
          import os, time, jwt, urllib.request, urllib.error, json
          p8 = os.environ["ASC_KEY_P8"].replace("\r", "").lstrip("﻿")
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"].strip(), "iat": int(time.time()), "exp": int(time.time()) + 600,
                            "aud": "appstoreconnect-v1"}, p8, algorithm="ES256",
                           headers={"kid": os.environ["ASC_KEY_ID"].strip(), "typ": "JWT"})
          def get(path, show):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                                           headers={"Authorization": "Bearer " + tok})
              try:
                  with urllib.request.urlopen(req) as r:
                      data = json.load(r)
                      print("HTTP", r.status, path.split("?")[0], "|", [show(a["attributes"]) for a in data["data"]])
              except urllib.error.HTTPError as e:
                  body = json.loads(e.read() or b"{}")
                  print("HTTP", e.code, path.split("?")[0], "|", [(x.get("code"), x.get("detail")) for x in body.get("errors", [])])
          get("/v1/apps?limit=10&fields[apps]=bundleId", lambda a: a["bundleId"])
          get("/v1/bundleIds?filter[identifier]=com.yusufuyar.vocabwidget,com.yusufuyar.vocabwidget.widgets",
              lambda a: (a["identifier"], a["platform"]))
          get("/v1/certificates?limit=20", lambda a: (a["certificateType"], a.get("displayName"), a.get("name"), a["expirationDate"][:10]))
          get("/v1/devices?limit=50&fields[devices]=platform,status,deviceClass", lambda a: (a["platform"], a["deviceClass"], a["status"]))
          get("/v1/profiles?limit=50&filter[name]=vocabwidget&fields[profiles]=name,profileType,profileState",
              lambda a: (a["name"], a["profileType"], a["profileState"]))
          get("/v1/profiles?limit=50&fields[profiles]=name,profileType,profileState",
              lambda a: (a["name"], a["profileType"], a["profileState"]))
          EOF
  testflight:
    if: inputs.operation == 'testflight'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify existing TestFlight availability
        run: |
          set -euo pipefail
          printf '{"verified":false}\n' > "$RUNNER_TEMP/testflight-status.json"
          KEY_PATH="$(mktemp "$RUNNER_TEMP/lockglow-asc-status.XXXXXX")"
          export KEY_PATH
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 -m venv "$RUNNER_TEMP/asc-status-venv"
          "$RUNNER_TEMP/asc-status-venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/asc-status-venv/bin/python" tools/testflight_durum.py \
            --build-number "$BUILD_NUMBER" --output "$RUNNER_TEMP/testflight-status.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testflight-status.json
          if-no-files-found: error
          retention-days: 14
