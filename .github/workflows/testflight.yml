# Manual: archives the app (Release) and uploads it to App Store Connect, where it appears in
# TestFlight. Start it with:
#   gh workflow run testflight.yml
# Needs three repository secrets (see docs/testflight_kurulum.md):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (Admin), tools/testflight_anahtar_ekle.ps1
# Signing: Xcode's automatic signing with an API key cannot read App Groups
# (`/xcbuild/v1/appGroups` answers 401, 2026-10-20). Each run therefore creates a temporary
# distribution certificate and two IOS_APP_STORE profiles through the API
# (ios/Tools/asc_signing.py), signs manually, and the `cleanup` job deletes exactly those
# after App Store Connect has processed the build. The user allowed this on 2026-10-20.
# The build number is the workflow run number, so every upload is higher than the previous one.
name: testflight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  APP_BUNDLE_ID: com.yusufuyar.vocabwidget
  WIDGET_BUNDLE_ID: com.yusufuyar.vocabwidget.widgets

jobs:
  upload:
    name: TestFlight'a yükle
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      signing_state: ${{ steps.state.outputs.json }}
      uploaded: ${{ steps.upload.outputs.uploaded }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_PATH: ${{ github.workspace }}/.asc/AuthKey.p8
      SIGN_DIR: ${{ github.workspace }}/.asc
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      # Without the secrets the run is a dry run: a locally signed Release archive, no upload.
      - name: Gizli değişkenleri kontrol et
        id: keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Eksik gizli değişken:$missing. Kuru çalıştırma: yerel imzalı Release arşivi, yükleme yok (docs/testflight_kurulum.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$SIGN_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: En yeni Xcode'u seç
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projeyi üret
        working-directory: ios
        run: xcodegen generate
      # The archive is signed locally ("-"): entitlements such as the App Group stay embedded and
      # no development profile is needed. The App Store signature is applied at export.
      - name: Arşivle (Release, yerel imza)
        working-directory: ios
        run: |
          xcodebuild archive -project Lockglow.xcodeproj -scheme Lockglow-Release -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Lockglow.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > build-archive.log 2>&1 || status=$?
          grep -E "error:|warning:|\*\* ARCHIVE" build-archive.log | sort -u | head -100 || true
          for app in build/Lockglow.xcarchive/Products/Applications/*.app build/Lockglow.xcarchive/Products/Applications/*.app/PlugIns/*.appex; do
            echo "== $app"; codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -p - 2>/dev/null || true
          done
          exit ${status:-0}
      - name: Python ortamı
        if: steps.keys.outputs.signed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
      - name: Geçici sertifika ve profiller
        id: signing
        if: steps.keys.outputs.signed == 'true'
        run: |
          "$RUNNER_TEMP/venv/bin/python" ios/Tools/asc_signing.py setup \
            --state "$SIGN_DIR/state.json" --p12 "$SIGN_DIR/dist.p12" --p12-password "$SIGN_DIR/dist.pass" \
            --export-info "$SIGN_DIR/export.json" --run-id "${{ github.run_id }}" \
            --app-group "group.$APP_BUNDLE_ID" "$APP_BUNDLE_ID" "$WIDGET_BUNDLE_ID"
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "== $(basename "$f")"
            security cms -D -i "$f" | plutil -extract Entitlements xml1 -o - - | plutil -p - \
              | grep -E "application-identifier|application-groups|group\.|beta-reports" || true
          done
      # Runs even if the step above failed halfway, so the cleanup job knows what was created.
      - name: Oluşturulanları kaydet
        id: state
        if: always() && steps.keys.outputs.signed == 'true'
        run: |
          if [ -f "$SIGN_DIR/state.json" ]; then
            echo "json=$(tr -d '\n' < "$SIGN_DIR/state.json")" >> "$GITHUB_OUTPUT"
          fi
      - name: Sertifikayı anahtarlığa koy
        if: steps.signing.outcome == 'success'
        run: |
          KEYCHAIN="$RUNNER_TEMP/lockglow.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security import "$SIGN_DIR/dist.p12" -k "$KEYCHAIN" -P "$(cat "$SIGN_DIR/dist.pass")" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<sha1>/'
      - name: App Store Connect'e yükle
        id: upload
        if: steps.signing.outcome == 'success'
        working-directory: ios
        run: |
          TEAM_ID="$(sed -n 's/^DEVELOPMENT_TEAM *= *//p' Config/Base.xcconfig)"
          python3 - "$SIGN_DIR/export.json" "$TEAM_ID" build/ExportOptions.plist <<'EOF'
          import json, plistlib, sys
          info = json.load(open(sys.argv[1]))
          plistlib.dump({
              "method": "app-store-connect",
              "destination": "upload",
              "teamID": sys.argv[2],
              "signingStyle": "manual",
              "signingCertificate": info["sha1"],
              "provisioningProfiles": info["profiles"],
              "manageAppVersionAndBuildNumber": False,
          }, open(sys.argv[3], "wb"))
          EOF
          xcodebuild -exportArchive -archivePath build/Lockglow.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > build-export.log 2>&1 || status=$?
          grep -E "error|Upload succeeded|EXPORT|Uploaded" build-export.log | sort -u | head -60 || true
          [ -z "${status:-}" ] || tail -40 build-export.log
          cp -R "${TMPDIR:-/tmp}"/*.xcdistributionlogs "$RUNNER_TEMP"/ 2>/dev/null || true
          [ -z "${status:-}" ] && echo "uploaded=true" >> "$GITHUB_OUTPUT"
          exit ${status:-0}
      - name: Anahtarları sil
        if: always()
        run: |
          rm -rf "$SIGN_DIR"
          security delete-keychain "$RUNNER_TEMP/lockglow.keychain-db" 2>/dev/null || true
      - name: Günlükleri sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/build-archive.log
            ios/build-export.log
            ${{ runner.temp }}/*.xcdistributionlogs
          if-no-files-found: ignore
          retention-days: 7

  # Linux (1x minutes): waits for App Store Connect to finish processing the upload, then deletes
  # the temporary profiles and revokes the temporary certificate created by this run only.
  cleanup:
    name: Geçici sertifikayı temizle
    needs: upload
    if: always() && needs.upload.outputs.signing_state != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Temizle
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNING_STATE: ${{ needs.upload.outputs.signing_state }}
          UPLOADED: ${{ needs.upload.outputs.uploaded }}
          KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 -m pip install -q pyjwt cryptography
          python3 ios/Tools/asc_signing.py cleanup --state-json "$SIGNING_STATE" \
            --uploaded "${UPLOADED:-false}" --app-bundle-id "$APP_BUNDLE_ID" \
            --build-number "${{ github.run_number }}" --wait-minutes 60 || status=$?
          rm -f "$KEY_PATH"
          exit ${status:-0}
