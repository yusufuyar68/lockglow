# Manual: archives the app (Release) and uploads it to App Store Connect, where it appears in
# TestFlight. Start it with:
#   gh workflow run testflight.yml
# Needs five repository secrets (see docs/testflight_kurulum.md):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (Admin), tools/testflight_anahtar_ekle.ps1
#   DIST_P12_BASE64, DIST_P12_PASSWORD      iOS distribution certificate, tools/dagitim_sertifikasi_ekle.ps1
# Signing is manual: Xcode's automatic signing with an API key cannot read App Groups
# (`/xcbuild/v1/appGroups` answers 401, 2026-10-20), so ios/Tools/asc_profiles.py prepares
# App Store profiles through the API and the export step signs with them.
# The build number is the workflow run number, so every upload is higher than the previous one.
name: testflight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: TestFlight'a yükle
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_PATH: ${{ github.workspace }}/.asc/AuthKey.p8
      P12_PATH: ${{ github.workspace }}/.asc/dist.p12
      KEYCHAIN: ${{ runner.temp }}/lockglow.keychain-db
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      # Without the secrets the run is a dry run: a locally signed Release archive, no upload.
      - name: Gizli değişkenleri kontrol et
        id: keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_P12_BASE64 DIST_P12_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Eksik gizli değişken:$missing. Kuru çalıştırma: yerel imzalı Release arşivi, yükleme yok (docs/testflight_kurulum.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          printf '%s' "$DIST_P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$P12_PATH"
          chmod 600 "$KEY_PATH" "$P12_PATH"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: En yeni Xcode'u seç
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projeyi üret
        working-directory: ios
        run: xcodegen generate
      # The archive is signed locally ("-"): entitlements such as the App Group stay embedded and
      # no development profile is needed. The App Store signature is applied at export.
      - name: Arşivle (Release, yerel imza)
        working-directory: ios
        run: |
          xcodebuild archive -project Lockglow.xcodeproj -scheme Lockglow-Release -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Lockglow.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > build-archive.log 2>&1 || status=$?
          grep -E "error:|warning:|\*\* ARCHIVE" build-archive.log | sort -u | head -100 || true
          for app in build/Lockglow.xcarchive/Products/Applications/*.app build/Lockglow.xcarchive/Products/Applications/*.app/PlugIns/*.appex; do
            echo "== $app"; codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -p - 2>/dev/null || true
          done
          exit ${status:-0}
      - name: Dağıtım sertifikasını anahtarlığa koy
        if: steps.keys.outputs.signed == 'true'
        env:
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$P12_PATH" -k "$KEYCHAIN" -P "$(printf '%s' "$DIST_P12_PASSWORD" | tr -d '\r\n')" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<sha1>/'
      - name: App Store profillerini hazırla
        if: steps.keys.outputs.signed == 'true'
        env:
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" ios/Tools/asc_profiles.py "$RUNNER_TEMP/profiles.json" \
            com.yusufuyar.vocabwidget com.yusufuyar.vocabwidget.widgets
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "== $(basename "$f")"
            security cms -D -i "$f" | plutil -extract Entitlements xml1 -o - - | plutil -p - | grep -E "application-identifier|application-groups|group\." || true
          done
      - name: App Store Connect'e yükle
        if: steps.keys.outputs.signed == 'true'
        working-directory: ios
        run: |
          TEAM_ID="$(sed -n 's/^DEVELOPMENT_TEAM *= *//p' Config/Base.xcconfig)"
          python3 - "$RUNNER_TEMP/profiles.json" "$TEAM_ID" build/ExportOptions.plist <<'EOF'
          import json, plistlib, sys
          info = json.load(open(sys.argv[1]))
          plistlib.dump({
              "method": "app-store-connect",
              "destination": "upload",
              "teamID": sys.argv[2],
              "signingStyle": "manual",
              "signingCertificate": info["sha1"],
              "provisioningProfiles": info["profiles"],
              "manageAppVersionAndBuildNumber": False,
          }, open(sys.argv[3], "wb"))
          EOF
          xcodebuild -exportArchive -archivePath build/Lockglow.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > build-export.log 2>&1 || status=$?
          grep -E "error|Upload succeeded|EXPORT|Uploaded" build-export.log | sort -u | head -60 || true
          [ -z "${status:-}" ] || tail -40 build-export.log
          cp -R "${TMPDIR:-/tmp}"/*.xcdistributionlogs "$RUNNER_TEMP"/ 2>/dev/null || true
          exit ${status:-0}
      - name: Anahtarları sil
        if: always()
        run: |
          rm -rf "$(dirname "$KEY_PATH")"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
      - name: Günlükleri sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/build-archive.log
            ios/build-export.log
            ${{ runner.temp }}/*.xcdistributionlogs
          if-no-files-found: ignore
          retention-days: 7
