# Manual: makes sure the internal TestFlight group exists (access to all builds) and that the
# account holder is a tester in it (ios/Tools/asc_beta.py). Linux, no macOS minutes.
#   gh workflow run testflight_group.yml
name: testflight-group

on:
  workflow_dispatch:

jobs:
  group:
    name: TestFlight dahili test grubu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Grup ve test eden
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" ios/Tools/asc_beta.py com.yusufuyar.vocabwidget "Ben" || status=$?
          rm -f "$KEY_PATH"
          exit ${status:-0}
