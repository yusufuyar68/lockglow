# Builds and tests on every push to main (and on demand).
# - python: content pipeline tests + strict validation of the personal draft cards (Linux).
# - swift-linux: VocabKit + app logic compiled and tested on Linux (Docker swift:6.2), free.
# - ios: VocabKit package tests and an unsigned simulator build of the app + widget (macOS), then
#   the Apple Watch app + complications (scheme LockglowWatch, watchOS simulator; is5-watch).
#   ON DEMAND ONLY: macOS minutes count 10x against the private-repo Actions quota (2026-10-17:
#   ~810 of 2000 used), and screenshots.yml / testflight.yml build the app anyway. Before pushing,
#   run ios/Tools/linux_check.sh (package tests + app logic on Linux, free).
name: build

on:
  push:
    # Every branch: the Linux jobs are cheap, and the session branches get Swift tests on push.
    # The macOS job below still runs only on demand.
    branches: ["**"]
    # Documentation-only pushes do not need a (10x billed) macOS build.
    paths-ignore:
      - "**/*.md"
      - "raporlar/**"
      - "docs/**"
      - "marketing/**"
      - "referans/**"
      - "tools/**"
  workflow_dispatch:
    inputs:
      runner:
        # arm64 macOS runners can sit unacquired for a long time ("capacity constraints",
        # 2026-10-20); fall back with -f runner=macos-15-intel.
        description: macOS makinesi
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel, macos-26]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: İçerik hattı (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: content-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum (README'deki komut)
        run: python -m pip install -e ".[dev]"
      - name: Testler
        run: python -m pytest -q
      - name: Taslak kartları katı doğrula
        run: |
          for d in ../content/drafts/kisisel_v1/*/; do
            python -m vocabpipe.validate --strict "$d"
          done

  # Free (1x Linux minutes): VocabKit + the app's non-UI files compiled with Swift 6.2 in Docker
  # and the package tests run (ios/Tools/linux_check.sh). The Windows PC has no Docker, so this is
  # the only place the Swift tests run before a (10x billed) macOS build.
  swift-linux:
    name: Swift paket testleri (Linux, ücretsiz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: linux_check.sh
        run: bash ios/Tools/linux_check.sh

  ios:
    name: iOS (paket testleri + simülatör derlemesi)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || 'macos-15' }}
    # 60: the watchOS build with the platform download when the image has none (is5-watch), and
    # the iPad step; a first boot of a new simulator runtime can take minutes on Intel (is5-ipad).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: En yeni Xcode'u seç
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen
      - name: VocabKit testleri
        working-directory: ios/Packages/VocabKit
        run: swift test
      - name: Projeyi üret
        id: generate
        working-directory: ios
        run: xcodegen generate
      - name: Uygulama + widget derle (imzasız, simülatör)
        working-directory: ios
        run: |
          xcodebuild -project Lockglow.xcodeproj -scheme Lockglow -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          grep -E "error:|warning:" build.log | sort -u | head -200 || true
          tail -5 build.log
          exit ${status:-0}
      # FoundationModels is iOS 26 only and the app starts at iOS 17: every binary of the app that
      # loads it must load it weakly, or iOS 17-25 stops the app at launch (project.yml OTHER_LDFLAGS).
      - name: FoundationModels zayıf bağlı mı
        working-directory: ios
        run: |
          app=build/dd/Build/Products/Debug-iphonesimulator/Lockglow.app
          found=0
          for bin in "$app/Lockglow" "$app/Lockglow.debug.dylib"; do
            [ -f "$bin" ] || continue
            loads="$(otool -l "$bin" | grep -A2 -E "LC_LOAD(_WEAK)?_DYLIB" | grep -B2 "FoundationModels.framework" || true)"
            [ -n "$loads" ] || continue
            found=1
            echo "$bin:"; echo "$loads"
            if echo "$loads" | grep -q "LC_LOAD_DYLIB"; then
              echo "::error::$bin loads FoundationModels strongly"; exit 1
            fi
          done
          [ "$found" = 1 ] || { echo "::error::no binary loads FoundationModels"; exit 1; }
      # is5-watch: runs even when the iPhone build failed, so both results come from one run.
      # The watchOS SDK ships inside Xcode, but a simulator build that compiles an asset catalog also
      # needs the watchOS simulator runtime of that SDK version (Xcode 15+). A runner image without
      # it downloads the platform first (several GB, a few minutes). Outputs are read into variables
      # first: with pipefail, `grep -q` closing a pipe early would fail the check.
      - name: Apple Watch uygulaması + komplikasyonlar derle (imzasız, simülatör)
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: ios
        run: |
          SDKS="$(xcodebuild -showsdks)"
          SDKVER="$(printf '%s\n' "$SDKS" | sed -n 's/.*-sdk watchsimulator\([0-9.]*\).*/\1/p' | tail -1)"
          RUNTIMES="$(xcrun simctl list runtimes)"
          echo "watchOS simülatör SDK: ${SDKVER:-yok}"
          printf '%s\n' "$RUNTIMES" | grep -i watchos || true
          if [ -z "$SDKVER" ] || ! grep -q "watchOS ${SDKVER}" <<< "$RUNTIMES"; then
            echo "watchOS ${SDKVER} simülatörü yok; indiriliyor"
            xcodebuild -downloadPlatform watchOS
            xcrun simctl list runtimes | grep -i watchos || true
          fi
          xcodebuild -project Lockglow.xcodeproj -scheme LockglowWatch -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build-watch.log 2>&1 || status=$?
          grep -E "error:|warning:" build-watch.log | sort -u | head -200 || true
          tail -5 build-watch.log
          exit ${status:-0}
      # The build above is for every simulator, iPad included (TARGETED_DEVICE_FAMILY 1,2). Here
      # the same app is opened on the newest iPad simulator: it must say it is an iPad app and
      # still run 20 s after launch (Akış, onboarding skipped); the screenshot is kept with the log.
      - name: iPad simülatöründe aç
        working-directory: ios
        timeout-minutes: 12
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/Lockglow.app
          # Read first, then searched: `grep -q` in a pipe can end the writer early (pipefail).
          app_family="$(plutil -extract UIDeviceFamily json -o - "$APP/Info.plist")"
          widget_family="$(plutil -extract UIDeviceFamily json -o - "$APP/PlugIns/LockglowWidgets.appex/Info.plist")"
          echo "UIDeviceFamily: app $app_family, widget $widget_family"
          grep -q 2 <<< "$app_family" || { echo "::error::the app does not declare iPad (UIDeviceFamily)"; exit 1; }
          grep -q 2 <<< "$widget_family" || { echo "::error::the widget does not declare iPad (UIDeviceFamily)"; exit 1; }
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          # The newest 13" iPad Pro, else 13" iPad Air, else any iPad.
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)
          def version(text):
              return [int(n) for n in re.findall(r"\d+", text)]
          devices = sorted((version(rt.split("iOS")[-1]), d["name"], d["udid"])
                           for rt, ds in data["devices"].items() if "iOS" in rt for d in ds)
          for pattern in (r"iPad Pro 13-inch.*", r"iPad Air 13-inch.*", r"iPad.*"):
              found = [udid for _, name, udid in devices if re.fullmatch(pattern, name)]
              if found:
                  print(found[-1])
                  break
          ')"
          [ -n "$UDID" ] || { echo "::warning::no iPad simulator on this runner"; exit 0; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null || { echo "::warning::the iPad simulator did not boot"; exit 0; }
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE" -lockglow.onboardingCompleted YES
          sleep 20
          xcrun simctl io "$UDID" screenshot ipad-akis.png || true
          # launchctl list: PID, status, label; an app that has ended keeps its label with "-".
          running="$(xcrun simctl spawn "$UDID" launchctl list || true)"
          if ! awk -v b="UIKitApplication:$BUNDLE" 'index($3, b) == 1 && $1 ~ /^[0-9]+$/ { f = 1 } END { exit !f }' <<< "$running"; then
            echo "::error::Lockglow is not running on the iPad simulator 20 s after launch"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5 || true
            exit 1
          fi
          xcrun simctl shutdown "$UDID" || true
      - name: Derleme günlüğünü sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ios/build.log
            ios/build-watch.log
            ios/ipad-akis.png
          if-no-files-found: ignore
          retention-days: 7
