<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lockglow arayüz mockup'ı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,800&display=swap">
<style>
/* Düzen: solda iPhone çerçevesi (390×844 ya da SE 375×667), sağda kontrol ve tasarım notu paneli.
   Sistem: kâğıt + mürekkep, tek parlak renk "fosfor" sarısı yalnız öğrenilecek İngilizce kelimenin şeridinde.
   Gündüz ana düğme mürekkep, gece fosfor. İngilizce metin serif (New York), Türkçe ve arayüz SF Pro. */
:root{
  --bg:#F3F3EE; --surface:#FFFFFF; --surface-2:#EBEBE4; --surface-3:#DEDED6;
  --line:rgba(21,24,27,.10); --line-strong:rgba(21,24,27,.22);
  --ink:#15181B; --ink-2:#4E555B; --ink-3:#626A71;
  --band:#F5E829; --band-ink:#15181B; --band-top:.36em; --band-glow:none;
  --mark:rgba(245,232,41,.80);
  --primary:#15181B; --on-primary:#FFFFFF; --primary-glow:none;
  --tint:#15181B; --tint-soft:rgba(21,24,27,.08);
  --good:#17703F; --good-tint:#DFF2E6; --bad:#B3261E; --bad-tint:#FBE5E2; --caution:#8F5600;
  --halo:rgba(245,232,41,.55);
  --bar-bg:rgba(250,250,247,.82); --bar-solid:#F7F7F3;
  --shadow-card:0 1px 2px rgba(21,24,27,.05),0 12px 30px -16px rgba(21,24,27,.22);
  --shadow-bar:0 1px 0 rgba(255,255,255,.9) inset,0 10px 28px -10px rgba(21,24,27,.30);
  --glass-bg:rgba(255,255,255,.58); --glass-line:rgba(255,255,255,.9);
  --chrome-panel:#FFFFFF; --bezel:#0d0e10;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-en:ui-serif,"New York","Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F11; --surface:#191C20; --surface-2:#24282D; --surface-3:#30353B;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18);
    --ink:#F3F4F0; --ink-2:#B7BDC2; --ink-3:#8E959B;
    --band:#E9E040; --band-ink:#F3F4F0; --band-top:auto; --band-glow:none;
    --mark:rgba(233,224,64,.95);
    --primary:#E9E040; --on-primary:#15181B; --primary-glow:0 0 26px -4px rgba(233,224,64,.45);
    --tint:#F3F4F0; --tint-soft:rgba(255,255,255,.10);
    --good:#5BD08F; --good-tint:rgba(91,208,143,.16); --bad:#FF8C80; --bad-tint:rgba(255,140,128,.16); --caution:#FF9E5A;
    --halo:rgba(233,224,64,.35);
    --bar-bg:rgba(36,40,45,.82); --bar-solid:#1B1E22;
    --shadow-card:0 1px 0 rgba(255,255,255,.04) inset,0 16px 36px -18px rgba(0,0,0,.75);
    --shadow-bar:0 1px 0 rgba(255,255,255,.10) inset,0 12px 30px -8px rgba(0,0,0,.7);
    --glass-bg:rgba(44,48,54,.55); --glass-line:rgba(255,255,255,.16);
    --chrome-panel:#14171A; --bezel:#050607; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F11; --surface:#191C20; --surface-2:#24282D; --surface-3:#30353B;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18);
  --ink:#F3F4F0; --ink-2:#B7BDC2; --ink-3:#8E959B;
  --band:#E9E040; --band-ink:#F3F4F0; --band-top:auto; --band-glow:none;
  --mark:rgba(233,224,64,.95);
  --primary:#E9E040; --on-primary:#15181B; --primary-glow:0 0 26px -4px rgba(233,224,64,.45);
  --tint:#F3F4F0; --tint-soft:rgba(255,255,255,.10);
  --good:#5BD08F; --good-tint:rgba(91,208,143,.16); --bad:#FF8C80; --bad-tint:rgba(255,140,128,.16); --caution:#FF9E5A;
  --halo:rgba(233,224,64,.35);
  --bar-bg:rgba(36,40,45,.82); --bar-solid:#1B1E22;
  --shadow-card:0 1px 0 rgba(255,255,255,.04) inset,0 16px 36px -18px rgba(0,0,0,.75);
  --shadow-bar:0 1px 0 rgba(255,255,255,.10) inset,0 12px 30px -8px rgba(0,0,0,.7);
  --glass-bg:rgba(44,48,54,.55); --glass-line:rgba(255,255,255,.16);
  --chrome-panel:#14171A; --bezel:#050607; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:10px}
svg.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.fill{fill:currentColor;stroke:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── Sayfa çerçevesi ───────── */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:16px 12px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:700 23px var(--font-en);letter-spacing:-.01em}
.brand svg{width:30px;height:30px;border-radius:9px;display:block}
.brand small{font:500 13px var(--font-ui);color:var(--ink-3);letter-spacing:0;margin-left:2px}
.mainnav,.pseg{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:13px}
.mainnav button,.pseg button{min-height:44px;padding:0 15px;border-radius:10px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.pseg button{padding:0 12px;font-size:14px}
.mainnav button[aria-pressed="true"],.pseg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.topbar .spacer{flex:1}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;max-width:1240px;margin:0 auto;align-items:start}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;padding-top:8px}
.phone-box{position:relative;flex:none}
.phone-box .phone{position:absolute;left:0;top:0;transform-origin:0 0}
.stage-cap{font-size:13px;color:var(--ink-3);text-align:center;max-width:50ch}
.panel{background:var(--chrome-panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h2{margin:0 0 8px;font:700 13px var(--font-ui);letter-spacing:.04em;color:var(--ink-3)}
.panel .grp{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface-2);font-weight:600;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.range{display:flex;flex-direction:column;gap:6px}
.range input{width:100%;accent-color:var(--ink);min-height:44px}
.range .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.note{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}
.note h3{margin:0;font:700 17px var(--font-ui);color:var(--ink)}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.note .swift{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.note .swift b{color:var(--ink)}
.audit{font-size:13px;color:var(--ink-2);padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.audit b{color:var(--good)}
.audit.bad b{color:var(--bad)}
@media (max-width:1020px){.workspace{grid-template-columns:minmax(0,1fr)}.panel{order:2}}

/* ───────── iPhone çerçevesi ───────── */
.phone{--dt:1;--sw:390px;--sh:844px;--sr:48px;--safe-top:54px;--safe-bottom:34px;--w-small:158px;--w-medium:338px;
  --fs-head:min(calc(40px*var(--dt)),56px);--fs-lt:calc(34px*var(--dt));--fs-t1:calc(28px*var(--dt));--fs-t2:calc(22px*var(--dt));
  --fs-t3:calc(20px*var(--dt));--fs-b:calc(17px*var(--dt));--fs-c:calc(16px*var(--dt));--fs-s:calc(15px*var(--dt));
  --fs-f:calc(13px*var(--dt));--fs-cap:calc(12px*var(--dt));
  --bar-h:64px;--bar-b:max(8px,calc(var(--safe-bottom) - 14px));--bar-space:calc(var(--bar-h) + var(--bar-b) + 14px);
  position:relative;padding:12px;background:var(--bezel);border-radius:calc(var(--sr) + 12px);
  box-shadow:0 0 0 1.5px #34363c inset,0 50px 90px -40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05);color:var(--ink);font-family:var(--font-ui)}
.phone[data-os="17"]{--bar-h:49px;--bar-b:0px;--bar-space:calc(49px + var(--safe-bottom) + 10px)}
.phone[data-device="se"]{--sw:375px;--sh:667px;--sr:6px;--safe-top:20px;--safe-bottom:0px;--w-small:148px;--w-medium:321px;padding:72px 14px 80px;border-radius:46px}
.phone[data-device="se"]::after{content:"";position:absolute;left:50%;bottom:16px;width:50px;height:50px;margin-left:-25px;border-radius:50%;border:2px solid #3b3d44}
.phone[data-device="se"]::before{content:"";position:absolute;left:50%;top:34px;width:64px;height:7px;margin-left:-32px;border-radius:4px;background:#2a2c31}
.screen{position:relative;width:var(--sw);height:var(--sh);border-radius:var(--sr);overflow:hidden;background:var(--bg);isolation:isolate}
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--safe-top);display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 38px;z-index:50;font:600 16px var(--font-ui);color:var(--ink);pointer-events:none}
.phone[data-device="se"] .statusbar{padding:0 12px}
.statusbar.light{color:#fff}
.statusbar .si{display:flex;gap:6px;align-items:center}
.statusbar svg{height:12px;width:auto;fill:currentColor}
.island{position:absolute;top:11px;left:50%;width:122px;height:36px;margin-left:-61px;background:#000;border-radius:20px;z-index:55}
.phone[data-device="se"] .island,.phone[data-device="se"] .homebar{display:none}
.homebar{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:var(--ink);opacity:.85;z-index:60;pointer-events:none}
.homebar.light{background:#fff}

/* ───────── Uygulama kabuğu ───────── */
.app{position:absolute;inset:0;padding-top:var(--safe-top);display:flex;flex-direction:column;background:var(--bg)}
.page{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:var(--bar-space);scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.app.round .scroll{padding-bottom:16px}
/* iOS 26: yüzen cam sekme çubuğu */
.tabbar{position:absolute;left:16px;right:16px;bottom:var(--bar-b);height:var(--bar-h);border-radius:34px;display:flex;gap:2px;padding:4px;z-index:30;
  background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:var(--shadow-bar);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.tab{flex:1;min-width:44px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);font:600 12px var(--font-ui);position:relative}
.tab svg{width:25px;height:25px}
.tab[aria-selected="true"]{background:var(--tint-soft);color:var(--ink)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--tint)}
.tab .dot{position:absolute;top:8px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--bar-solid)}
/* iOS 17–25: klasik sekme çubuğu (materyal) */
.phone[data-os="17"] .tabbar{left:0;right:0;bottom:0;height:calc(49px + var(--safe-bottom));padding:0 0 var(--safe-bottom);border-radius:0;border:0;border-top:1px solid var(--line-strong);box-shadow:none;background:var(--bar-bg)}
.phone[data-os="17"] .tab{border-radius:0;gap:1px;font-size:10.5px}
.phone[data-os="17"] .tab svg{width:23px;height:23px}
.phone[data-os="17"] .tab[aria-selected="true"]{background:none}
.app.round .tabbar{display:none}
.app:not(.round)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--bar-h) + var(--bar-b) + 6px);background:linear-gradient(to bottom,transparent,var(--bg) 70%);pointer-events:none;z-index:20}
.phone[data-os="17"] .app::after{display:none}

/* ───────── Ortak bileşenler ───────── */
.t-head{font:700 var(--fs-head)/1.08 var(--font-en);letter-spacing:-.012em;white-space:nowrap;overflow:hidden;min-width:0;max-width:100%;padding:0 .16em .34em;margin:0 -.16em -.34em}
.band{position:relative;z-index:0;color:var(--band-ink)}
.band::before{content:"";position:absolute;z-index:-1;left:-.08em;right:-.08em;top:var(--band-top);bottom:.03em;background:var(--band);box-shadow:var(--band-glow);
  clip-path:polygon(.12em 0,100% 0,calc(100% - .12em) 100%,0 100%)}
:root[data-theme="dark"] .band::before{bottom:-.2em;height:.13em;clip-path:polygon(.1em 0,100% 0,calc(100% - .1em) 100%,0 100%)}
:root[data-theme="dark"] .band::after{content:"";position:absolute;z-index:-2;left:0;right:0;bottom:-.26em;height:.24em;background:rgba(233,224,64,.38);filter:blur(.16em);border-radius:50%}
.mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .06em;color:inherit}
:root[data-theme="dark"] .mark{background:linear-gradient(transparent 84%,var(--mark) 84%);padding:0 0 .06em}
.t-gloss{font:700 var(--fs-t1)/1.18 var(--font-ui);letter-spacing:-.01em;color:var(--ink)}
.t-def{font:400 var(--fs-t3)/1.32 var(--font-en);color:var(--ink)}
.t-sub{font:400 var(--fs-s)/1.38 var(--font-ui);color:var(--ink-2)}
.t-foot{font:400 var(--fs-f)/1.4 var(--font-ui);color:var(--ink-2)}
.t-lt{font:700 var(--fs-lt)/1.1 var(--font-ui);letter-spacing:-.012em}
.en{font-family:var(--font-en)}
.btn{min-height:44px;padding:0 20px;border-radius:22px;font:600 var(--fs-b)/1.2 var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-lg{min-height:54px;border-radius:27px;padding:0 24px}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--primary-glow)}
.btn-secondary{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--bad-tint);color:var(--bad)}
.btn.block{width:100%}
.btn-cap{min-height:44px;padding:0 16px;border-radius:22px;font:600 var(--fs-b) var(--font-ui);color:var(--ink);background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:0 6px 16px -8px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.phone[data-os="17"] .btn-cap{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 8px}
.btn:active,.grade:active,.opt:active,.row.tap:active,.choice:active{transform:scale(.985)}
.ic-sm{width:20px;height:20px}
.pill-btn{min-height:44px;padding:0 14px 0 11px;border-radius:22px;background:var(--surface-2);color:var(--ink);font:600 var(--fs-s) var(--font-ui);display:inline-flex;align-items:center;gap:6px;flex:none}
.pill-btn svg{width:19px;height:19px}
.pill-btn.playing,.spk.playing .ring{animation:pulse .9s ease-in-out infinite}
.spk{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.spk .ring{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.spk svg{width:18px;height:18px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--halo)}50%{box-shadow:0 0 0 8px transparent}}
.lvl{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 9px 0 8px;border-radius:12px;border:1.5px solid var(--line-strong);font:700 var(--fs-f) var(--font-ui);color:var(--ink)}
.lvl i{display:flex;gap:2px}
.lvl i b{width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.35}
.lvl i b.on{background:var(--ink);opacity:1}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;gap:8px}
.hdr .ttl{font:700 var(--fs-b) var(--font-ui);display:flex;align-items:center;gap:8px}
.hdr .meta{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.back{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:2px;font:600 var(--fs-b) var(--font-ui);padding:0 12px 0 8px}
.back svg{width:22px;height:22px}
.lead{padding:4px 16px 0}
.lead .t-lt{margin:6px 0 10px}

/* Kelime kartı (Akış, Tekrar, Sözlük ve açılış ortak) */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.wcard .inner{flex:1;min-height:0;overflow:hidden;padding:18px 20px 12px;display:flex;flex-direction:column;gap:12px}
.wcard .inner > *,.ob-body > *,.center-scroll > *,.detail > *,.quiz > *{flex-shrink:0}
.wcard.scrolls .inner{overflow-y:auto;scrollbar-width:thin;-webkit-mask-image:linear-gradient(#000 calc(100% - 24px),transparent);mask-image:linear-gradient(#000 calc(100% - 24px),transparent)}
.wcard.scrolls.more::after{content:"Devamı ↓";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:3px 10px;border-radius:11px;background:var(--surface-2);font:600 var(--fs-cap) var(--font-ui);color:var(--ink-2);pointer-events:none}
.wcard .foot{padding:4px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.wmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px}
.wmeta .ipa{font:400 var(--fs-s) var(--font-en);color:var(--ink-2)}
.wmeta .pos{font:500 var(--fs-s) var(--font-ui);color:var(--ink-2)}
.wmeta .acts{display:inline-flex;align-items:center;gap:2px;margin-left:auto;flex:none}
.now-chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 10px;border-radius:13px;background:var(--surface-2);font:600 var(--fs-cap) var(--font-ui);color:var(--ink-2)}
.now-chip svg{width:13px;height:13px}
.wordrow{display:flex;align-items:center;gap:8px;min-width:0}
.wordrow .t-head{flex:0 1 auto}
.exblock{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.ex-h{display:flex;align-items:center;justify-content:space-between;min-height:32px;margin:-6px 0 -4px}
.ex-h span{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.ex-en{font:400 var(--fs-b)/1.4 var(--font-en);color:var(--ink)}
.ex-en b{font-weight:700}
.ex-tr{font:400 var(--fs-c)/1.38 var(--font-ui);color:var(--ink-2);margin-top:-2px}
.exrow{display:flex;gap:4px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow > div{flex:1;min-width:0}
.mist{background:var(--surface-2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.mist .h{display:flex;align-items:center;gap:6px;font:700 var(--fs-s) var(--font-ui);color:var(--ink)}
.mist .h svg{width:19px;height:19px;color:var(--caution)}
.mist .l{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.mist .tag{display:inline-flex;align-items:center;gap:3px;font:700 var(--fs-f) var(--font-ui);white-space:nowrap}
.mist .tag svg{width:13px;height:13px;stroke-width:3}
.mist .tag.bad{color:var(--bad)}
.mist .tag.good{color:var(--good)}
.mist .wrong{font:400 var(--fs-c)/1.4 var(--font-en);color:var(--ink)}
.mist .diff{text-decoration:underline dotted var(--bad);text-decoration-thickness:2px;text-underline-offset:4px}
.mist .right{font:700 var(--fs-c)/1.4 var(--font-en);color:var(--ink)}
.mist .fix{text-decoration:underline solid var(--ink);text-decoration-thickness:2px;text-underline-offset:3px}
.mist .why{font:400 var(--fs-s)/1.42 var(--font-ui);color:var(--ink-2)}
.mrow{display:none;align-items:center;gap:10px;min-height:52px;width:100%;text-align:left;padding:6px 12px;border-radius:14px;background:var(--surface-2)}
.mrow svg.lead-ic{width:20px;height:20px;color:var(--caution);flex:none}
.mrow svg.lead-ic.book{color:var(--ink-2)}
.mrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow .tx b{font:700 var(--fs-s) var(--font-ui)}
.mrow .tx span{font:500 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.mrow svg.chev{width:18px;height:18px;color:var(--ink-3)}
/* Kart sondan kısalır (ViewThatFits): c0 küçült, c1 Dikkat açıklaması gizlenir, c2 Dikkat satıra iner, c3 örnek de satıra iner, c4 kayar */
.c0 .t-gloss{font-size:var(--fs-t2)}
.c0 .now-wrap,.c0 .alt{display:none}
.c0 .inner{gap:8px}
.c0 .t-def{font-size:var(--fs-b)}
.c1 .mist .why{display:none}
.c2 .mist{display:none}
.c2 .mrow.m-dikkat{display:flex}
.c3 .exblock{display:none}
.c3 .mrow.m-dikkat{display:none}
.c3 .mrow.m-devam{display:flex}
.c4 .inner{overflow-y:auto}
.hint{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font:600 var(--fs-f) var(--font-ui)}
.hint svg{width:17px;height:17px}
.pager{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.pager i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.35;transition:all .2s}
.pager i.on{height:16px;border-radius:3px;background:var(--ink);opacity:1}
:root[data-theme="dark"] .pager i.on{background:var(--tint)}

/* Akış */
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.feed .slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:2px 14px calc(var(--bar-space) - 2px);display:flex}
.feed .slide .wcard{flex:1}
.phone[data-ax="1"] .feed{scroll-snap-type:none}
.phone[data-ax="1"] .feed .slide{height:auto;min-height:100%;padding-bottom:16px}
.phone[data-ax="1"] .feed .slide:last-child{padding-bottom:var(--bar-space)}
.phone[data-ax="1"] .feed .wcard .inner{overflow:visible}

/* Tekrar */
.rv{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px;gap:8px}
.rv .top{display:flex;align-items:center;gap:10px;min-height:52px}
.rv .top .mode{display:inline-flex;align-items:center;gap:5px;font:600 var(--fs-f) var(--font-ui);color:var(--ink-2);background:var(--surface-2);padding:4px 10px;border-radius:13px}
.rv .top .mode svg{width:14px;height:14px}
.phone[data-ax="1"] .rv .top .mode{display:none}
.phone[data-ax="1"] .row{flex-wrap:wrap}
.rv .top .cnt{white-space:nowrap;font:600 var(--fs-s) var(--font-ui);color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none}
.prog span{display:block;height:100%;border-radius:3px;background:var(--ink);transition:width .3s}
:root[data-theme="dark"] .prog span{background:var(--tint)}
.rv .deck{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(var(--safe-bottom) + 8px)}
.phone[data-device="se"] .rv .deck{padding-bottom:12px}
.rv .deck .wcard{flex:1;cursor:pointer}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;position:relative}
.front .t-head{font-size:min(calc(46px*var(--dt)),60px)}
.front .wmeta{justify-content:center}
.front .tap{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2);font:600 var(--fs-s) var(--font-ui)}
.front .spkpos{position:absolute;right:10px;top:10px}
.ask{font:600 var(--fs-s) var(--font-ui);color:var(--ink-2);text-align:center;margin-bottom:-2px}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grade{min-height:60px;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface-2);color:var(--ink);font:600 var(--fs-b)/1.15 var(--font-ui)}
.grade .gi{width:24px;display:grid;place-items:center;flex:none;color:var(--ink-2)}
.grade .gi svg{width:22px;height:22px}
.grade small{display:block;font:500 var(--fs-f) var(--font-ui);color:var(--ink-2);margin-top:2px}
.grade.good{background:var(--primary);color:var(--on-primary);box-shadow:var(--primary-glow)}
.grade.good .gi,.grade.good small{color:var(--on-primary);opacity:.92}
.phone[data-big="1"] .grade .gi{display:none}
.phone[data-ax="1"] .grade small{display:none}
.quiz{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.quiz .q{font:600 var(--fs-s) var(--font-ui);color:var(--ink)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:6px}
.qcard .s{font:400 var(--fs-t2)/1.4 var(--font-en)}
.blank{display:inline-block;min-width:3.2em;border-bottom:2.5px solid var(--ink);margin:0 2px;transform:translateY(-2px)}
.filled{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{min-height:56px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line-strong);padding:6px 16px;display:flex;align-items:center;gap:12px;text-align:left;font:400 var(--fs-t3) var(--font-en);color:var(--ink)}
.opt .tx{flex:1;min-width:0}
.opt .mk{display:inline-flex;align-items:center;gap:4px;font:700 var(--fs-f) var(--font-ui);white-space:nowrap}
.opt .mk svg{width:19px;height:19px}
.opt.right{background:var(--good-tint);border-color:var(--good);border-width:2px}
.opt.right .mk{color:var(--good)}
.opt.wrong{background:var(--bad-tint);border-color:var(--bad);border-width:2px}
.opt.wrong .mk{color:var(--bad)}
.fb{background:var(--surface-2);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb .h{display:flex;align-items:center;gap:8px;font:700 var(--fs-b) var(--font-ui)}
.fb .h svg{width:22px;height:22px}
.fb .h.ok svg{color:var(--good)}
.fb .h.no svg{color:var(--ink-2)}
.fb .m{font:400 var(--fs-c)/1.4 var(--font-ui);color:var(--ink)}
.fb .m b{font-family:var(--font-en)}
.fb .you{font:400 var(--fs-s)/1.4 var(--font-ui);color:var(--ink-2)}
.fb .you b{font-family:var(--font-en);color:var(--ink)}
.why-box{border-top:1px solid var(--line-strong);padding-top:8px;margin-top:2px;font:400 var(--fs-s)/1.42 var(--font-ui);color:var(--ink)}
.why-box b{display:block;font-weight:700;margin-bottom:2px}
.ret{display:flex;align-items:center;justify-content:center;gap:6px;font:500 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.ret svg{width:15px;height:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.asked{font:500 var(--fs-f) var(--font-ui);color:var(--ink-2);text-align:center}
.actbar{flex:none;display:flex;flex-direction:column;gap:8px;padding-top:4px}

/* Başlangıç, özet, bitti */
.center-scroll{padding:6px 16px 0;display:flex;flex-direction:column;gap:14px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:var(--shadow-card)}
.hero h2{margin:0;font:700 var(--fs-t1)/1.18 var(--font-ui);letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:0;font:400 var(--fs-c)/1.42 var(--font-ui);color:var(--ink-2);text-wrap:pretty}
.hero.left{align-items:stretch;text-align:left}
.pring{position:relative;width:132px;height:132px;display:grid;place-items:center}
.pring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);fill:none}
.pring .num{font:700 calc(32px*min(var(--dt),1.3)) var(--font-ui);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.pring .num small{display:block;font:500 calc(13px*min(var(--dt),1.3)) var(--font-ui);color:var(--ink-2);margin-top:3px}
.bandcheck{position:relative;width:132px;height:84px;display:grid;place-items:center}
.bandcheck::before{content:"";position:absolute;left:8px;right:8px;top:22px;bottom:14px;background:var(--band);box-shadow:var(--band-glow);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
:root[data-theme="dark"] .bandcheck::before{top:58px;bottom:12px;clip-path:none;border-radius:4px}
:root[data-theme="dark"] .bandcheck svg{stroke:var(--tint)}
.bandcheck svg{position:relative;width:62px;height:62px;stroke:var(--band-ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.schips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.schip{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 11px;border-radius:15px;background:var(--surface-2);font:600 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.schip svg{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font:700 var(--fs-b) var(--font-ui)}
.lock-note{display:flex;align-items:center;gap:12px;font:500 var(--fs-s)/1.4 var(--font-ui)}
.lock-note .ico{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.lock-note .ico svg{width:18px;height:18px}
.sumlist{display:flex;flex-direction:column}
.sumlist .si{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.sumlist .si:first-child{border-top:0;padding-top:2px}
.sumlist .w{font:700 var(--fs-b) var(--font-en)}
.sumlist .g{font:400 var(--fs-s) var(--font-ui);color:var(--ink-2);grid-column:1}
.sumlist .gch{grid-row:1;grid-column:2;justify-self:end;display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 10px;border-radius:14px;background:var(--surface-2);font:600 var(--fs-f) var(--font-ui)}
.sumlist .gch svg{width:15px;height:15px}
.sumlist .when{grid-row:2;grid-column:2;justify-self:end;display:inline-flex;align-items:center;gap:4px;font:500 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.sumlist .when svg{width:13px;height:13px}

/* Sözlük */
.sfield{margin:0 16px;min-height:52px;border-radius:26px;background:var(--surface-2);display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;border:1.5px solid transparent}
.sfield:focus-within{border-color:var(--ink);background:var(--surface)}
.sfield svg{width:21px;height:21px;color:var(--ink-2)}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:0;font:500 var(--fs-b) var(--font-ui);min-height:48px;color:var(--ink)}
.sfield input::placeholder{color:var(--ink-3)}
.sfield .x{width:44px;height:44px;display:grid;place-items:center;color:var(--ink-3)}
.try{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
.try::-webkit-scrollbar{display:none}
.try > *{flex:none}
.try .l{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.try .chip{font-size:var(--fs-s)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 28px}
.empty .gi{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.empty .gi svg{width:36px;height:36px}
.empty h3{margin:0;font:700 var(--fs-t2) var(--font-ui)}
.empty p{margin:0;font:400 var(--fs-c)/1.42 var(--font-ui);color:var(--ink-2)}
.empty p b{color:var(--ink)}
.res{display:flex;flex-direction:column;padding:6px 16px 0}
.res .cnt{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2);padding:6px 4px 6px}
.res .list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.rrow{min-height:68px;padding:10px 8px 10px 16px;display:flex;align-items:center;gap:10px;text-align:left;width:100%;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rrow .w{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rrow .w b{font:700 var(--fs-t3) var(--font-en)}
.rrow .g{font:600 var(--fs-b) var(--font-ui)}
.rrow .d{font:400 var(--fs-f) var(--font-en);color:var(--ink-2)}
.rrow .via{font:500 var(--fs-cap) var(--font-ui);color:var(--ink-2)}
.rrow .st{color:var(--good);display:inline-flex}
.hit{font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.rrow svg.chev{color:var(--ink-3);width:20px;height:20px}
.tip{display:flex;gap:8px;align-items:flex-start;padding:12px 6px;font:400 var(--fs-f)/1.4 var(--font-ui);color:var(--ink-2)}
.tip svg{width:17px;height:17px;flex:none;color:var(--ink-2)}
.tip b{color:var(--ink)}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:20px;padding:6px 6px 6px 14px}
.status .s{display:flex;align-items:center;gap:8px;font:600 var(--fs-s) var(--font-ui)}
.status .s svg{width:21px;height:21px}
.status .s.known{color:var(--good)}
.status .s.learning,.status .s.new{color:var(--ink-2)}
.status .btn{background:var(--surface);min-height:44px}
.info{display:flex;gap:10px;align-items:flex-start;font:400 var(--fs-c)/1.42 var(--font-ui)}
.info svg{width:21px;height:21px;color:var(--ink-2);margin-top:1px;flex:none}
.info b{display:block;font:700 var(--fs-s) var(--font-ui);margin-bottom:1px}
.sect{font:700 var(--fs-b) var(--font-ui);margin:8px 0 -4px}
.colls{display:flex;flex-direction:column;background:var(--surface-2);border-radius:16px;overflow:hidden}
.colls span{padding:10px 14px;font:400 var(--fs-c) var(--font-en);border-top:1px solid var(--line)}
.colls span:first-child{border-top:0}
.detail{padding:0 16px 8px;display:flex;flex-direction:column;gap:12px}

/* Ayarlar */
.sgroup{margin:0 16px;display:flex;flex-direction:column;gap:8px}
.sgroup > h3{margin:6px 4px 0;font:600 var(--fs-s) var(--font-ui);color:var(--ink-2)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.group.pad{padding:12px}
.row{min-height:52px;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .l{font:500 var(--fs-b) var(--font-ui);display:flex;align-items:center;gap:10px}
.row .l svg{width:20px;height:20px;color:var(--ink-2)}
.row .v{font:500 var(--fs-b) var(--font-ui);color:var(--ink-2);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.row .v.ok{color:var(--good)}
.row .v svg{width:18px;height:18px}
.row svg.chev{width:18px;height:18px;color:var(--ink-3)}
.foot-t{font:400 var(--fs-f)/1.42 var(--font-ui);color:var(--ink-2);margin:0 6px;text-wrap:pretty}
.seg{display:flex;background:var(--surface-2);border-radius:16px;padding:3px;gap:2px}
.seg button{flex:1;min-height:46px;min-width:44px;border-radius:13px;font:600 var(--fs-s) var(--font-ui);color:var(--ink-2);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.16),inset 0 0 0 1.5px var(--ink)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--tint);color:var(--tint)}
.phone[data-big="1"] .seg{flex-direction:column}
.swrap{display:flex;flex-direction:column;gap:6px}
.swrap .lab{font:600 var(--fs-s) var(--font-ui);margin-left:4px}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:var(--surface-3);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.swhit{min-width:60px;min-height:44px;display:flex;align-items:center;justify-content:flex-end}
.timechip{display:flex;align-items:center;gap:4px}
.timechip .tm{font:600 var(--fs-t3) var(--font-ui);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.stepb{width:44px;height:44px;border-radius:22px;background:var(--surface-2);display:grid;place-items:center}
.hstat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;width:100%;text-align:left;background:var(--good-tint);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.hstat .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:var(--surface);flex:none}
.hstat .ico svg{width:24px;height:24px;stroke-width:3}
.hstat b{display:block;font:700 var(--fs-b) var(--font-ui)}
.hstat span{font:400 var(--fs-f)/1.38 var(--font-ui);color:var(--ink-2)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--caution);font:400 var(--fs-s)/1.42 var(--font-ui)}
.banner svg{width:22px;height:22px;color:var(--caution);margin-top:1px;flex:none}
.banner .btn{margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border-radius:16px;padding:12px 8px;text-align:center}
.tile b{display:block;font:700 calc(26px*min(var(--dt),1.3)) var(--font-ui);line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font:500 var(--fs-cap)/1.25 var(--font-ui);color:var(--ink-2);display:block;margin-top:3px}
.lvbars{display:flex;flex-direction:column;gap:9px;padding-top:4px}
.lvb{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;font:700 var(--fs-s) var(--font-ui)}
.lvb .tr{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.lvb .tr i{display:block;height:100%;border-radius:4px;background:var(--ink)}
:root[data-theme="dark"] .lvb .tr i{background:var(--tint)}
.lvb small{font:500 var(--fs-cap) var(--font-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.kw{display:flex;align-items:center;gap:8px;min-height:60px;border-top:1px solid var(--line);padding:6px 6px 6px 14px}
.kw:first-child{border-top:0}
.kw .main{flex:1;min-width:0;text-align:left;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.kw b{font:700 var(--fs-b) var(--font-en)}
.kw span{font:500 var(--fs-s) var(--font-ui);color:var(--ink-2)}

.gprev{position:relative;border-radius:22px;overflow:hidden;min-height:168px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;
  background:radial-gradient(90% 60% at 30% 0%,rgba(233,224,64,.26),transparent 62%),linear-gradient(180deg,#1D2630,#0C1014 80%)}

.mode-glass .app-i i{background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.3)}

.hs .dock{position:absolute;left:calc(var(--sw)/2 - 164px);width:328px;bottom:calc(var(--safe-bottom) - 14px);height:86px;border-radius:34px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:flex;justify-content:space-around;align-items:center;padding:0 12px}

.wg{--wg-ink:var(--ink);--wg-ink2:var(--ink-2);--wg-btn:var(--surface-2);--wg-ico:var(--ink);position:relative;overflow:hidden;border-radius:24px;color:var(--wg-ink);flex:none;display:flex;flex-direction:column;padding:16px;font-family:var(--font-ui)}

.mode-tinted .wg{--wg-ink:#fff;--wg-ink2:rgba(255,255,255,.84);--wg-btn:rgba(255,255,255,.10);--wg-ico:#fff;--band:var(--tint-c);--band-ink:var(--tint-c);--band-top:auto;--band-glow:none;background:rgba(22,25,30,.66);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.mode-tinted .wg .w{color:var(--tint-c)}
.mode-glass .wg{--wg-ink:#fff;--wg-ink2:rgba(255,255,255,.9);--wg-btn:rgba(255,255,255,.18);--wg-ico:#fff;--band:rgba(255,255,255,.95);--band-ink:#fff;--band-top:auto;--band-glow:none;text-shadow:0 1px 3px rgba(20,20,40,.35);background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 0 0 1px rgba(255,255,255,.28),0 14px 30px -14px rgba(0,0,0,.5)}
.mode-tinted .wg .band::before,.mode-glass .wg .band::before,.ls .rect .band::before{bottom:-.17em;height:.1em;clip-path:polygon(.08em 0,100% 0,calc(100% - .08em) 100%,0 100%)}
.mode-tinted .wg .band::after,.mode-glass .wg .band::after,.ls .rect .band::after{display:none}
.wg-head{display:flex;align-items:baseline;gap:6px;min-height:24px;width:100%;flex:none}
.wg-head .w{font:700 20px/1.12 var(--font-en);white-space:nowrap;min-width:0;color:var(--wg-ink);padding:0 .12em .3em;margin:0 -.12em -.3em}
.wg-head .p{font:400 12px var(--font-en);color:var(--wg-ink2);white-space:nowrap}
.wg-head .lv{margin-left:auto;font:700 11px var(--font-ui);color:var(--wg-ink2);padding-left:4px}
.wg-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding-top:4px}

.wg-body .d{font:400 12.5px/1.28 var(--font-en);color:var(--wg-ink2);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.wg-body .e{font:400 12px/1.28 var(--font-en);color:var(--wg-ink2);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.wg-body .nx{font:500 11px var(--font-ui);color:var(--wg-ink2)}
.wg-medium .g{font-size:16px}

.wg-strip{display:flex;justify-content:space-between;margin:0 calc(8px - 16px) calc(8px - 16px);flex:none}
.wg-rail{display:flex;flex-direction:column;justify-content:space-between;margin:calc(8px - 16px) calc(8px - 16px) calc(8px - 16px) 0;flex:none}
.wb{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--wg-ico)}

/* ───────── Marka sayfası ───────── */
.tokens{--dt:1;--fs-head:40px;--fs-lt:34px;--fs-t1:28px;--fs-t2:22px;--fs-t3:20px;--fs-b:17px;--fs-c:16px;--fs-s:15px;--fs-f:13px;--fs-cap:12px}
.brandpage{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:30px;padding-top:12px}

.hit-demo .box i{display:block;width:34px;height:34px;border-radius:50%;background:var(--surface-2)}
.glassdemo{height:160px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(135deg,#8EB5CF,#B16E9E);display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;flex-wrap:wrap}
.glassdemo .g1{min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border-radius:22px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-weight:600;color:#15181B}
@media (max-width:760px){.bp-hero{grid-template-columns:1fr;padding:20px}}

/* Yerel ekran görüntüsü kipi (?bare=1): yalnız telefon ya da marka sayfası */
.bare{padding:0!important;background:#E6E5E0!important}
.bare .topbar,.bare .panel,.bare .stage-cap{display:none!important}
.bare .workspace{display:block;max-width:none;margin:0}
.bare .stage{padding:0;display:block}
.bare .brandpage{padding:20px 28px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ───────── Eleştirmen turu ekleri ───────── */
.now-wrap{display:flex}
.say-ic{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.say-ic svg{width:26px;height:26px}
.known-state{display:inline-flex;align-items:center;gap:6px;font:600 var(--fs-s) var(--font-ui);color:var(--good)}
.known-state svg{width:20px;height:20px}
.foot-l{display:flex;align-items:center;gap:6px}
.count-badge{width:96px;height:96px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;text-align:center;font:700 34px/1 var(--font-ui)}
.count-badge small{display:block;font:500 12px var(--font-ui);color:var(--ink-2);margin-top:2px}
.timepill{min-height:44px;padding:0 16px;border-radius:22px;background:var(--surface-2);font:600 var(--fs-b) var(--font-ui);font-variant-numeric:tabular-nums}
.deck-sum{display:flex;flex-direction:column;gap:2px;padding:0 4px 8px}
.deck-sum b{font:600 var(--fs-s) var(--font-ui)}
.deck-sum span{font:400 var(--fs-f)/1.38 var(--font-ui);color:var(--ink-2)}
.deck-sum .warn{display:flex;gap:6px;align-items:flex-start}
.deck-sum .warn svg{width:16px;height:16px;flex:none;color:var(--caution);margin-top:1px}
.statusline{display:flex;align-items:center;gap:8px;font:600 var(--fs-s) var(--font-ui);color:var(--ink-2)}
.statusline svg{width:21px;height:21px}
.statusline.known{color:var(--good)}
.btn-bordered{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.row .v.bad{color:var(--bad)}
.hstat.bad{background:var(--bad-tint);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.hstat.bad .ico{background:var(--bad)}
/* Söyle (telaffuz alıştırması) yarım sayfası */
.saybd{position:absolute;inset:0;z-index:72;background:rgba(5,6,8,.45);display:flex;align-items:flex-end;animation:fade .2s}
.saysheet{width:100%;max-height:78%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:8px 18px calc(var(--safe-bottom) + 16px);display:flex;flex-direction:column;gap:12px;animation:rise .25s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.saysheet .grab{width:38px;height:5px;border-radius:3px;background:var(--surface-3);align-self:center;margin-bottom:2px}
.saysheet .sh-top{display:flex;align-items:center;justify-content:space-between}
.saysheet .sh-top b{font:700 var(--fs-b) var(--font-ui)}
.saysheet .target{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.saysheet .target .w{font:700 calc(30px*var(--dt)) var(--font-en)}
.saysheet .target .s{font:400 var(--fs-t3)/1.35 var(--font-en)}
.saysheet .bigmic{min-height:64px;border-radius:32px;font:700 var(--fs-b) var(--font-ui)}
.saysheet .bigmic svg{width:24px;height:24px}
.saysheet .listen{display:flex;align-items:center;justify-content:center;gap:8px;font:600 var(--fs-s) var(--font-ui);color:var(--ink-2);min-height:44px}
.saysheet .verdict{background:var(--good-tint);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.saysheet .verdict b{display:flex;align-items:center;gap:6px;color:var(--good);font:700 var(--fs-b) var(--font-ui)}
.saysheet .verdict b svg{width:22px;height:22px}
.saysheet .verdict span{font:400 var(--fs-s) var(--font-ui);color:var(--ink)}
</style>
</head>

ue, often when it is not what people expect","gloss":"aslında, gerçekte","alt":["doğrusu","esasında"],"ex":[{"en":"I thought the test would be hard, but it was actually quite easy.","tr":"Sınavın zor olacağını sanıyordum ama aslında oldukça kolaymış."},{"en":"Actually, I'd prefer tea, if that's okay.","tr":"Aslında çay tercih ederim, sakıncası yoksa."},{"en":"He looks shy, but he actually loves meeting new people.","tr":"Çekingen görünüyor ama aslında yeni insanlarla tanışmaya bayılıyor."}],"mist":[{"wrong":"The actual price of petrol is very high.","right":"The current price of petrol is very high.","why":"'Güncel' = 'current'; 'actual' = gerçek/asıl."},{"wrong":"Actually I'm studying English. (= şu anda)","right":"I'm currently studying English.","why":"'Actually' zaman bildirmez; 'şu anda' için 'currently / at the moment'."}],"note":"Türkçedeki 'aktüel' = 'güncel'. İngilizce 'actual/actually' ise 'gerçek/aslında' demektir. 'Şu anda' için 'currently' veya 'at the moment' kullanılır.","mn":"ACT = eylem: 'actually' = fiilen, gerçekte. 'Aktüel' (güncel) tuzağına düşme.","coll":["actually quite","what actually happened","did you actually","but actually","actually, no"],"quiz":{"cloze":"He looks young, but he is ______ forty.","answer":"actually","distractors":["currently","recently","fortunately"]}},{"id":"en.date.n.1","lemma":"date","type":"word","pos":"n","level":"A2","ipa":"/deɪt/","micro":"a romantic meeting","short":"a planned time when two people meet because they like each other romantically","gloss":"romantik buluşma","alt":["randevu"],"ex":[{"en":"I have a date on Friday night.","tr":"Cuma akşamı bir randevum var."},{"en":"They went on a date to the cinema.","tr":"Randevu için sinemaya gittiler."},{"en":"How was your date with Elif?","tr":"Elif'le randevun nasıldı?"}],"mist":[{"wrong":"I have a date at the dentist.","right":"I have an appointment at the dentist.","why":"'Date' romantik buluşmadır; doktor, diş hekimi gibi randevular için 'appointment' kullanılır."}],"note":"Türkçe 'randevu' hem doktor randevusu hem romantik buluşma demektir. İngilizcede doktor randevusu 'appointment', romantik buluşma 'date' olur.","mn":null,"coll":["go on a date","first date","on a date","a date night","blind date"],"quiz":{"cloze":"Tomorrow night I'm going on a ______ with Elif. I really like her.","answer":"date","distractors":["lesson","meeting","salary"]}},{"id":"en.appointment.n.1","lemma":"appointment","type":"word","pos":"n","level":"A2","ipa":"/əˈpɔɪntmənt/","micro":"arranged time to see someone","short":"a time that you arrange to see a doctor or another person","gloss":"randevu","alt":[],"ex":[{"en":"I have a doctor's appointment at three.","tr":"Saat üçte doktor randevum var."},{"en":"Can I make an appointment for Monday?","tr":"Pazartesi için randevu alabilir miyim?"},{"en":"Mehmet missed his appointment because of the traffic.","tr":"Mehmet trafik yüzünden randevusunu kaçırdı."}],"mist":[{"wrong":"I took an appointment for Friday.","right":"I made an appointment for Friday.","why":"Türkçede 'randevu almak' dersiniz; İngilizcede 'take an appointment' denmez, 'make' ya da 'book an appointment' denir."}],"note":"Doktor ya da resmî görüşme için 'appointment'. Türkçede 'randevu' romantik buluşma da olabilir; bunun için 'date' denir.","mn":null,"coll":["make an appointment","book an appointment","cancel an appointment","a doctor's appointment"],"quiz":{"cloze":"I can't come on Monday. I have a doctor's ______ at ten.","answer":"appointment","distractors":["recipe","discount","parcel"]}},{"id":"en.spoon.n.1","lemma":"spoon","type":"word","pos":"n","level":"A1","ipa":"/spuːn/","micro":"tool for eating soup","short":"a small tool with a round end, used to eat soup or stir tea","gloss":"kaşık","alt":[],"ex":[{"en":"Can I have a spoon, please?","tr":"Bir kaşık alabilir miyim lütfen?"},{"en":"Maria stirred her coffee with a spoon.","tr":"Maria kahvesini bir kaşıkla karıştırdı."},{"en":"Kenji ate his soup with a big spoon.","tr":"Kenji function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function quizOptions(c) {
  const all = [c.quiz.answer, ...c.quiz.distractors];
  let h = hash(c.lemma);
  for (let i = all.length - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0; const j = h % (i + 1); [all[i], all[j]] = [all[j], all[i]]; }
  return all;
}
/* Türkçe harf katlama (aramada "odunc" → "ödünç"). Mockup harf harf katlar; uygulamadaki TextFold NFKD kullanıp
   boşlukları birleştirdiği için vurgu aralığı bir konum eşlemesiyle bulunmalı (README). */
function fold(s) {
  return String(s).toLocaleLowerCase('tr').replace(/[çğıöşüâîû]/g, c => ({ ç: 'c', ğ: 'g', ı: 'i', ö: 'o', ş: 's', ü: 'u', â: 'a', î: 'i', û: 'u' }[c]));
}
function posLabel(c) { return POS[c.pos] || c.pos; }
function stemRe(lemma) {
  const parts = lemma.split(' ').map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return new RegExp('\\b' + parts.map(p => p + '\\w*').join(' ') + '\\b', 'i');
}
/* Örnek cümlede öğrenilen kelime kalın; cls "mark" ise sarı iz de alır (ekranda en fazla iki sarı iz). */
function markWord(sentence, lemma, cls = 'mark') {
  const m = sentence.match(stemRe(lemma));
  if (!m) return esc(sentence);
  return esc(sentence.slice(0, m.index)) + `<b class="${cls}">${esc(m[0])}</b>` + esc(sentence.slice(m.index + m[0].length));
}
/* Dikkat kutusu: yanlış cümle ile doğru cümlenin ilk seçeneği kelime kelime karşılaştırılır (en uzun ortak dizi).
   Ortakta olmayan kelimeler işaretlenir; "/" sonrası diğer doğru seçenekler işaretsiz gösterilir. */
function diffPair(wrong, right) {
  const norm = w => w.toLowerCase().replace(/[^a-z'çğıöşü]/g, '');
  const [first, ...rest] = right.split(' / ');
  const a = wrong.split(/\s+/), b = first.split(/\s+/);
  const L = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) {
    L[i][j] = norm(a[i]) && norm(a[i]) === norm(b[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  }
  const keepA = new Set(), keepB = new Set();
  for (let i = 0, j = 0; i < a.length && j < b.length;) {
    if (norm(a[i]) && norm(a[i]) === norm(b[j])) { keepA.add(i); keepB.add(j); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  const paint = (toks, keep, cls) => toks.map((t, i) => keep.has(i) || !norm(t) ? esc(t) : `<span class="${cls}">${esc(t)}</span>`).join(' ');
  return [paint(a, keepA, 'diff'), paint(b, keepB, 'fix') + (rest.length ? ' / ' + esc(rest.join(' / ')) : '')];
}
const wordRe = w => new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');

function lvl(level) {

}

function mistakeBox(m) {
  const [w, r] = diffPair(m.wrong, m.right);
  return `<div class="mist"><div class="h">${ic('warn')}Dikkat</div>
    <div class="l"><span class="tag bad">${ic('x')}Yanlış</span><span class="wrong" lang="en">${w}</span>
    <span class="tag good">${ic('check')}Doğru</span><span class="right" lang="en">${r}</span></div>
    <div class="why">${esc(m.why)}</div></div>`;
}
function compactRows(c) {
  return `<button type="button" class="mrow m-dikkat" data-act="open" data-id="${esc(c.lemma)}">${ic('warn', 'lead-ic')}<span class="tx"><b>Dikkat</b><span>Sık yapılan hatayı gör</span></span>${ic('chevR', 'chev')}</button>
    <button type="button" class="mrow m-devam" data-act="open" data-id="${esc(c.lemma)}">${ic('book', 'lead-ic book')}<span class="tx"><b>Kartın devamı</b><span>Örnek cümle ve Dikkat notu</span></span>${ic('chevR', 'chev')}</button>`;
}
function cardInner(c, opts = {}) {
  return `${headBlock(c, opts)}${glossBlock(c)}<div class="t-def" lang="en">${esc(c.short)}</div>${exampleBlock(c)}${c.mist[0] ? mistakeBox(c.mist[0]) : ''}${opts.compact ? compactRows(c) : ''}`;
}
function ring(value, total, center, size = 132, stroke = 11) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, f = total ? Math.min(1, value / total) : 0;
  return `<div class="pring" style="width:${size}px;height:${size}px" role="img" aria-label="${value} / ${total}">
    <svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--surface-3)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--tint)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C * f} ${C}"/></svg>
    <div class="num">${center}</div></div>`;
}

/* Cevaptan sonra yalnız ilgili şıklar kalır (doğru cevap ve yanlış seçim), geri bildirim görünür alana kayar. */
function quizView(c) {
  const r = S.rv, q = c.quiz, opts = quizOptions(c), picked = r.picked, done = picked != null, right = picked === q.answer;
  const parts = q.cloze.split(/_{3,}/);
  const sentence = done ? `${esc(parts[0])}<span class="filled">${esc(q.answer)}</span>${esc(parts[1] ?? '')}` : `${esc(parts[0])}<span class="blank" aria-label="boşluk"></span>${esc(parts[1] ?? '')}`;
  const shown = done ? opts.filter(o => o === q.answer || o === picked) : opts;
  const optHTML = shown.map(o => {
    let cls = '', mk = '';
    if (done) {
      if (o === q.answer) { cls = 'right'; mk = `<span class="mk">${ic('checkc')}Doğru cevap</span>`; }
      else { cls = 'wrong'; mk = `<span class="mk">${ic('xc')}Yanlış</span>`; }
    }
    return `<button type="button" class="opt ${cls}" data-act="pick" data-o="${esc(o)}" lang="en" ${done ? 'aria-disabled="true"' : ''}><span class="tx">${esc(o)}</span>${mk}</button>`;
  }).join('');
  let fb = '', bar = '';
  if (done) {
    const pc = CARD[picked];
    const rule = !right && c.mist.find(m => wordRe(picked).test(m.wrong) || wordRe(picked).test(m.right));
    fb = `<div class="fb" id="quizfb" aria-live="polite">${right ? `<div class="h ok">${ic('checkcf')}Doğru!</div>` : `<div class="h no">${ic('bulb')}Doğrusu: <span class="en">${esc(q.answer)}</span></div>`}
        <div class="m"><b>${esc(c.lemma)}</b> = ${esc(c.gloss)}</div>
        ${!right ? `<div class="you">Senin seçtiğin: <b>${esc(picked)}</b>${pc ? ` = ${esc(pc.gloss)}` : ''}</div>` : ''}
        ${rule ? `<div class="why-box"><b>Neden?</b>${esc(rule.why)}</div>` : ''}</div>`;
    bar = right
      ? `<div class="actbar"><button type="button" class="btn btn-primary btn-lg block" data-act="qnext">Devam</button>
          <div class="asked">Ya da bu soru nasıl geldi?</div><div class="two"><button type="button" class="btn btn-secondary" data-act="qgrade" data-g="hard">${ic('tortoise', 'ic-sm')}Zordu</button><button type="button" class="btn btn-secondary" data-act="qgrade" data-g="easy">${ic('hare', 'ic-sm')}Kolaydı</button></div></div>`
      : `<div class="actbar"><div class="ret">${ic('clock')}Bu kelime 10 dakika sonra yine gelir.</div><button type="button" class="btn btn-primary btn-lg block" data-act="qnext">Devam</button></div>`;
  }
  return `<div class="deck"><div class="scroll" id="quizscroll" style="margin:0 -16px;padding:4px 16px 12px"><div class="quiz">${done ? '' : '<div class="q">Boşluğa hangisi gelir?</div>'}
    <div class="qcard"${done ? ' style="padding:12px 16px"' : ''}><div class="s" lang="en">${sentence}</div>${done ? `<div style="display:flex;justify-content:flex-end;margin:-4px -6px -6px 0">${spk(q.cloze.replace(/_{3,}/, q.answer))}</div>` : ''}</div>
    <div class="opts" role="group" aria-label="Şıklar">${optHTML}</div>${fb}</div></div>${bar}</div>`;
}

/* ───────── Sözlük ───────── */
function search(q) {
  const f = fold(q).trim();
  if (!f) return [];
  const out = [];
  for (const c of CARDS) {
    let via = null;
    if (fold(c.lemma).startsWith(f)) via = 'en';
    else if (fold(c.gloss).split(/[ ,]+/).some(w => w.startsWith(f)) || fold(c.gloss).startsWith(f)) via = 'tr';
    else if (c.alt.some(a => fold(a).startsWith(f))) via = 'alt';
    if (via) out.push({ c, via });
  }
  return out.sort((a, b) => (a.via === 'alt') - (b.via === 'alt') || a.c.lemma.length - b.c.lemma.length);
}
function hl(text, q) {
  const f = fold(q).trim(), t = String(text), ft = fold(t);
  let i = ft.startsWith(f) ? 0 : ft.indexOf(' ' + f) >= 0 ? ft.indexOf(' ' + f) + 1 : ft.indexOf(f);
  if (i < 0 || !f) return esc(t);
  return esc(t.slice(0, i)) + '<b class="hit">' + esc(t.slice(i, i + f.length)) + '</b>' + esc(t.slice(i + f.length));
}
function resultsHTML() {
  const q = S.q.trim();
  if (!q) return `<div class="empty"><div class="gi">${ic('book')}</div><h3>Kelime ara</h3><p>İngilizce bir kelime ya da Türkçe anlamını yaz. <b>kahv</b> yazınca <b>breakfast</b> çıkar.</p></div>`;
  const rs = search(q);
  if (!rs.length) return `<div class="empty"><div class="gi">${ic('search')}</div><h3>"${esc(q)}" bulunamadı</h3><p>Kelimenin başını yazmayı dene. Türkçe harfler gerekmez: <b>odunc</b> da <b>ödünç</b> bulur.</p></div>`;
  return `<div class="res"><div class="cnt">${rs.length} sonuç</div><div class="list">${rs.map(({ c, via }) => {
    const st = learnState(c.lemma);
    return `<button type="button" class="rrow" data-act="open" data-id="${esc(c.lemma)}">
      <span class="main"><span class="w"><b lang="en">${via === 'en' ? hl(c.lemma, q) : esc(c.lemma)}</b>${lvl(c.level)}${st === 'known' ? `<span class="st" aria-label="Biliyorsun">${ic('checkc', 'ic-sm')}</span>` : ''}</span>
      <span class="g">${via === 'tr' ? hl(c.gloss, q) : esc(c.gloss)}</span>
      ${via === 'alt' ? `<span class="via">Ayrıca: ${hl(c.alt.join(', '), q)}</span>` : `<span class="d" lang="en">${esc(c.micro)}</span>`}</span>${ic('chevR', 'chev')}</button>`;
  }).join('')}</div>
    <div class="tip">${ic('bulb')}<span>Türkçe harfleri yazmasan da bulur: <b>odunc</b> yazınca <b>ödünç</b> çıkar.</span></div></div>`;

/* ViewThatFits taklidi: en dolu düzenden başlayıp sığanı seçer (HomeWordViews.swift ile aynı sıra). */
function widgetVariants(kind, c) {
  const g = n => `<div class="g" style="-webkit-line-clamp:${n}">${esc(c.gloss)}</div>`;
  const d = (n, t) => `<div class="d" lang="en" style="-webkit-line-clamp:${n}">${esc(t)}</div>`;
  const ex = c.ex.filter(x => stemRe(c.lemma).test(x.en)).sort((a, b) => a.en.length - b.en.length)[0] || c.ex[0];
  const e = `<div class="e" lang="en" style="-webkit-line-clamp:1">${markWord(ex.en, c.lemma, '')}</div>`;
  const nx = `<div class="nx">Yeni kelime: 10:00</div>`;
  if (kind === 'small') return [g(2) + d(2, c.micro), g(2) + d(1, c.micro), g(2)];
  return [g(1) + d(2, c.short) + e + nx, g(1) + d(2, c.short) + e, g(1) + d(1, c.short) + e, g(1) + d(2, c.short), g(1) + d(1, c.short)];
}
function fitWidgets() {
  $$('#viewport [data-shrink]').forEach(el => {
    el.style.fontSize = ''; el.style.overflow = 'hidden';
    let size = parseFloat(getComputedStyle(el).fontSize); const min = size * .6;
    while (el.scrollWidth > el.clientWidth + .5 && size > min) { size -= .5; el.style.fontSize = size + 'px'; }
  });
  $$('#viewport [data-fit]').forEach(el => {
    const vs = widgetVariants(el.dataset.fit, CARD[el.dataset.id]);
    for (const v of vs) { el.innerHTML = v; if (el.scrollHeight <= el.clientHeight + .5) return; }
  });
  /* Satır içi: "kelime · tüm karşılık" → "kelime · ilk karşılık" → "kelime". */
  $$('#viewport [data-inline]').forEach(el => {
    const c = CARD[el.dataset.inline], first = c.gloss.split(',')[0].trim();
    const vs = [`<b>${esc(c.lemma)}</b> · ${esc(c.gloss)}`, `<b>${esc(c.lemma)}</b> · ${esc(first)}`, `<b>${esc(c.lemma)}</b>`];
    for (const v of vs) { el.innerHTML = v; if (el.scrollWidth <= el.clientWidth + .5) return; }
  });
}
