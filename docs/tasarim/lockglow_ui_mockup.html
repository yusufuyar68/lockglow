    case 'ob-2': S.view = 'onboard'; S.ob.page = 1; S.ob.topics.clear(); break;
    case 'ob-2s': S.view = 'onboard'; S.ob.page = 1; S.ob.topics = new Set(['food_drink', 'travel_tourism', 'phrasal_verbs']); break;
    case 'ob-3': S.view = 'onboard'; S.ob.page = 2; S.ob.place = 'lock'; break;
    case 'ob-3h': S.view = 'onboard'; S.ob.page = 2; S.ob.place = 'home'; break;
    case 'ob-4': S.view = 'onboard'; S.ob.page = 3; S.ob.level = S.ob.level || 'A2'; break;
    case 'st-topics': go('settings'); Object.assign(S.st, { push: 'topics', sheet: false }); break;
    case 'st-guide': go('settings'); Object.assign(S.st, { push: 'guide', sheet: false }); break;
    case 'st': go('settings'); Object.assign(S.st, { push: null, sheet: false, healthBad: false, denied: false }); break;
    case 'st-known': go('settings'); Object.assign(S.st, { push: 'known', sheet: false }); break;
    case 'st-health': go('settings'); Object.assign(S.st, { push: 'health', sheet: false, healthBad: false }); break;
    case 'st-health-bad': go('settings'); Object.assign(S.st, { push: 'health', sheet: false, healthBad: true }); break;
    case 'st-reset': go('settings'); Object.assign(S.st, { push: null, sheet: true }); break;
    case 'st-denied': go('settings'); Object.assign(S.st, { push: null, sheet: false, denied: !S.st.denied }); break;
    case 'st-recovery': go('settings'); Object.assign(S.st, { push: null, sheet: false, recovery: !S.st.recovery }); break;
  }
  render({ resetScroll: true });
}


/* ───────── Çizim ───────── */
const TABS = [['feed', 'Akış', 'stack'], ['review', 'Tekrar', 'cycle'], ['search', 'Sözlük', 'search'], ['settings', 'Ayarlar', 'gear']];
function appHTML() {
  const screen = { feed: renderFeed, review: renderReview, search: renderSearch, settings: renderSettings }[S.tab]();
  const tabs = TABS.map(([id, t, icn]) => `<button type="button" class="tab" role="tab" data-act="tab" data-v="${id}" aria-selected="${S.tab === id}">${ic(icn)}${t}${id === 'settings' && S.st.recovery ? '<span class="dot" aria-label="uyarı"></span>' : ''}</button>`).join('');
  return `<div class="app${inRound() ? ' round' : ''}"><div class="page">${screen}</div><nav class="tabbar" role="tablist" aria-label="Sekmeler">${tabs}</nav>${sheetHTML()}${sayHTML()}</div>`;
}
let lastKey = '';
function screenKey() {
  if (S.view === 'onboard') return 'ob|' + S.ob.page;
  if (S.view !== 'app') return 'w';
  return [S.tab, S.rv.phase, S.rv.i, S.open, S.st.push].join('|');
}
function render(opt = {}) {
  const root = document.documentElement, ph = $('#phone');
  root.dataset.theme = S.theme;
  ph.dataset.device = S.device; ph.dataset.os = S.os; ph.dataset.big = S.dt >= 3 ? '1' : '0'; ph.dataset.ax = S.dt >= 4 ? '1' : '0';
  ph.style.setProperty('--dt', DT[S.dt].v);
  $$('[data-act^="view:"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === 'view:' + S.view));
  $$('[data-act^="theme:"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === 'theme:' + S.theme));
  $$('[data-act^="os:"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === 'os:' + S.os));
  $$('[data-act^="device:"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === 'device:' + S.device));
  $('#dtRange').value = S.dt;
  $('#dtLabel').textContent = 'YAZI BOYUTU (DİNAMİK TÜR): ' + DT[S.dt].l.toLocaleUpperCase('tr');
  const brand = S.view === 'brand';
  $('#workspace').hidden = brand; $('#brandView').hidden = !brand;
  if (brand) { $('#brandView').innerHTML = renderBrand(); return; }

  const key = screenKey(), prev = $('#viewport .scroll');
  const keep = !opt.resetScroll && key === lastKey && prev ? prev.scrollTop : 0;
  lastKey = key;
  const vp = $('#viewport');
  vp.innerHTML = S.view === 'app' ? appHTML() : S.view === 'onboard' ? renderOnboard() : renderWidgets();
  const onWall = S.view === 'widgets';
  $('#statusbar').classList.toggle('light', onWall);
  $('#homebar').classList.toggle('light', onWall);
  $('#stageCap').innerHTML = S.view === 'onboard'
    ? 'Açılış akışı: dört adım, ödeme ekranı yok. Seviye seçilince "Devam" yanar; "Atla" her adımda var.'
    : onWall
    ? 'Widget düğmeleri çalışır: ✓ Biliyorum, hoparlör Dinle, ileri oku Sonraki. Sağ panelden modu ve kelimeyi değiştir.'
    : 'Telefonun içindeki sekme çubuğuyla gezin. Kartlar gerçek içerikten: <code>content/drafts/kisisel_v1</code>. Birleşik tasarım: A temel, B şeridi, C iOS 26 kuralları.';
  const sc = $('#viewport .scroll'); if (sc && keep) sc.scrollTop = keep;
  if (S.view === 'app' && S.tab === 'feed') hookFeed();
  if (S.view === 'app' && S.tab === 'search' && !S.open) hookSearch();
  if (onWall) fitWidgets();
  fitHeads(); fitLadder(); markOverflow();
  const qs = $('#quizscroll'); if (qs && S.rv.picked != null) qs.scrollTop = qs.scrollHeight;
  renderNotes(); renderJumps();
  fitPhone();
  requestAnimationFrame(audit);
}
/* Uzun kelime bölünmez: tek satıra sığana kadar küçülür (SwiftUI'da .lineLimit(1) + .minimumScaleFactor(0.6)). */
function fitHeads() {
  $$('#viewport .t-head').forEach(el => {
    el.style.fontSize = '';
    let size = parseFloat(getComputedStyle(el).fontSize); const min = size * .6;
    while (el.scrollWidth > el.clientWidth + .5 && size > min) { size -= 1; el.style.fontSize = size + 'px'; }
  });
}
/* Akış kartı sondan kısalır: c0 yazıyı küçültür, c1 Dikkat açıklamasını gizler, c2 Dikkat'i, c3 örneği satıra indirir, c4'te kart kayar. */
function fitLadder() {
  $$('#viewport [data-ladder]').forEach(card => {
    const inner = card.querySelector('.inner');
    card.classList.remove('c0', 'c1', 'c2', 'c3', 'c4');
    if (isAX()) return;
    for (const step of ['c0', 'c1', 'c2', 'c3', 'c4']) {
      if (inner.scrollHeight <= inner.clientHeight + 1) break;
      card.classList.add(step);
    }
  });
}
/* Tekrar kartı taşıyorsa altta "Devamı" ipucu; sona gelince kalkar. */
function markOverflow() {
  $$('#viewport .wcard.scrolls').forEach(card => {
    const inner = card.querySelector('.inner');
    const upd = () => card.classList.toggle('more', inner.scrollHeight - inner.scrollTop - inner.clientHeight > 4);
    upd(); inner.addEventListener('scroll', upd, { passive: true });
  });
}
function hookFeed() {
  const f = $('#feed');
  f.scrollTop = S.feedIndex * f.clientHeight;
  let t;
  f.addEventListener('scroll', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const i = Math.round(f.scrollTop / f.clientHeight);
      if (i !== S.feedIndex) S.feedIndex = i;
    }, 60);
  }, { passive: true });
}
function hookSearch() {
  const q = $('#q');
  q.addEventListener('input', () => {
    S.q = q.value;
    $('#results').innerHTML = resultsHTML();
    $('#tryBox').innerHTML = tryChips();
    $('.sfield .x').hidden = !S.q;
    requestAnimationFrame(audit);
  });
}
function fitPhone() {
  const box = $('#phoneBox'), ph = $('#phone'), stage = $('#stage');
  ph.style.transform = 'none';
  const w = ph.offsetWidth, h = ph.offsetHeight;
  const availW = Math.max(240, stage.clientWidth), availH = Math.max(640, window.innerHeight - 96);
  const k = document.body.classList.contains('bare') ? 1 : Math.min(1, availW / w, availH / h);
  S.scale = k;
  ph.style.transform = `scale(${k})`;
  box.style.width = w * k + 'px'; box.style.height = h * k + 'px';
}
/* 44 pt denetimi: telefonun içindeki her dokunulabilir öğeyi ölçer (ölçek düzeltilmiş). */
function audit() {
  const k = S.scale || 1, bad = [];
  const els = $$('#viewport :is(button,input,summary,[role="button"])').filter(el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
  for (const el of els) {
    const t = el.tagName === 'INPUT' ? (el.closest('.sfield') || el) : el;
    const r = t.getBoundingClientRect();
    const w = r.width / k, h = el.classList.contains('hit44') ? Math.max(44, r.height / k) : r.height / k;
    if (w < 43.5 || h < 43.5) bad.push(`${(el.getAttribute('aria-label') || el.textContent).trim().slice(0, 24)} (${Math.round(w)}×${Math.round(h)})`);
  }
  const a = $('#audit');
  a.classList.toggle('bad', bad.length > 0);
  a.innerHTML = bad.length
    ? `Dokunma alanı: <b>${bad.length} öğe 44 pt'nin altında</b>: ${esc(bad.join(', '))}`
    : `Dokunma alanı denetimi: bu ekrandaki <b>${els.length} öğenin hepsi 44 × 44 pt ve üstü</b>.`;
  window.__audit = { total: els.length, bad };
}
let toastTimer;
function toast(text, undo) {
  $$('#viewport .toast').forEach(t => t.remove());
  const host = $('#viewport .app') || $('#viewport');
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  if (S.view === 'widgets') el.style.bottom = 'calc(var(--safe-bottom) + 110px)';
  el.innerHTML = `<span>${esc(text)}</span>${undo ? `<button type="button" data-act="${undo}">Vazgeç</button>` : ''}`;
  host.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 4000);
}
function say(text, el) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(x => x.lang === 'en-US');
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { /* ses yoksa yalnız görsel geri bildirim */ }
  el.classList.add('playing');
  setTimeout(() => el.classList.remove('playing'), Math.min(2600, 600 + text.length * 55));
}

/* ───────── Olaylar ───────── */
let lastUndo = null;
function answer(g) {
  const r = S.rv, id = DECK[r.kind][r.i];
  r.answers.push({ id, g, when: r.kind === 'new' ? GRADE_BY[g].sub : DUE_WHEN[g] });
  if (g !== 'again') { S.learning.add(id); }
  r.revealed = false; r.picked = null;
  if (r.i + 1 < DECK[r.kind].length) r.i++;
  else finishRound();
}
function finishRound() {
  const r = S.rv;
  if (r.kind === 'new') r.newDone += r.answers.length; else r.dueDone += r.answers.length;
  r.phase = r.answers.length ? 'summary' : 'start';
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const [k, arg] = act.split(':');
  const r = S.rv;
  switch (k) {
    case 'view': S.view = arg; S.wg.word = S.wg.word || 0; render({ resetScroll: true }); return;
    case 'theme': S.theme = arg; render(); return;
    case 'os': S.os = arg; render(); return;
    case 'device': S.device = arg; render(); return;
    case 'tab': S.tab = v; S.say = null; if (v === 'settings' && S.st.sheet) S.st.sheet = false; render({ resetScroll: true }); return;
    case 'say': case 'wsay': say(el.dataset.say, el); return;
    case 'say-open': S.say = { id: el.dataset.id, mode: 'word', state: 'idle' }; render(); return;
    case 'say-close': S.say = null; render(); return;
    case 'say-bg': if (e.target === el) { S.say = null; render(); } return;
    case 'say-mode': S.say.mode = v; S.say.state = 'idle'; render(); return;
    case 'say-go':
      if (S.say.state === 'listening') { S.say.state = 'done'; render(); return; }
      S.say.state = 'listening'; render();
      setTimeout(() => { if (S.say && S.say.state === 'listening') { S.say.state = 'done'; render(); } }, 1400);
      return;
    case 'waod': S.wg.aod = v === '1'; render(); return;
    case 'jump': jump(el.dataset.j); return;
    case 'feedknow': {
      const id = el.dataset.id;
      if (S.known.has(id)) { S.known.delete(id); render(); toast(`${id} öğrenmeye geri alındı`); }
      else { S.known.add(id); lastUndo = id; render(); toast(`${id} bildiğin kelimelere eklendi`, 'undo-known'); }
      return;
    }
    case 'undo-known': if (lastUndo) { S.known.delete(lastUndo); lastUndo = null; render(); toast('Geri alındı'); } return;
    case 'start': startRound(r.kind); render({ resetScroll: true }); return;
    case 'reveal': r.revealed = true; render({ resetScroll: true }); return;
    case 'grade': answer(el.dataset.g); render({ resetScroll: true }); return;
    case 'pick': if (r.picked == null) { r.picked = el.dataset.o; render(); } return;
    case 'qnext': answer(r.picked === CARD[DECK.due[r.i]].quiz.answer ? 'good' : 'again'); render({ resetScroll: true }); return;
    case 'qgrade': answer(el.dataset.g); render({ resetScroll: true }); return;
    case 'finish': finishRound(); render({ resetScroll: true }); return;
    case 'sumok': if (r.kind === 'due') Object.assign(r, { phase: 'start', kind: 'new' }); else r.phase = 'done'; render({ resetScroll: true }); return;
    case 'more': startRound('new'); render({ resetScroll: true }); return;
    case 'goto-goal': S.tab = 'settings'; S.st.push = null; render({ resetScroll: true }); return;
    case 'tryq': S.q = el.dataset.q; S.open = null; render(); return;
    case 'clearq': S.q = ''; render(); $('#q')?.focus(); return;
    case 'open': S.open = el.dataset.id; S.from = 'search'; render({ resetScroll: true }); return;
    case 'open-known': S.tab = 'search'; S.open = el.dataset.id; S.from = 'known'; render({ resetScroll: true }); return;
    case 'back':
      if (S.from === 'known') { S.tab = 'settings'; S.st.push = 'known'; }
      S.open = null; S.from = null; render({ resetScroll: true }); return;
    case 'markknown': S.known.add(el.dataset.id); render(); toast(`${el.dataset.id}: Biliyorum`); return;
    case 'undoknown': S.known.delete(el.dataset.id); S.learning.add(el.dataset.id); render(); toast('Öğrenmeye geri alındı'); return;
    case 'ob-level': case 'stlevel': S.ob.level = v; render(); return;
    case 'ob-topic': case 'st-topic':
      if (v === 'all') S.ob.topics.clear(); else if (S.ob.topics.has(v)) S.ob.topics.delete(v); else S.ob.topics.add(v);
      render(); return;
    case 'ob-place': case 'st-place': S.ob.place = v; render(); return;
    case 'ob-back': S.ob.page = Math.max(0, S.ob.page - 1); render({ resetScroll: true }); return;
    case 'ob-next':
      if (S.ob.page === 0 && !S.ob.level) return;
      if (S.ob.page < 3) { S.ob.page++; render({ resetScroll: true }); return; }
      S.view = 'app'; S.tab = 'feed'; S.feedIndex = 0; render({ resetScroll: true }); toast("Hazırsın. Kelimeler Akış'ta ve widget'ta."); return;
    case 'ob-skip': S.view = 'app'; S.tab = 'feed'; render({ resetScroll: true }); toast('Açılış atlandı. Seçimlerin kaydedildi.'); return;
    case 'ob-restart': S.ob.page = 0; S.view = 'onboard'; render({ resetScroll: true }); return;
    case 'freq': S.st.freq = +v; render(); return;
    case 'goal': S.st.goal = +v; render(); return;
    case 'rem': if (S.st.denied) { toast('Önce iPhone Ayarları\'nda bildirim iznini aç.'); return; } S.st.rem = !S.st.rem; render(); return;
    case 'remstep': S.st.remMin = (S.st.remMin + (+v) + 1440) % 1440; render(); return;
    case 'push': S.st.push = v; render({ resetScroll: true }); return;
    case 'pop': S.st.push = null; render({ resetScroll: true }); return;
    case 'reset': S.st.sheet = true; render(); return;
    case 'sheetbg': if (e.target === el) { S.st.sheet = false; render(); } return;
    case 'reset-no': S.st.sheet = false; render(); return;
    case 'reset-yes': S.st.sheet = false; S.known.clear(); S.learning.clear(); render(); toast('İlerleme sıfırlandı'); return;
    case 'recovery-ok': S.st.recovery = false; render(); return;
    case 'known-undo': {
      const id = el.dataset.id; S.known.delete(id); S.learning.add(id); lastUndo = id; render(); toast(`${id} geri alındı`, 'redo-known'); return;
    }
    case 'redo-known': if (lastUndo) { S.known.add(lastUndo); lastUndo = null; render(); } return;
    case 'health-refresh': toast("Widget'lar yenilendi"); return;
    case 'wsurface': S.wg.surface = v; render(); return;
    case 'wmode': S.wg.mode = v; render(); return;
    case 'wtint': S.wg.tint = v; render(); return;
    case 'wwall': S.wg.wall = v; render(); return;
    case 'wword': S.wg.word = +v; render(); return;
    case 'wnext': S.wg.word = (S.wg.word + 1) % WIDGET_WORDS.length; render(); return;
    case 'wknow': { const id = WIDGET_WORDS[S.wg.word]; S.wg.word = (S.wg.word + 1) % WIDGET_WORDS.length; render(); toast(`Biliyorum: ${id} sıradan çıktı`); return; }
  }
});
document.addEventListener('keydown', e => {
  const el = e.target.closest?.('[role="button"][data-act]');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); el.click(); }
  if (S.view === 'app' && S.tab === 'feed' && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest?.('#feed')) {
    e.preventDefault(); jump(e.key === 'ArrowDown' ? 'feednext' : 'feedprev');
  }
});
$('#dtRange').addEventListener('input', e => { S.dt = +e.target.value; render(); });
$('#targetsBox').addEventListener('change', e => { document.body.classList.toggle('show-targets', e.target.checked); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view !== 'brand') { fitPhone(); fitLadder(); if (S.view === 'app' && S.tab === 'feed') { const f = $('#feed'); if (f) f.scrollTop = S.feedIndex * f.clientHeight; } } }, 80); });

/* ───────── Başlangıç ───────── */
(function init() {
  document.documentElement.lang = 'tr';
  // Görüntüleyici temayı zaten seçtiyse onu kullan, yoksa sistem ayarını.
  const preset = document.documentElement.dataset.theme;
  S.theme = preset === 'dark' || preset === 'light' ? preset : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const h = location.hash.replace('#', '');
  const map = { akis: ['app', 'feed'], tekrar: ['app', 'review'], sozluk: ['app', 'search'], ayarlar: ['app', 'settings'], widgetlar: ['widgets'], marka: ['brand'], acilis: ['onboard'] };
  if (map[h]) { S.view = map[h][0]; if (map[h][1]) S.tab = map[h][1]; }
  // Yerel ekran görüntüsü için adres parametreleri, ör. ?bare=1&state=card-rev&theme=dark&device=se&dt=3
  const p = new URLSearchParams(location.search);
  if (p.has('theme')) S.theme = p.get('theme');
  if (p.has('device')) S.device = p.get('device');
  if (p.has('dt')) S.dt = +p.get('dt');
  if (p.has('os')) S.os = p.get('os');
  if (p.has('view')) S.view = p.get('view');
  if (p.has('tab')) S.tab = p.get('tab');
  if (p.has('feed')) S.feedIndex = +p.get('feed');
  for (const k of ['surface', 'mode', 'wall', 'tint']) if (p.has('w' + k)) S.wg[k] = p.get('w' + k);
  if (p.has('wword')) S.wg.word = +p.get('wword');
  if (p.has('ob')) S.ob.page = +p.get('ob');
  if (p.has('oblevel')) S.ob.level = p.get('oblevel');
  if (p.has('obplace')) S.ob.place = p.get('obplace');
  if (p.has('obtopics')) S.ob.topics = new Set(p.get('obtopics').split(','));
  if (p.get('bare') === '1') document.body.classList.add('bare');
  $('#brandIcon').innerHTML = appIcon('dark').replace('<svg ', '<svg style="width:30px;height:30px;border-radius:9px" ');
  render();
  if (p.has('state')) { jump(p.get('state')); if (p.has('i')) { S.rv.i = +p.get('i'); render({ resetScroll: true }); } }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.view === 'widgets') fitWidgets(); fitHeads(); fitLadder(); audit(); });
})();
