<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lockglow arayüz mockup'ı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,700&display=swap">
<style>
/* Düzen: solda iPhone çerçevesi (390×844 ya da SE 375×667), sağda kontrol ve tasarım notu paneli.
   Renk: "gece" (mor-siyah mürekkep) + "ışık" (amber). Amber iki işte kullanılır: dolgu (koyu yazıyla) ve yazı/simge (koyu tonu). */
:root{
  --bg:#F5F4F9; --surface:#FFFFFF; --surface-2:#EDEBF3; --surface-3:#E1DEEA;
  --line:rgba(21,19,31,.10); --line-strong:rgba(21,19,31,.20);
  --ink:#15131F; --ink-2:#4F4A63; --ink-3:#6B6580;
  --glow:#FFB321; --glow-hi:#FFD36B; --on-glow:#1B1200; --glow-ink:#955000; --glow-tint:#FFF1D2;
  --glow-halo:rgba(255,179,33,.45); --glow-wash:rgba(255,179,33,.20);
  --good:#0C6B49; --good-tint:#DDF4E8; --bad:#B42318; --bad-tint:#FDE6E3;
  --hard:#9A4A00; --hard-tint:#FFE9D2; --easy:#1D55C9; --easy-tint:#E0EAFF;
  --bar-bg:rgba(255,255,255,.84); --bar-on:rgba(21,19,31,.07);
  --shadow-card:0 1px 2px rgba(21,19,31,.06),0 14px 34px -14px rgba(21,19,31,.22);
  --shadow-bar:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px -8px rgba(21,19,31,.28);
  --glass-bg:rgba(255,255,255,.58); --glass-line:rgba(255,255,255,.75);
  --blob-a:rgba(255,190,70,.55); --blob-b:rgba(140,120,255,.35);
  --chrome-panel:#FFFFFF; --bezel:#0d0c12;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0A12; --surface:#171420; --surface-2:#211D2D; --surface-3:#2C2739;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.17);
    --ink:#F6F3FC; --ink-2:#BDB7CF; --ink-3:#9189A8;
    --glow:#FFBD3F; --glow-hi:#FFD98A; --on-glow:#1B1200; --glow-ink:#FFC862; --glow-tint:rgba(255,189,63,.14);
    --glow-halo:rgba(255,189,63,.40); --glow-wash:rgba(255,189,63,.14);
    --good:#63E3B0; --good-tint:rgba(63,214,160,.15); --bad:#FF9D94; --bad-tint:rgba(255,110,98,.16);
    --hard:#FFB27A; --hard-tint:rgba(255,150,70,.15); --easy:#93BFFF; --easy-tint:rgba(100,160,255,.17);
    --bar-bg:rgba(33,29,45,.84); --bar-on:rgba(255,255,255,.10);
    --shadow-card:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -16px rgba(0,0,0,.7);
    --shadow-bar:0 1px 0 rgba(255,255,255,.10) inset,0 12px 32px -8px rgba(0,0,0,.7);
    --glass-bg:rgba(40,34,58,.55); --glass-line:rgba(255,255,255,.16);
    --blob-a:rgba(255,170,40,.28); --blob-b:rgba(120,90,255,.30);
    --chrome-panel:#13111B; --bezel:#050408; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0A12; --surface:#171420; --surface-2:#211D2D; --surface-3:#2C2739;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.17);
  --ink:#F6F3FC; --ink-2:#BDB7CF; --ink-3:#9189A8;
  --glow:#FFBD3F; --glow-hi:#FFD98A; --on-glow:#1B1200; --glow-ink:#FFC862; --glow-tint:rgba(255,189,63,.14);
  --glow-halo:rgba(255,189,63,.40); --glow-wash:rgba(255,189,63,.14);
  --good:#63E3B0; --good-tint:rgba(63,214,160,.15); --bad:#FF9D94; --bad-tint:rgba(255,110,98,.16);
  --hard:#FFB27A; --hard-tint:rgba(255,150,70,.15); --easy:#93BFFF; --easy-tint:rgba(100,160,255,.17);
  --bar-bg:rgba(33,29,45,.84); --bar-on:rgba(255,255,255,.10);
  --shadow-card:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -16px rgba(0,0,0,.7);
  --shadow-bar:0 1px 0 rgba(255,255,255,.10) inset,0 12px 32px -8px rgba(0,0,0,.7);
  --glass-bg:rgba(40,34,58,.55); --glass-line:rgba(255,255,255,.16);
  --blob-a:rgba(255,170,40,.28); --blob-b:rgba(120,90,255,.30);
  --chrome-panel:#13111B; --bezel:#050408; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px; min-height:100vh; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glow-ink);outline-offset:2px;border-radius:10px}
svg.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.fill{fill:currentColor;stroke:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── Sayfa çerçevesi (mockup'ın kendi arayüzü) ───────── */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:16px 12px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-round);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand b{color:var(--glow-ink);font-weight:800}
.brand svg{width:30px;height:30px;border-radius:9px;display:block}
.brand small{font:500 13px var(--font-ui);color:var(--ink-3);letter-spacing:0;margin-left:2px}
.mainnav{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.mainnav button,.pseg button{min-height:44px;padding:0 16px;border-radius:11px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.mainnav button[aria-pressed="true"],.pseg button[aria-pressed="true"]{background:var(--glow);color:var(--on-glow)}
.topbar .spacer{flex:1}
.pseg{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:12px}
.pseg button{padding:0 12px;min-height:40px;font-size:14px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;max-width:1240px;margin:0 auto;align-items:start}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;padding-top:8px}
.phone-box{position:relative;flex:none}
.phone-box .phone{position:absolute;left:0;top:0;transform-origin:0 0}
.stage-cap{font-size:13px;color:var(--ink-3);text-align:center;max-width:46ch}
.panel{background:var(--chrome-panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h2{margin:0 0 8px;font:700 13px var(--font-ui);letter-spacing:.04em;color:var(--ink-3)}
.panel .grp{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"],.chip.on{background:var(--glow);color:var(--on-glow)}
.range{display:flex;flex-direction:column;gap:6px}
.range input{width:100%;accent-color:var(--glow-ink);min-height:44px}
.range .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--glow-ink)}
.note{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}
.note h3{margin:0;font:700 17px var(--font-round);color:var(--ink)}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.note .swift{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.note .swift b{color:var(--ink)}
.audit{font-size:13px;color:var(--ink-2);padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.audit b{color:var(--good)}
.audit.bad b{color:var(--bad)}
@media (max-width:1020px){.workspace{grid-template-columns:minmax(0,1fr)}.panel{order:2}}

/* ───────── iPhone çerçevesi ───────── */
.phone{--dt:1;--sw:390px;--sh:844px;--sr:48px;--safe-top:54px;--safe-bottom:34px;
  --w-small:158px;--w-medium:338px;
  --fs-head:min(calc(44px*var(--dt)),58px);--fs-lt:calc(34px*var(--dt));--fs-t1:calc(28px*var(--dt));--fs-t2:calc(22px*var(--dt));
  --fs-t3:calc(20px*var(--dt));--fs-b:calc(17px*var(--dt));--fs-c:calc(16px*var(--dt));--fs-s:calc(15px*var(--dt));
  --fs-f:calc(13px*var(--dt));--fs-cap:calc(12px*var(--dt));
  --bar-h:64px;--bar-b:max(8px,calc(var(--safe-bottom) - 14px));--bar-space:calc(var(--bar-h) + var(--bar-b) + 14px);
  position:relative;padding:12px;background:var(--bezel);border-radius:calc(var(--sr) + 12px);
  box-shadow:0 0 0 1.5px #34303f inset,0 50px 90px -40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05);
  color:var(--ink);font-family:var(--font-ui)}
.phone[data-device="se"]{--sw:375px;--sh:667px;--sr:6px;--safe-top:20px;--safe-bottom:0px;--w-small:141px;--w-medium:292px;padding:72px 14px 80px;border-radius:46px}
.phone[data-device="se"]::after{content:"";position:absolute;left:50%;bottom:16px;width:50px;height:50px;margin-left:-25px;border-radius:50%;border:2px solid #3b3746}
.phone[data-device="se"]::before{content:"";position:absolute;left:50%;top:34px;width:64px;height:7px;margin-left:-32px;border-radius:4px;background:#2a2733}
.screen{position:relative;width:var(--sw);height:var(--sh);border-radius:var(--sr);overflow:hidden;background:var(--bg);isolation:isolate}
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--safe-top);display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 38px;z-index:50;
  font:600 16px var(--font-ui);color:var(--ink);pointer-events:none}
.phone[data-device="se"] .statusbar{padding:0 12px}
.statusbar.light{color:#fff}
.statusbar .si{display:flex;gap:6px;align-items:center}
.statusbar svg{height:12px;width:auto;fill:currentColor}
.island{position:absolute;top:11px;left:50%;width:122px;height:36px;margin-left:-61px;background:#000;border-radius:20px;z-index:55}
.phone[data-device="se"] .island,.phone[data-device="se"] .homebar{display:none}
.homebar{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:var(--ink);opacity:.85;z-index:60;pointer-events:none}
.homebar.light{background:#fff}

/* ───────── Uygulama kabuğu ───────── */
.app{position:absolute;inset:0;padding-top:var(--safe-top);display:flex;flex-direction:column;background:var(--bg)}
.page{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:var(--bar-space);scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:16px;right:16px;bottom:var(--bar-b);height:var(--bar-h);border-radius:34px;display:flex;gap:2px;padding:4px;z-index:30;
  background:var(--bar-bg);box-shadow:var(--shadow-bar);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.tab{flex:1;min-width:44px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);
  font:600 calc(12px*min(var(--dt),1.3)) var(--font-ui);position:relative}
.tab svg{width:25px;height:25px}
.tab[aria-selected="true"]{background:var(--bar-on);color:var(--glow-ink)}
.tab .dot{position:absolute;top:8px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--bar-bg)}

/* ───────── Ortak bileşenler ───────── */
.t-head{font:800 var(--fs-head)/1.05 var(--font-round);letter-spacing:-.015em;overflow-wrap:anywhere}
.t-lt{font:800 var(--fs-lt)/1.1 var(--font-round);letter-spacing:-.01em}
.t-gloss{font:700 var(--fs-t1)/1.15 var(--font-ui);letter-spacing:-.01em}
.t-def{font:400 var(--fs-t3)/1.3 var(--font-ui)}
.t-ex{font:italic 400 var(--fs-b)/1.35 var(--font-ui)}
.t-sub{font:400 var(--fs-s)/1.35 var(--font-ui);color:var(--ink-2)}
.t-foot{font:400 var(--fs-f)/1.35 var(--font-ui);color:var(--ink-2)}
.t-cap{font:600 var(--fs-cap)/1.3 var(--font-ui);color:var(--ink-3)}
.btn{min-height:44px;padding:0 20px;border-radius:14px;font:600 var(--fs-b)/1.2 var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-lg{min-height:54px;border-radius:17px;padding:0 24px}
.btn-primary{background:var(--glow);color:var(--on-glow);box-shadow:0 8px 22px -8px var(--glow-halo)}
.btn-secondary{background:var(--surface-2);color:var(--ink)}
.btn-ghost{color:var(--glow-ink)}
.btn-danger{background:var(--bad-tint);color:var(--bad)}
.btn.block{width:100%}
.btn:active,.grade:active,.opt:active,.row.tap:active{transform:scale(.985)}
.ic-sm{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:13px;font:700 var(--fs-f) var(--font-ui);color:var(--ink);background:var(--surface-2)}
.lvl{display:inline-flex;align-items:center;gap:7px;min-height:26px;padding:0 10px 0 9px;border-radius:13px;border:1.5px solid var(--line-strong);font:800 var(--fs-f) var(--font-round);color:var(--ink)}
.lvl i{display:flex;gap:2px}
.lvl i b{width:5px;height:5px;border-radius:50%;background:var(--glow-ink);opacity:.25}
.lvl i b.on{opacity:1}
.spk{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--glow-ink)}
.spk .ring{width:36px;height:36px;border-radius:50%;background:var(--glow-tint);display:grid;place-items:center;transition:transform .15s}
.spk.playing .ring{animation:pulse .9s ease-in-out infinite}
.spk svg{width:20px;height:20px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow-halo)}50%{box-shadow:0 0 0 8px transparent}}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 16px}
.hdr .ttl{font:800 var(--fs-b) var(--font-round);display:flex;align-items:center;gap:8px}
.hdr .ttl svg{width:22px;height:22px;color:var(--glow-ink)}
.hdr .meta{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.back{min-height:44px;min-width:44px;display:inline-flex;align-items:center;gap:2px;color:var(--glow-ink);font:600 var(--fs-b) var(--font-ui);padding-right:8px}
.back svg{width:22px;height:22px}
.lead{padding:4px 16px 0}
.lead .t-lt{margin:6px 0 10px}

/* Kelime kartı (Akış, Tekrar, Sözlük ortak) */
.wcard{background:radial-gradient(130% 55% at 15% -8%,var(--glow-wash),transparent 62%),var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.wcard .inner{flex:1;min-height:0;overflow-y:auto;padding:20px 20px 12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
.wcard .inner::-webkit-scrollbar{display:none}
.wcard .foot{padding:6px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.wmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wmeta .pos{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.wordrow{display:flex;align-items:center;gap:2px;margin-top:2px}
.ipa{font:400 var(--fs-t3) var(--font-ui);color:var(--ink-2);margin-top:-6px}
.gloss{background:var(--glow-tint);border-radius:20px;padding:12px 16px 13px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--glow) 55%,transparent);position:relative}
.gloss .alt{font:500 var(--fs-s) var(--font-ui);color:var(--ink-2);margin-top:2px}
.exrow{display:flex;gap:2px;align-items:flex-start}
.exrow > div{flex:1;min-width:0;padding-top:4px}
.exrow .tr{font:400 var(--fs-c)/1.35 var(--font-ui);color:var(--ink-2);margin-top:2px}
.exblock{display:flex;flex-direction:column;gap:6px}
.sect{font:700 var(--fs-c) var(--font-round);margin:6px 0 -2px}
.mist{background:var(--surface-2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mist .h{display:flex;align-items:center;gap:6px;font:700 var(--fs-s) var(--font-ui);color:var(--ink)}
.mist .h svg{width:20px;height:20px;color:var(--glow-ink)}
.mist .l{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;font:400 var(--fs-c)/1.35 var(--font-ui)}
.mist .tag{display:inline-flex;align-items:center;gap:4px;font:700 var(--fs-cap) var(--font-ui);padding:2px 8px 2px 6px;border-radius:10px;white-space:nowrap}
.mist .tag svg{width:13px;height:13px;stroke-width:3}
.mist .tag.bad{background:var(--bad-tint);color:var(--bad)}
.mist .tag.good{background:var(--good-tint);color:var(--good)}
.mist s{color:var(--ink-2);text-decoration-thickness:1.5px}
.mist .r{font-weight:700}
.mist .why{font:400 var(--fs-f)/1.4 var(--font-ui);color:var(--ink-2)}
.hint{display:inline-flex;align-items:center;gap:4px;color:var(--ink-3);font:600 var(--fs-f) var(--font-ui)}
.hint svg{width:18px;height:18px}
.pager{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.pager i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.35;transition:all .2s}
.pager i.on{height:16px;border-radius:3px;background:var(--glow);opacity:1}

/* Akış */
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.feed .slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:2px 14px calc(var(--bar-space) - 2px);display:flex}
.feed .slide .wcard{flex:1}

/* Tekrar */
.rv{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px;gap:10px}
.rv .top{display:flex;align-items:center;gap:10px;min-height:48px}
.rv .top .mode{font:700 var(--fs-f) var(--font-ui);color:var(--glow-ink);background:var(--glow-tint);padding:3px 10px;border-radius:12px}
.rv .top .cnt{font:600 var(--fs-s) var(--font-ui);color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums}
.rv .top .btn{min-height:44px;padding:0 12px;margin-right:-8px}
.prog{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.prog span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--glow),var(--glow-hi));box-shadow:0 0 12px var(--glow-halo);transition:width .3s}
.rv .deck{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(var(--bar-space) - 6px)}
.rv .deck .wcard{flex:1;cursor:pointer}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;position:relative}
.front .t-head{font-size:min(calc(46px*var(--dt)),60px)}
.front .tap{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2);font:600 var(--fs-s) var(--font-ui)}
.front .tap .ripple{width:38px;height:38px;border-radius:50%;border:2px solid var(--glow);box-shadow:0 0 0 0 var(--glow-halo);animation:ripple 2s ease-out infinite}
@keyframes ripple{0%{box-shadow:0 0 0 0 var(--glow-halo)}70%,100%{box-shadow:0 0 0 16px transparent}}
.front .spkpos{position:absolute;right:8px;top:8px}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade{min-height:60px;border-radius:18px;padding:8px 14px;display:flex;align-items:center;gap:10px;text-align:left;font:700 var(--fs-b)/1.15 var(--font-ui)}
.grade .gi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.55)}
.grade .gi svg{width:21px;height:21px}
.grade small{display:block;font:500 var(--fs-f) var(--font-ui);opacity:.85;margin-top:1px}
.grade.again{background:var(--bad-tint);color:var(--bad)}
.grade.hard{background:var(--hard-tint);color:var(--hard)}
.grade.good{background:var(--glow);color:var(--on-glow);box-shadow:0 8px 20px -8px var(--glow-halo)}
.grade.easy{background:var(--easy-tint);color:var(--easy)}
:root[data-theme="dark"] .grade .gi{background:rgba(255,255,255,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .grade .gi{background:rgba(255,255,255,.10)}}
.grade.good .gi{background:rgba(27,18,0,.12)}
.phone[data-big="1"] .grade .gi{display:none}
.phone[data-ax="1"] .grade small{display:none}
.hide-sub .grade small{display:none}
.quiz{display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
.quiz .q{font:700 var(--fs-s) var(--font-ui);color:var(--ink-2)}
.qcard{background:radial-gradient(120% 60% at 10% -10%,var(--glow-wash),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:8px}
.qcard .s{font:600 var(--fs-t2)/1.35 var(--font-ui);letter-spacing:-.005em}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--glow);margin:0 2px;transform:translateY(-1px);box-shadow:0 8px 14px -10px var(--glow-halo)}
.filled{background:var(--glow-tint);box-shadow:inset 0 -3px 0 var(--glow);border-radius:6px;padding:0 5px;font-weight:800;color:var(--ink)}
.qcard .sr2{display:flex;align-items:center;justify-content:space-between;gap:4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;border-radius:17px;background:var(--surface);border:1.5px solid var(--line-strong);padding:6px 16px 6px 12px;display:flex;align-items:center;gap:12px;text-align:left;font:600 var(--fs-b) var(--font-ui)}
.opt .k{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:800 var(--fs-f) var(--font-round);color:var(--ink-2);flex:none}
.opt .tx{flex:1;min-width:0}
.opt .mk{display:inline-flex;align-items:center;gap:4px;font:700 var(--fs-f) var(--font-ui);white-space:nowrap}
.opt .mk svg{width:19px;height:19px}
.opt.right{background:var(--good-tint);border-color:var(--good);color:var(--ink)}
.opt.right .mk{color:var(--good)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-tint);border-color:var(--bad)}
.opt.wrong .mk{color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.rest{opacity:.75}
.fb{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;padding:2px 0}
.fb .h{display:flex;align-items:center;gap:8px;font:800 var(--fs-t2) var(--font-round)}
.fb .h svg{width:26px;height:26px}
.fb .h.ok{color:var(--good)}
.fb .h.no{color:var(--ink)}
.fb .m{font:500 var(--fs-s) var(--font-ui);color:var(--ink-2)}
.fb .m b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asked{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2);text-align:center;margin-bottom:-4px}

/* Başlangıç, özet, bitti */
.center-scroll{padding:6px 16px 0;display:flex;flex-direction:column;gap:16px}
.hero{background:radial-gradient(120% 80% at 50% -20%,var(--glow-wash),transparent 65%),var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:var(--shadow-card)}
.hero h2{margin:0;font:800 var(--fs-t1)/1.15 var(--font-round);letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:0;font:400 var(--fs-c)/1.4 var(--font-ui);color:var(--ink-2);text-wrap:pretty}
.pring{position:relative;width:132px;height:132px;display:grid;place-items:center}
.pring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);fill:none}
.pring .num{font:900 calc(34px*min(var(--dt),1.3)) var(--font-round);line-height:1;text-align:center}
.pring .num small{display:block;font:600 calc(13px*min(var(--dt),1.3)) var(--font-ui);color:var(--ink-2);margin-top:2px}
.glowseal{position:relative;width:116px;height:116px;display:grid;place-items:center}
.glowseal::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(closest-side,var(--glow-halo),transparent 72%)}
.glowseal svg{position:relative;width:96px;height:96px;fill:none;stroke-width:1.6}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:var(--surface-2);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font:800 calc(22px*min(var(--dt),1.4)) var(--font-round)}
.stat span{font:500 var(--fs-cap) var(--font-ui);color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font:700 var(--fs-b) var(--font-round)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,92px) 1fr 24px;align-items:center;gap:10px;font:600 var(--fs-s) var(--font-ui)}
.bar .tr{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.again-c{--c:var(--bad)}.hard-c{--c:var(--hard)}.good-c{--c:var(--glow)}.easy-c{--c:var(--easy)}
.bar .tr i{background:var(--c)}
.wl{display:flex;flex-direction:column}
.wl .it{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-top:1px solid var(--line);padding:6px 0}
.wl .it:first-child{border-top:0}
.wl .it b{font:800 var(--fs-b) var(--font-round)}
.wl .it span{font:500 var(--fs-s) var(--font-ui);color:var(--ink-2)}
.wl .when{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2);background:var(--surface-2);padding:3px 9px;border-radius:11px;white-space:nowrap}

/* Sözlük */
.sfield{margin:0 16px;min-height:52px;border-radius:17px;background:var(--surface-2);display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border:1.5px solid transparent}
.sfield:focus-within{border-color:var(--glow-ink);background:var(--surface)}
.sfield svg{width:22px;height:22px;color:var(--ink-3)}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:0;font:500 var(--fs-b) var(--font-ui);min-height:48px;color:var(--ink)}
.sfield input::placeholder{color:var(--ink-3)}
.sfield .x{width:44px;height:44px;display:grid;place-items:center;color:var(--ink-3)}
.try{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
.try::-webkit-scrollbar{display:none}
.try > *{flex:none}
.try .l{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.try .chip{min-height:44px;font-size:var(--fs-s)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 28px}
.empty .gi{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(closest-side,var(--glow-halo),transparent);color:var(--glow-ink)}
.empty .gi svg{width:40px;height:40px}
.empty h3{margin:0;font:800 var(--fs-t2) var(--font-round)}
.empty p{margin:0;font:400 var(--fs-c)/1.4 var(--font-ui);color:var(--ink-2)}
.empty p b{color:var(--ink)}
.res{display:flex;flex-direction:column;gap:8px;padding:8px 16px 0}
.res .cnt{font:600 var(--fs-f) var(--font-ui);color:var(--ink-2);padding:6px 4px 0}
.rrow{min-height:68px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 8px 10px 16px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.rrow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rrow .w{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rrow .w b{font:800 var(--fs-t3) var(--font-round)}
.rrow .g{font:700 var(--fs-b) var(--font-ui)}
.rrow .d{font:400 var(--fs-f) var(--font-ui);color:var(--ink-2)}
.rrow .via{font:600 var(--fs-cap) var(--font-ui);color:var(--ink-3)}
.rrow .st{color:var(--good)}
.rrow svg.chev{color:var(--ink-3);width:20px;height:20px}
mark{background:var(--glow-tint);color:inherit;box-shadow:inset 0 -2px 0 var(--glow);border-radius:3px;padding:0 1px}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:18px;padding:8px 8px 8px 14px}
.status .s{display:flex;align-items:center;gap:8px;font:700 var(--fs-s) var(--font-ui)}
.status .s svg{width:22px;height:22px}
.status .s.known{color:var(--good)}
.status .s.learning{color:var(--glow-ink)}
.status .s.new{color:var(--ink-2)}
.info{display:flex;gap:10px;align-items:flex-start;font:400 var(--fs-c)/1.4 var(--font-ui)}
.info svg{width:22px;height:22px;color:var(--glow-ink);margin-top:1px}
.info b{display:block;font:700 var(--fs-s) var(--font-ui);color:var(--ink-2);margin-bottom:1px}
.chipline{display:flex;flex-wrap:wrap;gap:6px}
.cl{padding:5px 11px;border-radius:14px;background:var(--surface-2);font:600 var(--fs-s) var(--font-ui)}
.detail{padding:0 16px 8px;display:flex;flex-direction:column;gap:14px}

/* Ayarlar */
.sgroup{margin:0 16px;display:flex;flex-direction:column;gap:8px}
.sgroup > h3{margin:6px 4px 0;font:800 var(--fs-c) var(--font-round);color:var(--ink)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.group.pad{padding:12px}
.row{min-height:52px;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .l{font:500 var(--fs-b) var(--font-ui)}
.row .v{font:600 var(--fs-b) var(--font-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.row svg.chev{width:20px;height:20px;color:var(--ink-3)}
.foot-t{font:400 var(--fs-f)/1.4 var(--font-ui);color:var(--ink-2);margin:0 6px;text-wrap:pretty}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;min-height:46px;min-width:44px;border-radius:11px;font:700 var(--fs-s) var(--font-ui);color:var(--ink-2);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.seg button[aria-pressed="true"]{background:var(--glow);color:var(--on-glow);box-shadow:0 4px 12px -4px var(--glow-halo)}
.phone[data-big="1"] .seg{flex-direction:column}
.swrap{display:flex;flex-direction:column;gap:8px}
.swrap .lab{font:600 var(--fs-s) var(--font-ui)}
.sw{position:relative;width:54px;height:32px;border-radius:16px;background:var(--surface-3);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--glow)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.swhit{min-width:60px;min-height:44px;display:flex;align-items:center;justify-content:flex-end}
.timechip{display:flex;align-items:center;gap:4px}
.timechip .tm{font:800 var(--fs-t3) var(--font-round);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.stepb{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font:700 22px var(--font-ui)}
.hstat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;width:100%;text-align:left;background:var(--good-tint);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.hstat .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:var(--surface);flex:none}
.hstat .ico svg{width:24px;height:24px;stroke-width:3}
.hstat b{display:block;font:800 var(--fs-b) var(--font-round);color:var(--ink)}
.hstat span{font:400 var(--fs-f)/1.35 var(--font-ui);color:var(--ink-2)}
.hstat .chev{margin-left:auto;color:var(--ink-3);width:20px;height:20px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--hard-tint);color:var(--ink);font:400 var(--fs-s)/1.4 var(--font-ui)}
.banner svg{width:22px;height:22px;color:var(--hard);margin-top:1px}
.banner .btn{margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border-radius:16px;padding:12px 8px;text-align:center}
.tile b{display:block;font:900 calc(26px*min(var(--dt),1.3)) var(--font-round);line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font:600 var(--fs-cap)/1.25 var(--font-ui);color:var(--ink-2);display:block;margin-top:3px}
.lvbars{display:flex;flex-direction:column;gap:9px;padding-top:4px}
.lvb{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;font:700 var(--fs-s) var(--font-round)}
.lvb .tr{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.lvb .tr i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--glow),var(--glow-hi))}
.lvb small{font:500 var(--fs-cap) var(--font-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.kw{display:flex;align-items:center;gap:8px;min-height:60px;border-top:1px solid var(--line);padding:6px 6px 6px 14px}
.kw:first-child{border-top:0}
.kw .main{flex:1;min-width:0;text-align:left;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.kw b{font:800 var(--fs-b) var(--font-round)}
.kw span{font:500 var(--fs-s) var(--font-ui);color:var(--ink-2)}
.kw .btn{min-height:44px;padding:0 12px;font-size:var(--fs-s)}
.dl{display:flex;flex-direction:column}
.dl .r{display:flex;justify-content:space-between;gap:12px;min-height:44px;align-items:center;border-top:1px solid var(--line);padding:4px 14px;font:500 var(--fs-s) var(--font-ui)}
.dl .r:first-child{border-top:0}
.dl .r span:last-child{color:var(--ink-2);font-weight:600;text-align:right}
.dl .r.ok span:last-child{color:var(--good)}
details.tech{border-radius:16px;background:var(--surface-2)}
details.tech summary{min-height:48px;padding:0 14px;display:flex;align-items:center;font:700 var(--fs-s) var(--font-ui);cursor:pointer;list-style:none;gap:8px}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary svg{width:18px;height:18px;transition:transform .2s}
details.tech[open] summary svg{transform:rotate(90deg)}
details.tech .dl .r{border-color:var(--line-strong);font:500 var(--fs-f) var(--font-ui)}
.sheetbd{position:absolute;inset:0;z-index:70;background:rgba(5,4,10,.5);display:flex;align-items:flex-end;padding:8px 8px calc(var(--safe-bottom) + 6px);animation:fade .2s}
.sheet{width:100%;display:flex;flex-direction:column;gap:8px;animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.sheet .box{background:var(--bar-bg);border-radius:24px;padding:16px;text-align:center;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:10px}
.sheet .box h3{margin:0;font:800 var(--fs-b) var(--font-round)}
.sheet .box p{margin:0;font:400 var(--fs-s)/1.4 var(--font-ui);color:var(--ink-2)}
.sheet .cancel{background:var(--surface);border-radius:20px;min-height:56px;font:700 var(--fs-b) var(--font-ui);text-align:center;color:var(--glow-ink)}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(30px);opacity:0}}
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--bar-b) + var(--bar-h) + 10px);z-index:40;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 var(--fs-s) var(--font-ui);animation:rise .25s;box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
.toast button{min-height:44px;padding:0 12px;border-radius:12px;color:var(--glow);font-weight:800}
:root[data-theme="dark"] .toast button{color:var(--glow-ink)}

/* 44 pt denetimi */
.show-targets .phone :is(button,input,summary,.hit){outline:1.5px dashed #FF2D78;outline-offset:-1.5px;background-image:linear-gradient(rgba(255,45,120,.10),rgba(255,45,120,.10))}
.show-targets .phone .tabbar,.show-targets .phone .tab{background-image:none}

/* ───────── Cam (iOS 26 "Liquid Glass") fikri ───────── */
.phone[data-style="glass"] .app::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 40% at 15% 8%,var(--blob-a),transparent 70%),radial-gradient(55% 40% at 90% 40%,var(--blob-b),transparent 70%),radial-gradient(60% 40% at 30% 100%,var(--blob-a),transparent 70%)}
.phone[data-style="glass"] .app > *{position:relative;z-index:1}
.phone[data-style="glass"] .app > .tabbar{position:absolute}
.phone[data-style="glass"] :is(.wcard,.qcard,.hero,.card,.group,.rrow,.opt,.status,.sfield,.mist,.stat,.tile,.seg,.hstat,.banner){background-color:var(--glass-bg);background-image:none;border:1px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 30px -14px rgba(20,10,40,.35);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.phone[data-style="glass"] .tabbar{background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 14px 34px -12px rgba(20,10,40,.45)}
.phone[data-style="glass"] .mist,.phone[data-style="glass"] .stat,.phone[data-style="glass"] .tile{background-color:rgba(255,255,255,.12)}
.phone[data-style="glass"] .gloss{background:color-mix(in srgb,var(--glow) 24%,transparent)}
.phone[data-style="glass"] .opt.right{background-color:var(--good-tint)}
.phone[data-style="glass"] .opt.wrong{background-color:var(--bad-tint)}
.phone[data-style="glass"] .sheet .box{background:var(--glass-bg)}

/* ───────── Widget'lar ───────── */
.wall{position:absolute;inset:0;z-index:0}
.wall.gece{background:radial-gradient(90% 50% at 30% 8%,rgba(255,179,33,.40),transparent 62%),radial-gradient(70% 50% at 90% 70%,rgba(130,100,255,.40),transparent 70%),linear-gradient(180deg,#1B1236 0%,#0B0914 78%)}
.wall.safak{background:radial-gradient(80% 45% at 70% 0%,rgba(255,224,150,.8),transparent 62%),linear-gradient(180deg,#FF9F7A 0%,#C06BFF 52%,#3D2A86 100%)}
.wall.gun{background:radial-gradient(80% 45% at 30% 0%,rgba(255,255,255,.9),transparent 60%),linear-gradient(180deg,#BFD8FF 0%,#E9D9FF 60%,#FFE6C2 100%)}
.hs{position:absolute;inset:0;padding-top:var(--safe-top);z-index:2;display:flex;flex-direction:column;align-items:center;padding-inline:calc((var(--sw) - var(--w-medium))/2)}
.hs .grid{width:100%;display:flex;flex-direction:column;gap:18px;padding-top:14px}
.hs .r1{display:flex;gap:calc(var(--w-medium) - 2*var(--w-small));}

.hs .dock{position:absolute;left:calc(var(--sw)/2 - 164px);width:328px;bottom:calc(var(--safe-bottom) - 14px);height:86px;border-radius:34px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:flex;justify-content:space-around;align-items:center;padding:0 12px}

/* widget gövdesi */
.wg{--wg-ink:var(--ink);--wg-ink2:var(--ink-2);--wg-acc:var(--glow-ink);position:relative;overflow:hidden;border-radius:24px;color:var(--wg-ink);flex:none;
  display:flex;flex-direction:column;padding:16px;font-family:var(--font-ui)}

.wg-medium{width:var(--w-medium);height:var(--w-small);flex-direction:row;gap:6px}

.wg-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.wg-body .g{font:700 16px/1.18 var(--font-ui);color:var(--wg-ink);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.wg-body .d{font:400 12px/1.3 var(--font-ui);color:var(--wg-ink2);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}

.wg-body .nx{font:500 11px var(--font-ui);color:var(--wg-ink2)}
.wg-medium .g{font-size:17px}
.wg-medium .d{font-size:13px}
.wg-btns{display:flex;justify-content:space-between;margin:0 -10px -12px;flex:none}
.wg-rail{display:flex;flex-direction:column;justify-content:space-between;margin:-12px -12px -12px 0;flex:none}
.wb{width:44px;height:44px;display:grid;place-items:center;color:var(--wg-acc);border-radius:50%}
.wb svg{width:22px;height:22px}

.wg-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.wcap{font:600 12px var(--font-ui);color:#fff;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.4);margin-top:4px}

.ls .bot svg{width:22px;height:22px}

/* ───────── İçerik ───────── */
const CARD = Object.fromEntries(CARDS.map(c => [c.lemma, c]));
const POS = { n: 'isim', v: 'fiil', adj: 'sıfat', adv: 'zarf', phv: 'phrasal verb' };
const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1'];
const FEED = ['breakfast', 'borrow', 'actually', 'date'];
const DECK = { new: ['date', 'appointment', 'spoon', 'actually'], due: ['borrow', 'breakfast', 'actually', 'date'] };
const WIDGET_WORDS = ['breakfast', 'actually', 'appointment', 'date', 'borrow'];
const GRADES = [
  { k: 'again', t: 'Bilemedim', i: 'x', sub: '10 dk sonra' },
  { k: 'hard', t: 'Zor', i: 'tortoise', sub: 'yakında' },
  { k: 'good', t: 'Bildim', i: 'check', sub: '1 gün sonra' },
  { k: 'easy', t: 'Kolay', i: 'hare', sub: '2 gün sonra' }
];
const DT = [{ v: .82, l: 'Küçük' }, { v: 1, l: 'Normal' }, { v: 1.18, l: 'Büyük' }, { v: 1.35, l: 'En büyük' }, { v: 1.9, l: 'Erişilebilirlik (AX2)' }];
const LEVEL_TOTALS = { A1: 179, A2: 348, B1: 227 };

function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function quizOptions(c) {
  const all = [c.quiz.answer, ...c.quiz.distractors];
  let h = hash(c.lemma);
  for (let i = all.length - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0; const j = h % (i + 1); [all[i], all[j]] = [all[j], all[i]]; }
  return all;
}
/* Türkçe harf katlama (ContentStore.search ile aynı fikir): "odunc" → "ödünç" */
function fold(s) {
  return String(s).toLocaleLowerCase('tr').replace(/[çğıöşüâîû]/g, c => ({ ç: 'c', ğ: 'g', ı: 'i', ö: 'o', ş: 's', ü: 'u', â: 'a', î: 'i', û: 'u' }[c])).trim();
}
function posLabel(c) { return POS[c.pos] || c.pos; }

/* ───────── Durum ───────── */
const S = {
  view: 'app', tab: 'feed', theme: 'light', style: 'flat', device: 'std', dt: 1, targets: false, scale: 1,
  feedIndex: 0,
  rv: { phase: 'start', kind: 'due', i: 0, revealed: false, picked: null, answers: [], newDone: 6, dueDone: 0, extra: false },
  q: '', open: null, from: null,
  known: new Set(['bread', 'lunch', 'dinner', 'spoon']), learning: new Set(['breakfast', 'borrow', 'date']),
  st: { freq: 60, goal: 10, rem: true, remMin: 20 * 60, push: null, sheet: false, denied: false, recovery: false },
  wg: { surface: 'home', mode: 'color', wall: 'gece', word: 0, tint: '#FFCB6B' },
  toast: null
};
const learnState = id => S.known.has(id) ? 'known' : S.learning.has(id) ? 'learning' : 'new';

/* ───────── Ortak parçalar ───────── */
function lvl(level) {
  const n = Math.min(3, LEVELS.indexOf(level) + 1);
  return `<span class="lvl" aria-label="Seviye ${level}">${level}<i aria-hidden="true">${[1, 2, 3].map(k => `<b class="${k <= n ? 'on' : ''}"></b>`).join('')}</i></span>`;
}
function spk(text, label = 'Kelimeyi dinle') {
  return `<button type="button" class="spk" data-act="say" data-say="${esc(text)}" aria-label="${label}"><span class="ring">${ic('speaker')}</span></button>`;
}
function headBlock(c, { center = false } = {}) {
  return `<div class="wmeta" ${center ? 'style="justify-content:center"' : ''}>${lvl(c.level)}<span class="pos">${esc(posLabel(c))}</span></div>
    <div class="wordrow" ${center ? 'style="justify-content:center"' : ''}><div class="t-head">${esc(c.lemma)}</div>${spk(c.lemma)}</div>
    <div class="ipa">${esc(c.ipa)}</div>`;
}
function glossBlock(c, alt = true) {
  return `<div class="gloss"><div class="t-gloss">${esc(c.gloss)}</div>${alt && c.alt.length ? `<div class="alt">Ayrıca: ${esc(c.alt.join(', '))}</div>` : ''}</div>`;
}
function exampleRow(ex) {
  return `<div class="exrow"><div><div class="t-ex">${esc(ex.en)}</div>${ex.tr ? `<div class="tr">${esc(ex.tr)}</div>` : ''}</div>${spk(ex.en, 'Cümleyi dinle')}</div>`;
}
function mistakeBox(m) {
  return `<div class="mist"><div class="h">${ic('warn')}Dikkat</div>
    <div class="l"><span class="tag bad">${ic('x')}Yanlış</span><s>${esc(m.wrong)}</s><span class="tag good">${ic('check')}Doğru</span><span class="r">${esc(m.right)}</span></div>
    <div class="why">${esc(m.why)}</div></div>`;
}
function ring(value, total, center, size = 132, stroke = 12) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, f = total ? Math.min(1, value / total) : 0;
  return `<div class="pring" style="width:${size}px;height:${size}px" role="img" aria-label="${value} / ${total}">
    <svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--surface-3)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--glow)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C * f} ${C}" style="filter:drop-shadow(0 0 6px var(--glow-halo))"/></svg>
    <div class="num">${center}</div></div>`;
}
const brandGlyph = () => `<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><path d="M10.3 12.6a4.2 4.2 0 1 1 3.4 0l1.2 7.4H9.1z"/></svg>`;

/* ───────── Akış ───────── */
function renderFeed() {
  const slides = FEED.map(id => {
    const c = CARD[id];
    const known = learnState(id) === 'known';
    return `<div class="slide"><article class="wcard" aria-label="${esc(c.lemma)} kartı">
      <div class="inner">${headBlock(c)}${glossBlock(c)}<div class="t-def">${esc(c.short)}</div>${exampleRow(c.ex[0])}${c.mist[0] ? mistakeBox(c.mist[0]) : ''}</div>
      <div class="foot">
        <button type="button" class="btn btn-secondary" data-act="feedknow" data-id="${id}" aria-pressed="${known}">${ic(known ? 'checkc' : 'check', 'ic-sm')}${known ? 'Biliyorsun' : 'Biliyorum'}</button>
        <span class="hint">${ic('chevU')}Kaydır: sonraki</span>
      </div></article></div>`;
  }).join('');
  return `<div class="hdr"><div class="ttl">${brandGlyph()}Akış</div><div class="meta" id="feedMeta">Kelime ${S.feedIndex + 1} / ${FEED.length}</div></div>
    <div class="page" style="position:relative"><div class="feed" id="feed" tabindex="0" aria-label="Kelime kartları, dikey kaydırılır">${slides}</div>
    <div class="pager" id="pager" aria-hidden="true">${FEED.map((_, i) => `<i class="${i === S.feedIndex ? 'on' : ''}"></i>`).join('')}</div></div>`;
}

/* ───────── Tekrar ───────── */
function renderReview() {
  const r = S.rv;
  if (r.phase === 'start') return reviewStart();
  if (r.phase === 'summary') return reviewSummary();
  if (r.phase === 'done') return reviewDone();
  return reviewRound();
}
function reviewStart() {
  const r = S.rv, goal = S.st.goal, n = DECK[r.kind].length;
  const due = r.kind === 'due';
  return `<div class="hdr"><div class="ttl">${ic('cycle')}Tekrar</div><div class="meta">Bugün</div></div>
  <div class="scroll"><div class="center-scroll">
    <div class="hero">
      ${ring(Math.min(goal, r.newDone), goal, `${Math.min(goal, r.newDone)}<span style="color:var(--ink-3)">/${goal}</span><small>bugünkü hedef</small>`)}
      <h2>${due ? `${n} kelime tekrar bekliyor` : `Bugünün yeni kelimeleri: ${n}`}</h2>
      <p>${due ? 'Önce öğrendiğin kelimeleri pekiştirelim. Her soruda doğru kelimeyi seç.' : 'Her kelimeye bak, anlamını gör, sonra ne kadar bildiğini işaretle.'}</p>
      <button type="button" class="btn btn-primary btn-lg block" data-act="start">Başla (${n} kart)</button>
    </div>
    <div class="card"><h3>Bugün</h3><div class="statrow">
      <div class="stat"><b>${r.newDone}</b><span>yeni kelime</span></div>
      <div class="stat"><b>${r.dueDone}</b><span>tekrar</span></div>
      <div class="stat"><b>${S.known.size + 120}</b><span>bildiğin</span></div></div></div>
  </div></div>`;
}
function roundTop(r) {
  const n = DECK[r.kind].length;
  return `<div class="top"><span class="mode">${r.kind === 'new' ? 'Yeni kelime' : 'Tekrar sorusu'}</span><span class="cnt">${r.i + 1} / ${n}</span>
      <button type="button" class="btn btn-ghost" data-act="finish">Bitir</button></div>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${r.i}" aria-label="Tur ilerlemesi"><span style="width:${(r.i / n) * 100}%"></span></div>`;
}
function reviewRound() {
  const r = S.rv, c = CARD[DECK[r.kind][r.i]];
  if (r.kind === 'due') return `<div class="rv">${roundTop(r)}<div class="scroll" style="margin:0 -16px;padding:4px 16px var(--bar-space)">${quizView(c)}</div></div>`;
  let body;
  if (!r.revealed) {
    body = `<article class="wcard" data-act="reveal" role="button" tabindex="0" aria-label="${esc(c.lemma)}. Anlamını göstermek için dokun">
        <div class="front"><div class="spkpos">${spk(c.lemma)}</div>
          <div class="wmeta" style="justify-content:center">${lvl(c.level)}<span class="pos">${esc(posLabel(c))}</span></div>
          <div class="t-head">${esc(c.lemma)}</div><div class="ipa" style="margin-top:0">${esc(c.ipa)}</div>
          <div class="tap"><span class="ripple"></span>Anlamını görmek için dokun</div></div></article>

  } else {
    body = `<article class="wcard" aria-label="${esc(c.lemma)} kartı"><div class="inner">${headBlock(c)}${glossBlock(c)}<div class="t-def">${esc(c.short)}</div>${exampleRow(c.ex[0])}${c.mist[0] ? mistakeBox(c.mist[0]) : ''}</div></article>
      <div class="grades" role="group" aria-label="Ne kadar bildin?">${GRADES.map(g => `<button type="button" class="grade ${g.k}" data-act="grade" data-g="${g.k}"><span class="gi">${ic(g.i)}</span><span>${g.t}<small>${g.sub}</small></span></button>`).join('')}</div>`;
  }

}
function quizView(c) {
  const r = S.rv, q = c.quiz, opts = quizOptions(c), picked = r.picked, done = picked != null, right = picked === q.answer;
  const parts = q.cloze.split(/_{3,}/);
  const sentence = done ? `${esc(parts[0])}<span class="filled">${esc(q.answer)}</span>${esc(parts[1] ?? '')}` : `${esc(parts[0])}<span class="blank" aria-label="boşluk"></span>${esc(parts[1] ?? '')}`;
  const K = 'ABCD';
  const optHTML = opts.map((o, i) => {
    let cls = '', mk = '';
    if (done) {
      if (o === q.answer) { cls = 'right'; mk = `<span class="mk">${ic('checkc')}Doğru cevap</span>`; }
      else if (o === picked) { cls = 'wrong'; mk = `<span class="mk">${ic('xc')}Yanlış</span>`; }
      else cls = 'rest';
    }
    return `<button type="button" class="opt ${cls}" data-act="pick" data-o="${esc(o)}" ${done ? 'aria-disabled="true"' : ''}><span class="k" aria-hidden="true">${K[i]}</span><span class="tx">${esc(o)}</span>${mk}</button>`;
  }).join('');
  let after = '';
  if (done) {
    after = `<div class="fb" aria-live="polite">${right ? `<div class="h ok">${ic('seal')}Doğru!</div>` : `<div class="h no">${ic('bulb')}Doğrusu: ${esc(q.answer)}</div>`}
        <div class="m"><b>${esc(c.lemma)}</b> = ${esc(c.gloss)}</div></div>
      ${!right && c.mist[0] ? mistakeBox(c.mist[0]) : ''}
      <button type="button" class="btn btn-primary btn-lg block" data-act="qnext">Devam</button>
      ${right ? `<div class="asked">Ya da bu soru nasıl geldi?</div><div class="two"><button type="button" class="btn btn-secondary" data-act="qgrade" data-g="hard">${ic('tortoise', 'ic-sm')}Zordu</button><button type="button" class="btn btn-secondary" data-act="qgrade" data-g="easy">${ic('hare', 'ic-sm')}Kolaydı</button></div>` : ''}`;
  }
  return `<div class="quiz"><div class="q">Boşluğa hangisi gelir?</div>
    <div class="qcard"><div class="s">${sentence}</div>${done ? `<div class="sr2"><span class="t-foot">Cümleyi dinle</span>${spk(q.cloze.replace(/_{3,}/, q.answer), 'Cümleyi dinle')}</div>` : ''}</div>

}
function reviewSummary() {

  const knownN = a.filter(x => x.g !== 'again').length, max = Math.max(1, ...GRADES.map(g => cnt(g.k)));

    ${soon.length ? `<div class="card"><h3>Yakında yeniden gelecek</h3><div class="wl">${soon.map(x => `<div class="it"><div><b>${esc(x.id)}</b><br><span>${esc(CARD[x.id].gloss)}</span></div><span class="when">${x.g === 'again' ? '10 dk sonra' : 'daha erken'}</span></div>`).join('')}</div></div>` : ''}

function reviewDone() {

  <div class="scroll"><div class="center-scroll">

function search(q) {
  const f = fold(q);
  if (!f) return [];
  const out = [];
  for (const c of CARDS) {
    let via = null, field = null;
    if (fold(c.lemma).startsWith(f)) { via = 'en'; field = 'lemma'; }
    else if (fold(c.gloss).split(/[ ,]+/).some(w => w.startsWith(f)) || fold(c.gloss).startsWith(f)) { via = 'tr'; field = 'gloss'; }
    else if (c.alt.some(a => fold(a).startsWith(f))) { via = 'alt'; field = 'alt'; }
    if (via) out.push({ c, via, field });
  }
  return out.sort((a, b) => (a.via === 'alt') - (b.via === 'alt') || a.c.lemma.length - b.c.lemma.length);
}
function hl(text, q) {
  const f = fold(q), t = String(text);
  const ft = fold(t);
  let i = ft.startsWith(f) ? 0 : ft.indexOf(' ' + f) >= 0 ? ft.indexOf(' ' + f) + 1 : ft.indexOf(f);
  if (i < 0 || !f) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + f.length)) + '</mark>' + esc(t.slice(i + f.length));
}
function resultsHTML() {
  const q = S.q.trim();
  if (!q) return `<div class="empty"><div class="gi">${ic('book')}</div><h3>Kelime ara</h3><p>İngilizce bir kelime ya da Türkçe anlamını yaz. <b>kahv</b> yazınca <b>breakfast</b> çıkar.</p></div>`;
  const rs = search(q);
  if (!rs.length) return `<div class="empty"><div class="gi">${ic('search')}</div><h3>“${esc(q)}” bulunamadı</h3><p>Kelimenin başını yazmayı dene. Türkçe harfler gerekmez: <b>odunc</b> da <b>ödünç</b> bulur.</p></div>`;
  return `<div class="res"><div class="cnt">${rs.length} sonuç</div>${rs.map(({ c, via }) => {
    const st = learnState(c.lemma);
    return `<button type="button" class="rrow" data-act="open" data-id="${esc(c.lemma)}">
      <span class="main"><span class="w"><b>${via === 'en' ? hl(c.lemma, q) : esc(c.lemma)}</b>${lvl(c.level)}${st === 'known' ? `<span class="st" aria-label="Biliyorsun">${ic('checkc', 'ic-sm')}</span>` : ''}</span>
      <span class="g">${via === 'tr' ? hl(c.gloss, q) : esc(c.gloss)}</span>
      ${via === 'alt' ? `<span class="via">Ayrıca: ${hl(c.alt.join(', '), q)}</span>` : `<span class="d">${esc(c.micro)}</span>`}
      ${via !== 'en' ? `<span class="via">Türkçe eşleşme</span>` : ''}</span>${ic('chevR', 'chev')}</button>`;
  }).join('')}</div>`;
}

function widgetVariants(kind, c) {

function fitWidgets() {
  $$('#viewport [data-shrink]').forEach(el => {
    el.style.fontSize = ''; el.style.overflow = 'hidden';
    let size = parseFloat(getComputedStyle(el).fontSize); const min = size * .7;
    while (el.scrollWidth > el.clientWidth + .5 && size > min) { size -= .5; el.style.fontSize = size + 'px'; }
  });
  $$('#viewport [data-fit]').forEach(el => {
    const vs = widgetVariants(el.dataset.fit, CARD[el.dataset.id]);
    for (const v of vs) { el.innerHTML = v; if (el.scrollHeight <= el.clientHeight + .5) return; }
  });
}

      + grp('Duvar kâğıdı', 'wwall', [['gece', 'Gece'], ['safak', 'Şafak'], ['gun', 'Gündüz']], w.wall)
      + grp('Kelime (uzun metinleri dene)', 'wword', WIDGET_WORDS.map((id, i) => [i, id]), w.word);
    return;
  }
  box.innerHTML = JUMPS[S.tab].map(([t, j]) => `<button type="button" class="chip" data-act="jump" data-j="${j}">${t}</button>`).join('');
}
function startRound(kind) { Object.assign(S.rv, { phase: 'card', kind, i: 0, revealed: false, picked: null, answers: [] }); }
function jump(j) {
  const r = S.rv;
  const go = t => { S.tab = t; };
  switch (j) {
    case 'feedprev': case 'feednext': {
      const f = $('#feed'); if (!f) return;
      S.feedIndex = Math.max(0, Math.min(FEED.length - 1, S.feedIndex + (j === 'feednext' ? 1 : -1)));
      f.scrollTo({ top: S.feedIndex * f.clientHeight, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      return;
    }
    case 'start-due': go('review'); Object.assign(r, { phase: 'start', kind: 'due' }); break;
    case 'start-new': go('review'); Object.assign(r, { phase: 'start', kind: 'new' }); break;
    case 'card': go('review'); startRound('new'); break;
    case 'card-rev': go('review'); startRound('new'); r.revealed = true; break;
    case 'quiz': go('review'); startRound('due'); break;
    case 'quiz-wrong': go('review'); startRound('due'); r.picked = 'lend'; break;
    case 'quiz-right': go('review'); startRound('due'); r.picked = 'borrow'; break;
    case 'sum': go('review'); Object.assign(r, { phase: 'summary', kind: 'due', answers: [{ id: 'borrow', g: 'good' }, { id: 'breakfast', g: 'easy' }, { id: 'actually', g: 'again' }, { id: 'date', g: 'hard' }] }); break;
    case 'done': go('review'); Object.assign(r, { phase: 'done' }); break;
    case 's-empty': go('search'); S.open = null; S.q = ''; break;
    case 's-kahv': go('search'); S.open = null; S.q = 'kahv'; break;
    case 's-odunc': go('search'); S.open = null; S.q = 'odunc'; break;
    case 's-none': go('search'); S.open = null; S.q = 'xyz'; break;
    case 's-detail': go('search'); S.open = 'borrow'; S.from = 'search'; break;
    case 'st': go('settings'); Object.assign(S.st, { push: null, sheet: false }); break;
    case 'st-known': go('settings'); Object.assign(S.st, { push: 'known', sheet: false }); break;
    case 'st-health': go('settings'); Object.assign(S.st, { push: 'health', sheet: false }); break;
    case 'st-reset': go('settings'); Object.assign(S.st, { push: null, sheet: true }); break;
    case 'st-denied': go('settings'); Object.assign(S.st, { push: null, sheet: false, denied: !S.st.denied, rem: true }); break;
    case 'st-recovery': go('settings'); Object.assign(S.st, { push: null, sheet: false, recovery: !S.st.recovery }); break;
  }
  render({ resetScroll: true });
}


/* ───────── Çizim ───────── */
const TABS = [['feed', 'Akış', 'stack'], ['review', 'Tekrar', 'cycle'], ['search', 'Sözlük', 'search'], ['settings', 'Ayarlar', 'gear']];
function appHTML() {
  const screen = { feed: renderFeed, review: renderReview, search: renderSearch, settings: renderSettings }[S.tab]();
  const tabs = TABS.map(([id, t, icn]) => `<button type="button" class="tab" role="tab" data-act="tab" data-v="${id}" aria-selected="${S.tab === id}">${ic(icn)}${t}${id === 'settings' && S.st.recovery ? '<span class="dot" aria-label="uyarı"></span>' : ''}</button>`).join('');
  return `<div class="app"><div class="page">${screen}</div><nav class="tabbar" role="tablist" aria-label="Sekmeler">${tabs}</nav>${sheetHTML()}</div>`;
}
let lastKey = '';
function screenKey() {
  if (S.view !== 'app') return 'w';
  return [S.tab, S.rv.phase, S.rv.i, S.open, S.st.push].join('|');
}
function render(opt = {}) {
  const root = document.documentElement, ph = $('#phone');
  root.dataset.theme = S.theme;
  ph.dataset.device = S.device; ph.dataset.style = S.style; ph.dataset.big = S.dt >= 3 ? '1' : '0'; ph.dataset.ax = S.dt >= 4 ? '1' : '0';
  ph.style.setProperty('--dt', DT[S.dt].v);
  $$('[data-act^="view:"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === 'view:' + S.view));
  $$('[data-act^="theme:"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === 'theme:' + S.theme));
  $$('[data-act^="style:"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === 'style:' + S.style));
  $$('[data-act^="device:"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === 'device:' + S.device));
  $('#dtRange').value = S.dt;
  $('#dtLabel').textContent = 'YAZI BOYUTU (DİNAMİK TÜR): ' + DT[S.dt].l.toLocaleUpperCase('tr');
  const brand = S.view === 'brand';
  $('#workspace').hidden = brand; $('#brandView').hidden = !brand;
  if (brand) { $('#brandView').innerHTML = renderBrand(); return; }

  const key = screenKey(), prev = $('#viewport .scroll');
  const keep = !opt.resetScroll && key === lastKey && prev ? prev.scrollTop : 0;
  lastKey = key;
  const vp = $('#viewport');
  vp.innerHTML = S.view === 'app' ? appHTML() : renderWidgets();
  const onWall = S.view === 'widgets';
  $('#statusbar').classList.toggle('light', onWall);
  $('#homebar').classList.toggle('light', onWall);
  $('#stageCap').innerHTML = onWall
    ? 'Widget düğmeleri çalışır: kelime satırı okur, ileri oku sonrakine geçer, onay işareti "Biliyorum" der.'
    : 'Telefonun içindeki sekme çubuğuyla gezin. Kartlar gerçek içerikten: <code>content/drafts/kisisel_v1</code>.';
  const sc = $('#viewport .scroll'); if (sc && keep) sc.scrollTop = keep;
  if (S.view === 'app' && S.tab === 'feed') hookFeed();
  if (S.view === 'app' && S.tab === 'search' && !S.open) hookSearch();
  if (onWall) fitWidgets();
  renderNotes(); renderJumps();
  fitPhone();
  requestAnimationFrame(audit);
}
function hookFeed() {
  const f = $('#feed');
  f.scrollTop = S.feedIndex * f.clientHeight;
  let t;
  f.addEventListener('scroll', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const i = Math.round(f.scrollTop / f.clientHeight);
      if (i !== S.feedIndex) { S.feedIndex = i; $$('#pager i').forEach((d, k) => d.classList.toggle('on', k === i)); $('#feedMeta').textContent = `Kelime ${i + 1} / ${FEED.length}`; }
    }, 60);
  }, { passive: true });
}
function hookSearch() {
  const q = $('#q');
  q.addEventListener('input', () => {
    S.q = q.value;
    $('#results').innerHTML = resultsHTML();
    $('.sfield .x').hidden = !S.q;
    requestAnimationFrame(audit);
  });
}
function fitPhone() {
  const box = $('#phoneBox'), ph = $('#phone'), stage = $('#stage');
  ph.style.transform = 'none';
  const w = ph.offsetWidth, h = ph.offsetHeight;
  const availW = Math.max(240, stage.clientWidth), availH = Math.max(640, window.innerHeight - 96);
  const k = Math.min(1, availW / w, availH / h);
  S.scale = k;
  ph.style.transform = `scale(${k})`;
  box.style.width = w * k + 'px'; box.style.height = h * k + 'px';
}
/* 44 pt denetimi: telefonun içindeki her dokunulabilir öğeyi ölçer (ölçek düzeltilmiş). */
function audit() {
  const k = S.scale || 1, bad = [];
  const els = $$('#viewport :is(button,input,summary,[role="button"])').filter(el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
  for (const el of els) {
    const t = el.tagName === 'INPUT' ? (el.closest('.sfield') || el) : el;
    const r = t.getBoundingClientRect();
    const w = r.width / k, h = el.classList.contains('hit44') ? Math.max(44, r.height / k) : r.height / k;
    if (w < 43.5 || h < 43.5) bad.push(`${(el.getAttribute('aria-label') || el.textContent).trim().slice(0, 24)} (${Math.round(w)}×${Math.round(h)})`);
  }
  const a = $('#audit');
  a.classList.toggle('bad', bad.length > 0);
  a.innerHTML = bad.length
    ? `Dokunma alanı: <b>${bad.length} öğe 44 pt'nin altında</b>: ${esc(bad.join(', '))}`
    : `Dokunma alanı denetimi: bu ekrandaki <b>${els.length} öğenin hepsi 44 × 44 pt ve üstü</b>.`;
  window.__audit = { total: els.length, bad };
}
let toastTimer;
function toast(text, undo) {
  $$('#viewport .toast').forEach(t => t.remove());
  const host = $('#viewport .app') || $('#viewport');
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  if (S.view === 'widgets') el.style.bottom = 'calc(var(--safe-bottom) + 110px)';
  el.innerHTML = `<span>${esc(text)}</span>${undo ? `<button type="button" data-act="${undo}">Vazgeç</button>` : ''}`;
  host.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 4000);
}
function say(text, el) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(x => x.lang === 'en-US');
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { /* ses yoksa yalnız görsel geri bildirim */ }
  el.classList.add('playing');
  setTimeout(() => el.classList.remove('playing'), Math.min(2600, 600 + text.length * 55));
}

/* ───────── Olaylar ───────── */
let lastUndo = null;
function answer(g) {
  const r = S.rv, id = DECK[r.kind][r.i];
  r.answers.push({ id, g });
  if (g !== 'again') { S.learning.add(id); }
  r.revealed = false; r.picked = null;
  if (r.i + 1 < DECK[r.kind].length) r.i++;
  else finishRound();
}
function finishRound() {
  const r = S.rv;
  if (r.kind === 'new') r.newDone += r.answers.length; else r.dueDone += r.answers.length;
  r.phase = r.answers.length ? 'summary' : 'start';
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const [k, arg] = act.split(':');
  const r = S.rv;
  switch (k) {
    case 'view': S.view = arg; S.wg.word = S.wg.word || 0; render({ resetScroll: true }); return;
    case 'theme': S.theme = arg; render(); return;
    case 'style': S.style = arg; render(); return;
    case 'device': S.device = arg; render(); return;
    case 'tab': S.tab = v; if (v === 'settings' && S.st.sheet) S.st.sheet = false; render({ resetScroll: true }); return;
    case 'say': case 'wsay': say(el.dataset.say, el); return;
    case 'jump': jump(el.dataset.j); return;
    case 'feedknow': {
      const id = el.dataset.id;
      if (S.known.has(id)) { S.known.delete(id); render(); toast(`${id} öğrenmeye geri alındı`); }
      else { S.known.add(id); lastUndo = id; render(); toast(`${id} bildiğin kelimelere eklendi`, 'undo-known'); }
      return;
    }
    case 'undo-known': if (lastUndo) { S.known.delete(lastUndo); lastUndo = null; render(); toast('Geri alındı'); } return;
    case 'start': startRound(r.kind); render({ resetScroll: true }); return;
    case 'reveal': r.revealed = true; render({ resetScroll: true }); return;
    case 'grade': answer(el.dataset.g); render({ resetScroll: true }); return;
    case 'pick': if (r.picked == null) { r.picked = el.dataset.o; render(); } return;
    case 'qnext': answer(r.picked === CARD[DECK.due[r.i]].quiz.answer ? 'good' : 'again'); render({ resetScroll: true }); return;
    case 'qgrade': answer(el.dataset.g); render({ resetScroll: true }); return;
    case 'finish': finishRound(); render({ resetScroll: true }); return;
    case 'sumok': if (r.kind === 'due') Object.assign(r, { phase: 'start', kind: 'new' }); else r.phase = 'done'; render({ resetScroll: true }); return;
    case 'more': startRound('new'); render({ resetScroll: true }); return;
    case 'goto-goal': S.tab = 'settings'; S.st.push = null; render({ resetScroll: true }); return;
    case 'tryq': S.q = el.dataset.q; S.open = null; render(); return;
    case 'clearq': S.q = ''; render(); $('#q')?.focus(); return;
    case 'open': S.open = el.dataset.id; S.from = 'search'; render({ resetScroll: true }); return;
    case 'open-known': S.tab = 'search'; S.open = el.dataset.id; S.from = 'known'; render({ resetScroll: true }); return;
    case 'back':
      if (S.from === 'known') { S.tab = 'settings'; S.st.push = 'known'; }
      S.open = null; S.from = null; render({ resetScroll: true }); return;
    case 'markknown': S.known.add(el.dataset.id); render(); toast(`${el.dataset.id}: Biliyorum`); return;
    case 'undoknown': S.known.delete(el.dataset.id); S.learning.add(el.dataset.id); render(); toast('Öğrenmeye geri alındı'); return;
    case 'freq': S.st.freq = +v; render(); return;
    case 'goal': S.st.goal = +v; render(); return;
    case 'rem': S.st.rem = !S.st.rem; render(); return;
    case 'remstep': S.st.remMin = (S.st.remMin + (+v) + 1440) % 1440; render(); return;
    case 'push': S.st.push = v; render({ resetScroll: true }); return;
    case 'pop': S.st.push = null; render({ resetScroll: true }); return;
    case 'reset': S.st.sheet = true; render(); return;
    case 'sheetbg': if (e.target === el) { S.st.sheet = false; render(); } return;
    case 'reset-no': S.st.sheet = false; render(); return;
    case 'reset-yes': S.st.sheet = false; S.known.clear(); S.learning.clear(); render(); toast('İlerleme sıfırlandı'); return;
    case 'recovery-ok': S.st.recovery = false; render(); return;
    case 'known-undo': {
      const id = el.dataset.id; S.known.delete(id); S.learning.add(id); lastUndo = id; render(); toast(`${id} geri alındı`, 'redo-known'); return;
    }
    case 'redo-known': if (lastUndo) { S.known.add(lastUndo); lastUndo = null; render(); } return;
    case 'health-refresh': toast("Widget'lar yenilendi"); return;
    case 'wsurface': S.wg.surface = v; render(); return;
    case 'wmode': S.wg.mode = v; render(); return;
    case 'wtint': S.wg.tint = v; render(); return;
    case 'wwall': S.wg.wall = v; render(); return;
    case 'wword': S.wg.word = +v; render(); return;
    case 'wnext': S.wg.word = (S.wg.word + 1) % WIDGET_WORDS.length; render(); return;
    case 'wknow': { const id = WIDGET_WORDS[S.wg.word]; S.wg.word = (S.wg.word + 1) % WIDGET_WORDS.length; render(); toast(`Biliyorum: ${id} sıradan çıktı`); return; }
  }
});
document.addEventListener('keydown', e => {
  const el = e.target.closest?.('[role="button"][data-act]');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); el.click(); }
  if (S.view === 'app' && S.tab === 'feed' && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest?.('#feed')) {
    e.preventDefault(); jump(e.key === 'ArrowDown' ? 'feednext' : 'feedprev');
  }
});
$('#dtRange').addEventListener('input', e => { S.dt = +e.target.value; render(); });
$('#targetsBox').addEventListener('change', e => { document.body.classList.toggle('show-targets', e.target.checked); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view !== 'brand') { fitPhone(); if (S.view === 'app' && S.tab === 'feed') { const f = $('#feed'); if (f) f.scrollTop = S.feedIndex * f.clientHeight; } } }, 80); });

/* ───────── Başlangıç ───────── */
(function init() {
  document.documentElement.lang = 'tr';
  S.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const h = location.hash.replace('#', '');
  const map = { akis: ['app', 'feed'], tekrar: ['app', 'review'], sozluk: ['app', 'search'], ayarlar: ['app', 'settings'], widgetlar: ['widgets'], marka: ['brand'] };
  if (map[h]) { S.view = map[h][0]; if (map[h][1]) S.tab = map[h][1]; }
  $('#brandIcon').innerHTML = appIcon('default').replace('<svg ', '<svg style="width:30px;height:30px;border-radius:9px" ');
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.view === 'widgets') fitWidgets(); audit(); });
})();

</script>
</body>
