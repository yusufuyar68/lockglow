<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lockglow widget galerisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Düzen: üstte sabit araç çubuğu (görünüm, renk, kelime); solda fikirler önerilen sırayla;
   ortada gerçek boyutlu iPhone çerçeveleri, altında Apple kuralları ve maliyet notları.
   Sayfa da uygulama gibi kâğıt ve mürekkep; sarı yalnız İngilizce kelimenin şeridinde. */
:root{
  --bg:#F3F3EE; --surface:#FFFFFF; --surface2:#EBEBE4; --surface3:#DEDED6;
  --line:rgba(21,24,27,.12); --line-strong:rgba(21,24,27,.24);
  --ink:#15181B; --ink2:#4E555B; --ink3:#626A71;
  --band:#F5E829;
  --good:#17703F; --good-tint:#DFF2E6; --bad:#B3261E; --bad-tint:#FBE5E2; --caution:#8F5600; --caution-tint:#F7EBD7;
  --code-bg:#EBEBE4;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-en:ui-serif,"New York","Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F11; --surface:#191C20; --surface2:#24282D; --surface3:#30353B;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.20);
    --ink:#F3F4F0; --ink2:#B7BDC2; --ink3:#8E959B;
    --band:#E9E040;
    --good:#5BD08F; --good-tint:rgba(91,208,143,.16); --bad:#FF8C80; --bad-tint:rgba(255,140,128,.16); --caution:#FF9E5A; --caution-tint:rgba(255,158,90,.14);
    --code-bg:#24282D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F11; --surface:#191C20; --surface2:#24282D; --surface3:#30353B;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.20);
  --ink:#F3F4F0; --ink2:#B7BDC2; --ink3:#8E959B;
  --band:#E9E040;
  --good:#5BD08F; --good-tint:rgba(91,208,143,.16); --bad:#FF8C80; --bad-tint:rgba(255,140,128,.16); --caution:#FF9E5A; --caution-tint:rgba(255,158,90,.14);
  --code-bg:#24282D; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
code{font:500 .86em var(--font-mono);background:var(--code-bg);padding:.08em .35em;border-radius:5px;overflow-wrap:anywhere}
.en{font-family:var(--font-en)}
.band{position:relative;z-index:0}
.band::before{content:"";position:absolute;z-index:-1;left:-.08em;right:-.08em;top:.36em;bottom:.03em;background:var(--band)}

/* ───────── Üst çubuk ───────── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{display:flex;flex-direction:column;gap:0;margin-right:auto;min-width:0}
.brand b{font:700 19px/1.2 var(--font-en);letter-spacing:-.005em}
.brand > span{font-size:13px;color:var(--ink2)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl-l{font:600 12px var(--font-ui);color:var(--ink2);letter-spacing:.03em}
.seg{display:inline-flex;background:var(--surface2);border-radius:22px;padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 13px;border-radius:19px;font:600 14px var(--font-ui);color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.sw{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px var(--line-strong) inset}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sw:disabled{opacity:.35;cursor:default}
.wordpick{display:inline-flex;align-items:center;gap:4px}
.wordpick button{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.wordpick select{min-height:38px;border-radius:19px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 15px var(--font-en);padding:0 12px;max-width:190px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ───────── Ana düzen ───────── */
.layout{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding-top:22px}
nav.ideas{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.ideas .nl{font:600 12px var(--font-ui);color:var(--ink3);letter-spacing:.04em;margin:0 0 6px 10px}
.ni{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;min-height:44px;padding:9px 10px;border-radius:12px;color:var(--ink2)}
.ni:hover{background:var(--surface2)}
.ni[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-strong) inset}
.ni .rk{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font:700 11px var(--font-ui);margin-top:1px;font-variant-numeric:tabular-nums}
.ni .rk.top3{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ni .tx{min-width:0;display:flex;flex-direction:column}
.ni .tx b{font:600 14px/1.3 var(--font-ui)}
.ni .tx small{font:500 12px/1.3 var(--font-ui);color:var(--ink3)}
main{min-width:0}

/* ───────── Fikir sayfası ───────── */
.idea-h{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.idea-h .big-rk{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:700 19px var(--font-ui)}
.idea-h .big-rk.dim{background:var(--surface2);color:var(--ink2)}
h1{margin:0;font:700 clamp(24px,3.2vw,32px)/1.15 var(--font-ui);letter-spacing:-.01em;text-wrap:balance}
h2{margin:0 0 10px;font:700 18px/1.3 var(--font-ui);text-wrap:balance}
h3{margin:0 0 8px;font:700 13px/1.3 var(--font-ui);letter-spacing:.04em;color:var(--ink2)}
.pitch{margin:6px 0 0;font-size:17px;line-height:1.5;color:var(--ink2);max-width:68ch;text-wrap:pretty}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fact{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 11px;border-radius:15px;background:var(--surface2);font:600 13px var(--font-ui);color:var(--ink)}
.fact span{color:var(--ink2);font-weight:500}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.18}
.dots i.on{opacity:1}
.risk-d{color:var(--good)} .risk-o{color:var(--caution)} .risk-y{color:var(--bad)}

.stage{display:flex;flex-wrap:wrap;gap:22px 26px;align-items:flex-start;padding:22px;border-radius:24px;background:var(--surface2);margin-bottom:10px}
.frame{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0;max-width:100%}
.frame figcaption{font:600 13px var(--font-ui);color:var(--ink2);text-align:center;max-width:36ch}
.hint{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink2);margin:0 0 24px;padding:0 4px}
.hint .ic{width:18px;height:18px;margin-top:2px}
.stage-ctl{width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.nc{background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:0 0 0 1px var(--line) inset;min-width:0}
.nc.wide{grid-column:1/-1}
.nc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.nc li{font-size:14.5px;line-height:1.5;color:var(--ink);text-wrap:pretty}
.nc li::marker{color:var(--ink3)}
.nc .src{list-style:none;padding:0}
.nc .src li{display:flex;gap:8px;align-items:baseline}
.nc .src li::before{content:"↗";color:var(--ink3);flex:none}
.tag{display:inline-block;font:700 10.5px/1 var(--font-ui);letter-spacing:.04em;padding:3px 6px;border-radius:6px;vertical-align:1px;margin-left:4px}
.tag.v{background:var(--good-tint);color:var(--good)}
.tag.u{background:var(--caution-tint);color:var(--caution)}

/* ───────── Özet ───────── */
.lead{font-size:17px;line-height:1.55;max-width:70ch;color:var(--ink);margin:8px 0 0;text-wrap:pretty}
.top3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0 30px}
.t3{background:var(--surface);border-radius:20px;padding:18px;box-shadow:0 0 0 1px var(--line) inset;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.t3:hover{box-shadow:0 0 0 1.5px var(--ink) inset}
.t3 .rk{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:700 14px var(--font-ui)}
.t3 b{font:700 17px/1.3 var(--font-ui)}
.t3 p{margin:0;font-size:14.5px;color:var(--ink2);line-height:1.5}
.t3 .facts{margin-top:auto;padding-top:6px}
.tbl-wrap{overflow-x:auto;border-radius:18px;box-shadow:0 0 0 1px var(--line) inset;background:var(--surface);margin-bottom:30px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--font-ui);letter-spacing:.04em;color:var(--ink2);background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .lnk{font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:30px}
.rules .nc b{display:block;margin-bottom:4px}
.rules .nc p{margin:0;font-size:14.5px;color:var(--ink2)}

/* ───────── Toast ───────── */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:20px;font:600 14px var(--font-ui);max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}

/* ═════════ Cihaz içi ═════════
   Cihazın içindeki renkler sayfa temasından bağımsızdır: üstteki "Görünüm" seçer.
   m-light: açık ana ekran, m-dark: koyu, m-tint: renklendirilmiş (iOS 18), m-glass: cam (iOS 26). */
.fit{position:relative;flex:none}
.fit>.dev{position:absolute;left:0;top:0;transform:scale(var(--k,1));transform-origin:0 0}
.phone{--s:#FFFFFF;--s2:#EBEBE4;--i:#15181B;--i2:#4E555B;--wband:#F5E829;--wline:rgba(21,24,27,.10);
  --ok:#17703F;--ok-t:#DFF2E6;--no:#B3261E;--no-t:#FBE5E2;--tc:#F2D34B;
  position:relative;padding:12px;background:#0B0C0E;border-radius:60px;color:var(--i);font-family:var(--font-ui);
  box-shadow:0 0 0 1.5px #34363c inset,0 40px 70px -40px rgba(0,0,0,.6)}
.phone.m-dark{--s:#191C20;--s2:#24282D;--i:#F3F4F0;--i2:#B7BDC2;--wband:#E9E040;--wline:rgba(255,255,255,.09);--ok:#5BD08F;--ok-t:rgba(91,208,143,.16);--no:#FF8C80;--no-t:rgba(255,140,128,.16)}
.phone.m-tint{--s:rgba(22,25,30,.62);--s2:rgba(255,255,255,.10);--i:#FFFFFF;--i2:rgba(255,255,255,.76);--wband:var(--tc);--wline:rgba(255,255,255,.14);--ok:#FFFFFF;--ok-t:rgba(255,255,255,.14);--no:#FFFFFF;--no-t:rgba(255,255,255,.07)}
.phone.m-glass{--s:rgba(255,255,255,.16);--s2:rgba(255,255,255,.20);--i:#FFFFFF;--i2:rgba(255,255,255,.90);--wband:rgba(255,255,255,.95);--wline:rgba(255,255,255,.28);--ok:#FFFFFF;--ok-t:rgba(255,255,255,.20);--no:#FFFFFF;--no-t:rgba(255,255,255,.10)}
.screen{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;isolation:isolate;background:#000}
.phone.land{border-radius:60px}
.phone.land .screen{width:844px;height:390px}
.wall{position:absolute;inset:0;z-index:0}
.wall.gun{background:radial-gradient(80% 45% at 30% 0%,rgba(255,255,255,.6),transparent 60%),linear-gradient(180deg,#8EB5CF 0%,#6F93B1 55%,#4F6E89 100%)}
.wall.gece{background:radial-gradient(80% 45% at 25% 10%,rgba(233,224,64,.20),transparent 62%),radial-gradient(70% 50% at 90% 75%,rgba(70,120,160,.45),transparent 70%),linear-gradient(180deg,#1C2731 0%,#0B0F13 80%)}
.wall.safak{background:radial-gradient(80% 45% at 70% 0%,rgba(255,226,150,.85),transparent 62%),linear-gradient(180deg,#F2A27E 0%,#B16E9E 55%,#3C3F7A 100%)}
.wall.dim::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.stat{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 40px;z-index:50;font:600 16px var(--font-ui);color:#fff;pointer-events:none}
.stat .si{display:flex;gap:6px;align-items:center}
.stat svg{height:12px;width:auto;fill:currentColor}
.island{position:absolute;top:11px;left:50%;width:122px;height:36px;margin-left:-61px;background:#000;border-radius:20px;z-index:55}
.homebar{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#fff;opacity:.9;z-index:60}

/* Ana ekran */
.hs{position:absolute;inset:0;padding:68px 26px 0;z-index:2;display:flex;flex-direction:column;gap:22px}
.hs .row{display:flex;justify-content:space-between;gap:22px}
.hs .icons{display:grid;grid-template-columns:repeat(4,1fr);row-gap:8px}
.app-i{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font:500 11px var(--font-ui);text-shadow:0 1px 3px rgba(0,0,0,.4);height:82px}
.app-i i{display:block;width:60px;height:60px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--a,#888),var(--b,#555))}
.app-i i::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 55%)}
.app-i i .ic{position:absolute;left:15px;top:15px;width:30px;height:30px;color:#fff;stroke-width:2.2;z-index:1}
.app-i.lg i{background:none}
.app-i.lg i::after{display:none}
.app-i.lg i svg{display:block;width:60px;height:60px}
.m-dark .app-i i{filter:brightness(.82)}
.m-tint .app-i i{background:rgba(24,27,32,.74)}
.m-tint .app-i i .ic{color:var(--tc)}
.m-tint .app-i i::after,.m-glass .app-i i::after{background:none}
.m-glass .app-i i{background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.3)}
.quad{width:158px;height:158px;display:grid;grid-template-columns:1fr 1fr;align-content:space-between;justify-items:center}
.quad .app-i{height:76px}
.dock{position:absolute;left:31px;right:31px;bottom:20px;height:86px;border-radius:34px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:flex;justify-content:space-around;align-items:center;z-index:3}
.dock .app-i{height:60px}
.dock .app-i span{display:none}
.pgdots{position:absolute;bottom:118px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3}
.pgdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.pgdots i:first-child{background:#fff}

/* Widget kabuğu */
.wg{position:relative;overflow:hidden;border-radius:24px;flex:none;display:flex;flex-direction:column;padding:16px;color:var(--i);background:var(--s);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.45),inset 0 0 0 1px var(--wline)}
.m-tint .wg{-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.m-glass .wg{-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);text-shadow:0 1px 3px rgba(20,20,40,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 0 0 1px rgba(255,255,255,.28),0 14px 30px -14px rgba(0,0,0,.5)}
.wg-s{width:158px;height:158px}
.wg-m{width:338px;height:158px}
.wg-l{width:338px;height:354px}
.wg .w{font-family:var(--font-en);font-weight:700;white-space:nowrap;color:var(--i);padding:0 .12em .3em;margin:0 -.12em -.3em;min-width:0;overflow:hidden;text-overflow:ellipsis}
.m-tint .wg .w{color:var(--tc)}
.wg .band::before{background:var(--wband)}
.m-dark .wg .band::before{top:auto;bottom:-.2em;height:.13em;clip-path:polygon(.1em 0,100% 0,calc(100% - .1em) 100%,0 100%)}
.m-dark .wg .band::after{content:"";position:absolute;z-index:-2;left:0;right:0;bottom:-.26em;height:.24em;background:rgba(233,224,64,.36);filter:blur(.16em);border-radius:50%}
.m-tint .wg .band::before,.m-glass .wg .band::before{top:auto;bottom:-.17em;height:.1em;clip-path:polygon(.08em 0,100% 0,calc(100% - .08em) 100%,0 100%)}
.wg-head{display:flex;align-items:baseline;gap:6px;min-height:24px;flex:none}
.wg-head .p{font:400 12px var(--font-en);color:var(--i2);white-space:nowrap}
.lv{margin-left:auto;font:700 11px var(--font-ui);color:var(--i2);padding-left:4px;flex:none}
.wg-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding-top:6px}
.wg .g{font:700 15px/1.2 var(--font-ui);color:var(--i);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.wg .d{font:400 12.5px/1.28 var(--font-en);color:var(--i2);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.wg .e{font:400 12px/1.28 var(--font-en);color:var(--i2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg .e b{color:var(--i)}
.wg .nx{font:500 11px var(--font-ui);color:var(--i2)}
.wg-m .g{font-size:16px}
.wg-m .d{font-size:13px}
.strip{display:flex;justify-content:space-between;margin:0 -8px -8px;flex:none}
.rail{display:flex;flex-direction:column;justify-content:space-between;margin:-8px -8px -8px 0;flex:none}
.wb{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--i);flex:none}
.wb span{width:34px;height:34px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.wb .ic{width:18px;height:18px}
.wb.playing span{animation:pulse .9s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

/* Quiz */
.q-lab{font:600 11.5px var(--font-ui);color:var(--i2);letter-spacing:.01em}
.q-sent{font:400 14.5px/1.3 var(--font-en);color:var(--i);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;margin-top:4px}

<script>
const CARDS = [{"id":"en.breakfast.n.1","lemma":"breakfast","type":"word","pos":"n","level":"A1","ipa":"/ˈbrɛkfəst/","gloss":"kahvaltı","micro":"first meal of the day","short":"the first meal of the day, eaten in the morning","exEn":"I usually have breakfast at seven.","exTr":"Genellikle yedide kahvaltı yaparım.","quiz":{"cloze":"We usually eat ______ at 7 a.m., before school.","answer":"breakfast","distractors":["dinner","supper","lunch"]},"mistake":{"wrong":"I did breakfast at eight.","right":"I had breakfast at eight.","why":"'Kahvaltı yapmak' kalıbını 'do' ile kurmayın; İngilizcede 'have breakfast' denir ('make breakfast' = hazırlamak)."},"note":"Türkçedeki 'kahvaltı' da bir birleşik sözcüktür (kahve altı). İngilizcede öğün adlarından önce genellikle 'the' kullanılmaz.","src":"s0_ornek/part_01.json"},{"id":"en.borrow.v.1","lemma":"borrow","type":"word","pos":"v","level":"A2","ipa":"/ˈbɑːroʊ/","gloss":"ödünç almak","micro":"take and give back later","short":"take something from someone and give it back later","exEn":"Can I borrow your pen for a minute?","exTr":"Kalemini bir dakikalığına ödünç alabilir miyim?","quiz":{"cloze":"Could I ______ your charger? Mine is dead.","answer":"borrow","distractors":["lend","give","owe"]},"mistake":{"wrong":"Can you borrow me your pen?","right":"Can you lend me your pen? / Can I borrow your pen?","why":"'Borrow' yalnızca alan kişi için; veren kişi 'lend' kullanır."},"note":"Türkçede 'ödünç' hem alma hem verme için kullanılır (ödünç almak / ödünç vermek). İngilizcede iki ayrı fiil var: borrow = alan, lend = veren.","src":"s0_ornek/part_01.json"},{"id":"en.actually.adv.1","lemma":"actually","type":"word","pos":"adv","level":"B1","ipa":"/ˈæktʃuəli/","gloss":"aslında, gerçekte","micro":"in fact; in reality","short":"used to say what is really true, often when it is not what people expect","exEn":"Actually, I'd prefer tea, if that's okay.","exTr":"Aslında çay tercih ederim, sakıncası yoksa.","quiz":{"cloze":"He looks young, but he is ______ forty.","answer":"actually","distractors":["currently","recently","fortunately"]},"mistake":{"wrong":"The actual price of petrol is very high.","right":"The current price of petrol is very high.","why":"'Güncel' = 'current'; 'actual' = gerçek/asıl."},"note":"Türkçedeki 'aktüel' = 'güncel'. İngilizce 'actual/actually' ise 'gerçek/aslında' demektir. 'Şu anda' için 'currently' veya 'at the moment' kullanılır.","src":"s0_ornek/part_01.json"},{"id":"en.spoon.n.1","lemma":"spoon","type":"word","pos":"n","level":"A1","ipa":"/spuːn/","gloss":"kaşık","micro":"tool for eating soup","short":"a small tool with a round end, used to eat soup or stir tea","exEn":"Can I have a spoon, please?","exTr":"Bir kaşık alabilir miyim lütfen?","quiz":{"cloze":"I eat soup with a ______, not with a fork.","answer":"spoon","distractors":["knife","plate","cup"]},"mistake":{"wrong":"Add two spoon of sugar.","right":"Add two spoons of sugar.","why":"Türkçede sayıdan sonra isim çoğul olmaz (iki kaşık); İngilizcede birden fazla ise -s gerekir: two spoons."},"note":"Türkçede 'kaşık' küçük de büyük de olabilir; İngilizcede küçük çay kaşığına teaspoon, büyük yemek kaşığına tablespoon denir.","src":"s1/part_01.json"},{"id":"en.umbrella.n.1","lemma":"umbrella","type":"word","pos":"n","level":"A1","ipa":"/ʌmˈbrɛlə/","gloss":"şemsiye","micro":"thing that keeps you dry","short":"a round cover on a stick that you hold over your head when it rains","exEn":"Ayşe forgot her umbrella on the bus.","exTr":"Ayşe şemsiyesini otobüste unuttu.","quiz":{"cloze":"Take your ______ with you. It will rain this afternoon.","answer":"umbrella","distractors":["sunglasses","sandals","swimsuit"]},"mistake":{"wrong":"I bought a umbrella yesterday.","right":"I bought an umbrella yesterday.","why":"'Umbrella' ünlü bir sesle (ʌ) başlar, bu yüzden 'an' gelir. Türkçedeki 'bir' her sözcükten önce aynı kaldığı için 'a umbrella' demek kolay olur."},"note":"Türkçede 'şemsiye' güneşten korunmak için de kullanılır; İngilizcede plaj şemsiyesine 'beach umbrella', küçük güneş şemsiyesine 'parasol' denir.","src":"s9/part_02.json"},{"id":"en.tired.adj.1","lemma":"tired","type":"word","pos":"adj","level":"A1","ipa":"/taɪrd/","gloss":"yorgun","micro":"needing sleep or rest","short":"feeling that you need to sleep or rest","exEn":"I'm so tired after work today.","exTr":"Bugün işten sonra çok yorgunum.","quiz":{"cloze":"I only slept three hours, so I feel very ______.","answer":"tired","distractors":["happy","lucky","early"]},"mistake":null,"note":"'Tired' yorgunluk demektir; uykun geldiyse 'sleepy' (uykulu) de denir.","src":"s3/part_01.json"},{"id":"en.headache.n.1","lemma":"headache","type":"word","pos":"n","level":"A1","ipa":"/ˈhɛdeɪk/","gloss":"baş ağrısı","micro":"pain in your head","short":"a pain in your head","exEn":"Mehmet took a pill for his headache.","exTr":"Mehmet baş ağrısı için bir hap aldı.","quiz":{"cloze":"My head hurts a lot. I have a bad ______.","answer":"headache","distractors":["towel","price","kettle"]},"mistake":{"wrong":"I have headache.","right":"I have a headache.","why":"Türkçede 'a/an' yoktur; 'headache' sayılabilir bir isimdir ve tekilse 'a' gerekir."},"note":"Türkçede 'başım ağrıyor' dersiniz; İngilizcede 'I have a headache' ya da 'My head hurts' denir.","src":"s1/part_11.json"},{"id":"en.forget.v.1","lemma":"forget","type":"word","pos":"v","level":"A1","ipa":"/fərˈɡɛt/","gloss":"unutmak","micro":"not remember something","short":"to not remember something, or to not do something that you should do","exEn":"Don't forget to call your mother.","exTr":"Annene telefon etmeyi unutma.","quiz":{"cloze":"I can't open my phone. I ______ my password.","answer":"forgot","distractors":["missed","opened","wore"]},"mistake":{"wrong":"I forgot buying milk, so we have none.","right":"I forgot to buy milk, so we have none.","why":"Türkçede 'süt almayı unuttum' tek yapıdır; '-mayı' eki çoğu zaman '-ing' gibi çevrilir. 'Forget to buy' yapılmayan işi, 'forget buying' yapılmış ama unutulmuş işi anlatır."},"note":"Unutmak iki yolla kurulur: forget + isim (şifremi unuttum) ya da forget to + fiil (aramayı unuttum). Düzensiz: forget - forgot - forgotten.","src":"s5/part_05.json"},{"id":"en.quiet.adj.1","lemma":"quiet","type":"word","pos":"adj","level":"A1","ipa":"/ˈkwaɪət/","gloss":"sessiz","micro":"making little noise","short":"with little or no noise","exEn":"I need a quiet place to study.","exTr":"Ders çalışmak için sessiz bir yere ihtiyacım var.","quiz":{"cloze":"Nobody talks in the library, so it is very ______ there.","answer":"quiet","distractors":["loud","dirty","busy"]},"mistake":null,"note":"'Quiet' (sessiz) ile 'quite' (oldukça) yazılışta karışır; ikisi ayrı kelimelerdir. 'Quiet' iki hecelidir: kwa-yet. Karşıtı 'loud' ya da 'noisy' (gürültülü).","src":"s7/part_02.json"},{"id":"en.weather.n.1","lemma":"weather","type":"word","pos":"n","level":"A1","ipa":"/ˈwɛðər/","gloss":"hava","micro":"heat, cold, rain, and wind","short":"what it is like outside, for example hot, cold, sunny, or rainy","exEn":"The weather is nice today.","exTr":"Bugün hava güzel.","quiz":{"cloze":"Is it going to rain tomorrow? Let's check the ______ forecast.","answer":"weather","distractors":["bus","jacket","hotel"]},"mistake":{"wrong":"How is the air today?","right":"How is the weather today?","why":"Türkçede 'Bugün hava nasıl?' dersiniz ve 'hava' sözcüğü 'air' sanılır. İngilizcede hava durumunu sorarken 'weather' kullanılır; 'air' soluduğumuz havadır."},"note":"Türkçede 'hava' hem 'air' hem 'weather' demektir. İngilizcede dışarıdaki hava durumu için 'weather', soluduğumuz hava için 'air' denir. 'Weather' sayılamaz.","src":"s9/part_06.json"},{"id":"en.wake_up.phv.1","lemma":"wake up","type":"phrasal_verb","pos":"phv","level":"A2","ipa":"/weɪk ˈʌp/","gloss":"uyanmak","micro":"stop sleeping","short":"stop sleeping and open your eyes","exEn":"I wake up at six every day.","exTr":"Her gün altıda uyanırım.","quiz":{"cloze":"Shh! Don't ______ the baby. She is sleeping.","answer":"wake up","distractors":["lie down","stay in","show up"]},"mistake":{"wrong":"She wakes up me at seven.","right":"She wakes me up at seven.","why":"Zamir (me, him, her) 'wake' ile 'up' arasına girer. 'Wake up me' yanlıştır."},"note":"Nesneyle birlikte (wake sb up) 'uyandırmak' olur. 'Get up' (yataktan kalkmak) ile karıştırmayın: önce wake up, sonra get up.","src":"s4/part_01.json"},{"id":"en.lend.v.1","lemma":"lend","type":"word","pos":"v","level":"A2","ipa":"/lɛnd/","gloss":"ödünç vermek","micro":"give for a short time","short":"give something to someone to use for a short time, and get it back later","exEn":"I never lend my books to anyone.","exTr":"Kitaplarımı kimseye ödünç vermem.","quiz":{"cloze":"Could you ______ me your umbrella? It's raining.","answer":"lend","distractors":["borrow","keep","hold"]},"mistake":{"wrong":"Can you borrow me your pen?","right":"Can you lend me your pen?","why":"Kalemi veren kişi 'lend' der; 'borrow' yalnızca alan kişi içindir."},"note":"Türkçede 'ödünç' hem verme hem alma için kullanılır. İngilizcede iki ayrı fiil var: 'lend' = veren, 'borrow' = alan. Düzensiz fiil: lend - lent - lent.","src":"s3/part_10.json"},{"id":"en.appointment.n.1","lemma":"appointment","type":"word","pos":"n","level":"A2","ipa":"/əˈpɔɪntmənt/","gloss":"randevu","micro":"arranged time to see someone","short":"a time that you arrange to see a doctor or another person","exEn":"Can I make an appointment for Monday?","exTr":"Pazartesi için randevu alabilir miyim?","quiz":{"cloze":"I can't come on Monday. I have a doctor's ______ at ten.","answer":"appointment","distractors":["recipe","discount","parcel"]},"mistake":{"wrong":"I took an appointment for Friday.","right":"I made an appointment for Friday.","why":"Türkçede 'randevu almak' dersiniz; İngilizcede 'take an appointment' denmez, 'make' ya da 'book an appointment' denir."},"note":"Doktor ya da resmî görüşme için 'appointment'. Türkçede 'randevu' romantik buluşma da olabilir; bunun için 'date' denir.","src":"s1/part_12.json"},{"id":"en.delicious.adj.1","lemma":"delicious","type":"word","pos":"adj","level":"A2","ipa":"/dɪˈlɪʃəs/","gloss":"lezzetli","micro":"tasting very good","short":"with a very good taste or smell","exEn":"This soup is delicious!","exTr":"Bu çorba çok lezzetli!","quiz":{"cloze":"Thank you, dinner was ______!","answer":"delicious","distractors":["hungry","angry","empty"]},"mistake":{"wrong":"This cake is very delicious.","right":"This cake is really delicious.","why":"'Delicious' zaten 'çok güzel' demektir; 'very' ile pek kullanılmaz. Vurgu için 'really' ya da 'absolutely' kullanın."},"note":"'Çok güzel' demek yeter ama İngilizcede yemek için 'delicious' çok doğaldır. 'Tasty' biraz daha hafif bir övgüdür.","src":"s1/part_01.json"},{"id":"en.neighbor.n.1","lemma":"neighbor","type":"word","pos":"n","level":"A2","ipa":"/ˈneɪbər/","gloss":"komşu","micro":"person who lives next to you","short":"a person who lives in the next home or very near your home","exEn":"Ayşe gave her neighbor some soup.","exTr":"Ayşe komşusuna biraz çorba verdi.","quiz":{"cloze":"The people who live next to us are our ______.","answer":"neighbors","distractors":["teachers","guests","drivers"]},"mistake":null,"note":"Ortadaki 'gh' okunmaz: 'ney-bır'. 'Neighborhood' mahalle demektir. İngiliz yazımı 'neighbour' olur.","src":"s1/part_06.json"},{"id":"en.recipe.n.1","lemma":"recipe","type":"word","pos":"n","level":"A2","ipa":"/ˈrɛsəpi/","gloss":"tarif","micro":"steps for cooking a dish","short":"a list of food and steps that show you how to cook a dish","exEn":"This is my grandmother's recipe for soup.","exTr":"Bu, büyükannemin çorba tarifi.","quiz":{"cloze":"My grandma gave me her ______ for apple cake.","answer":"recipe","distractors":["menu","receipt","plate"]},"mistake":{"wrong":"Can you tell me the recipe of this cake?","right":"Can you tell me the recipe for this cake?","why":"Türkçedeki 'pastanın tarifi' tamlaması 'of' dedirtir; oysa İngilizcede yemek için 'recipe for' kalıbı kullanılır."},"note":"'Yol tarifi' İngilizcede directions'dır; 'recipe' yalnızca yemek (veya karışım) tarifidir. Doktor reçetesi ise prescription'dır.","src":"s1/part_01.json"},{"id":"en.decide.v.1","lemma":"decide","type":"word","pos":"v","level":"A2","ipa":"/dɪˈsaɪd/","gloss":"karar vermek","micro":"make a choice","short":"to choose what to do after thinking about it","exEn":"We can't decide where to eat tonight.","exTr":"Bu akşam nerede yemek yiyeceğimize karar veremiyoruz.","quiz":{"cloze":"I can't ______ what to eat. The menu has too many things.","answer":"decide","distractors":["forget","finish","stop"]},"mistake":{"wrong":"I gave a decision to learn English.","right":"I decided to learn English.","why":"Türkçede 'karar verdim' deriz ve 'vermek' = 'give' gibi çevrilir. İngilizcede 'decide' tek fiildir ya da 'make a decision' denir."},"note":"Türkçede 'karar vermek' iki sözcüktür; İngilizcede 'decide' tek fiildir. Kendi kararın için 'give a decision' denmez: 'decide' ya da 'make a decision' denir.","src":"s5/part_05.json"},{"id":"en.remember.v.1","lemma":"remember","type":"word","pos":"v","level":"A2","ipa":"/rɪˈmɛmbər/","gloss":"hatırlamak","micro":"keep something in your mind","short":"keep something in your memory, or bring it back to your mind","exEn":"I can't remember her name.","exTr":"Onun adını hatırlayamıyorum.","quiz":{"cloze":"I can't ______ where I put my keys.","answer":"remember","distractors":["remind","miss","carry"]},"mistake":{"wrong":"Remember me to buy milk.","right":"Remind me to buy milk.","why":"Birinin sana hatırlatmasını istiyorsan 'remind' kullanılır; 'remember' kendi hafızanda tutmaktır."},"note":"Hatırlayan kişi 'remember'; birine hatırlatan kişi ya da şey 'remind'. 'Remember to do' = yapmayı unutmamak; 'remember doing' = yaptığını hatırlamak.","src":"s3/part_12.json"},{"id":"en.journey.n.1","lemma":"journey","type":"word","pos":"n","level":"A2","ipa":"/ˈdʒɜːrni/","gloss":"yolculuk","micro":"a trip between places","short":"the time you spend traveling from one place to another","exEn":"Have a safe journey!","exTr":"İyi yolculuklar!","quiz":{"cloze":"The ______ from Istanbul to Izmir by bus takes about nine hours.","answer":"journey","distractors":["ticket","station","luggage"]},"mistake":{"wrong":"Our journey in Paris was great.","right":"Our trip to Paris was great.","why":"Gidilen yerdeki gezi 'trip' olur; 'journey' sadece yolda geçen yolculuğu anlatır."},"note":"'Journey' yolda geçen süre ve yoldur; gidilen yerdeki gezi veya tatil için 'trip' kullanılır. 'Seyahat' daha resmî, 'yolculuk' daha günlüktür.","src":"s2/part_05.json"},{"id":"en.receipt.n.1","lemma":"receipt","type":"word","pos":"n","level":"A2","ipa":"/rɪˈsiːt/","gloss":"fiş","micro":"paper that shows you paid","short":"a piece of paper that shows what you bought and how much you paid","exEn":"Can I have a receipt, please?","exTr":"Fiş alabilir miyim lütfen?","quiz":{"cloze":"Please keep the ______. You need it if you want to return the shirt.","answer":"receipt","distractors":["recipe","menu","button"]},"mistake":null,"note":"Mağaza ya da market fişi için 'receipt'; elektrik faturası gibi ödenecek hesap için 'bill' denir. 'P' harfi okunmaz: ri-SİT.","src":"s1/part_09.json"},{"id":"en.soon.adv.1","lemma":"soon","type":"word","pos":"adv","level":"A2","ipa":"/suːn/","gloss":"yakında","micro":"in a short time","short":"in a short time from now; before long","exEn":"See you soon!","exTr":"Yakında görüşürüz!","quiz":{"cloze":"The movie starts in five minutes. Please sit down. It will begin ______.","answer":"soon","distractors":["yesterday","ago","back"]},"mistake":null,"note":"'Soon' = yakında, birazdan. 'Erken' için 'early' kullanılır: get up early (erken kalkmak). 'As soon as' = -ir -mez (gelir gelmez).","src":"s7/part_06.json"},{"id":"en.enough.det.1","lemma":"enough","type":"word","pos":"det","level":"A2","ipa":"/ɪˈnʌf/","gloss":"yeterince","micro":"as much as you need","short":"as much or as many as you need","exEn":"Elif is old enough to travel alone.","exTr":"Elif tek başına seyahat etmek için yeterince büyük.","quiz":{"cloze":"We have ______ chairs for everyone, so please sit down.","answer":"enough","distractors":["every","each","another"]},"mistake":{"wrong":"She is enough old to drive.","right":"She is old enough to drive.","why":"Türkçede 'yeterince' sıfattan önce gelir (yeterince büyük). İngilizcede 'enough' sıfat ve zarftan sonra gelir: old enough, big enough."},"note":"Türkçede 'yeterince büyük' dersiniz (yeterince sıfattan önce). İngilizcede sıfattan sonra gelir: big enough, old enough. İsimden önce gelir: enough money.","src":"s7/part_04.json"},{"id":"en.by_the_way.phr.1","lemma":"by the way","type":"phrase","pos":"phr","level":"A2","ipa":"/baɪ ðə ˈweɪ/","gloss":"bu arada","micro":"to add a new small point","short":"used to add something new or something you just remembered","exEn":"By the way, I like your new bag.","exTr":"Bu arada, yeni çantanı beğendim.","quiz":{"cloze":"I'll see you at six. ______, can you bring my book?","answer":"By the way","distractors":["Well done","Of course","Happy birthday"]},"mistake":null,"note":"Konuşmada ve mesajlarda yeni bir konu açar. Mesajlarda kısaca 'btw' yazılır. Türkçedeki 'bu arada' bazen 'meanwhile' anlamında da kullanılır; o zaman İngilizcesi farklıdır.","src":"s8/part_01.json"},{"id":"en.patient.n.1","lemma":"patient","type":"word","pos":"n","level":"B1","ipa":"/ˈpeɪʃənt/","gloss":"hasta","micro":"person who gets medical care","short":"a person who is being looked after by a doctor or a nurse","exEn":"The doctor will see the next patient now.","exTr":"Doktor şimdi sıradaki hastayı muayene edecek.","quiz":{"cloze":"The doctor is ready, so she calls her next ______ into the room.","answer":"patient","distractors":["passenger","customer","tourist"]},"mistake":null,"note":"Türkçede 'hasta' hem kişi hem durumdur. Doktorun baktığı kişiye 'patient' denir; hasta olmak ise 'be sick' ya da 'be ill' olur. Aynı yazılan sıfat 'patient' ise 'sabırlı' demektir.","src":"s12/part_01.json"},{"id":"en.commute.v.1","lemma":"commute","type":"word","pos":"v","level":"B1","ipa":"/kəˈmjuːt/","gloss":"işe gidip gelmek","micro":"travel to work every day","short":"to travel regularly between your home and your work or school","exEn":"I commute to work by train every day.","exTr":"Her gün işe trenle gidip geliyorum.","quiz":{"cloze":"I ______ to work by train; it takes about an hour each way.","answer":"commute","distractors":["retire","arrive","borrow"]},"mistake":{"wrong":"I commute to work with the metro.","right":"I commute to work by metro.","why":"Türkçede 'metroyla' dendiği için 'with' kullanılır; ama araç için 'by' (the yok) denir: by metro, by bus."},"note":"Türkçede tek kelimelik karşılığı yok. 'Commute' düzenli yapılan, genelde uzun gidiş-gelişi anlatır; tek seferlik yolculuk için 'travel' veya 'go' kullanılır.","src":"s2/part_09.json"},{"id":"en.afford.v.1","lemma":"afford","type":"word","pos":"v","level":"B1","ipa":"/əˈfɔːrd/","gloss":"gücü yetmek","micro":"have enough money to buy","short":"to have enough money to buy or pay for something","exEn":"Can we afford a holiday this year?","exTr":"Bu yıl tatile gidecek paramız var mı?","quiz":{"cloze":"That house is too expensive. We can't ______ it.","answer":"afford","distractors":["taste","boil","eat"]},"mistake":{"wrong":"I don't afford it.","right":"I can't afford it.","why":"'Afford' çoğunlukla 'can' ya da 'can't' ile kullanılır. Türkçedeki 'alamıyorum' anlamı 'can't afford' ile verilir."},"note":"'Afford' neredeyse her zaman 'can' ile kullanılır: 'I can afford it' = Param yeter. 'Affordable' = uygun fiyatlı.","src":"s1/part_10.json"},{"id":"en.improve.v.1","lemma":"improve","type":"word","pos":"v","level":"B1","ipa":"/ɪmˈpruːv/","gloss":"geliştirmek, gelişmek","micro":"make or become better","short":"become better than before, or make something better","exEn":"I want to improve my English.","exTr":"İngilizcemi geliştirmek istiyorum.","quiz":{"cloze":"My English is getting better. I want to ______ it more.","answer":"improve","distractors":["forget","ignore","lose"]},"mistake":{"wrong":"I want to develop my English.","right":"I want to improve my English.","why":"Türkçede 'İngilizcemi geliştirmek' dersiniz ve 'geliştirmek' 'develop' diye çevrilir. Var olan bir beceriyi daha iyi yapmak için 'improve' denir; 'develop' yeni bir şey ortaya çıkarmaktır."},"note":"Türkçede 'geliştirmek' İngilizcede çoğu zaman 'improve' olur; 'develop' daha çok yeni bir şey (plan, ürün) geliştirmek içindir. 'Improve my English' denir; 'develop my English' pek duyulmaz.","src":"s6/part_06.json"},{"id":"en.brave.adj.1","lemma":"brave","type":"word","pos":"adj","level":"B1","ipa":"/breɪv/","gloss":"cesur","micro":"ready to face danger","short":"ready to do something difficult or scary without showing fear","exEn":"It was brave of her to speak first.","exTr":"İlk önce konuşması cesurca bir davranıştı.","quiz":{"cloze":"Firefighters are very ______ people.","answer":"brave","distractors":["lazy","rude","selfish"]},"mistake":null,"note":"'Be brave!' = Cesur ol! / Dayan! Genelde zor bir an öncesinde, özellikle çocuklara söylenir.","src":"s3/part_04.json"},{"id":"en.under_the_weather.idm.1","lemma":"under the weather","type":"idiom","pos":"idm","level":"B1","ipa":"/ˌʌndər ðə ˈwɛðər/","gloss":"kendini pek iyi hissetmemek","micro":"feeling a little ill","short":"feeling a little unwell, with low energy, but not very ill","exEn":"I feel a bit under the weather today.","exTr":"Bugün kendimi pek iyi hissetmiyorum.","quiz":{"cloze":"I have a slight cough and no energy, so I feel a little ______.","answer":"under the weather","distractors":["over the moon","in a mess","on the ball"]},"mistake":null,"note":"Deyim hafif bir keyifsizlik için kullanılır; ağır hastalık için kullanılmaz. Hava durumuyla ilgisi yoktur; sözcük sözcük çevrilirse anlam çıkmaz.","src":"s12/part_03.json"},{"id":"en.lost_and_found.phr.1","lemma":"lost and found","type":"phrase","pos":"phr","level":"B1","ipa":"/ˌlɔːst ən ˈfaʊnd/","gloss":"kayıp eşya bürosu","micro":"place for things left behind","short":"the place where things that people left behind are kept for their owners","exEn":"Maria found her scarf at the lost and found.","exTr":"Maria atkısını kayıp eşya bürosunda buldu.","quiz":{"cloze":"Ali left his jacket at the airport. He went to the ______ to look for it.","answer":"lost and found","distractors":["post office","box office","tax office"]},"mistake":null,"note":"Türkçede 'kayıp eşya' denir. ABD'de 'lost and found', İngiltere'de 'lost property' kullanılır. 'Lost and found' eşyaların saklandığı yeri anlatır; 'lost property' ise kaybolan eşyalar için de kullanılır.","src":"s11/part_04.json"},{"id":"en.come_up_with.phv.1","lemma":"come up with","type":"phrasal_verb","pos":"phv","level":"B1","ipa":"/kʌm ˈʌp wɪð/","gloss":"bulmak, akıl etmek","micro":"think of an idea or plan","short":"think of a new idea, plan or answer, usually when you need one","exEn":"Can you come up with a better idea?","exTr":"Daha iyi bir fikir bulabilir misin?","quiz":{"cloze":"Nobody knew what to do, but Liam quickly ______ a good plan.","answer":"came up with","distractors":["turned off","gave back","woke up"]},"mistake":null,"note":"'Come up with' düşünerek bir fikir, plan ya da çözüm bulmaktır. Üç parça birlikte kalır; 'with' unutulursa anlam değişir: 'come up' ortaya çıkmak demektir.","src":"s10/part_04.json"},{"id":"en.take_a_rain_check.idm.1","lemma":"take a rain check","type":"idiom","pos":"idm","level":"B1","ipa":"/teɪk ə ˈreɪn tʃɛk/","gloss":"başka zamana bırakmak","micro":"ask to do it another day","short":"politely say no to a plan now and ask to do it another day instead","exEn":"Thanks, but I'll have to take a rain check.","exTr":"Teşekkürler ama başka zamana kalsın.","quiz":{"cloze":"“Can you come to dinner tonight?” “I'm busy. Can I ______? Let's do it next week.”","answer":"take a rain check","distractors":["spill the beans","miss the boat","steal the show"]} function fitSize(text, width, base, ratio = .52) {
  const need = text.length * ratio * base;
  return Math.round(Math.max(base * .6, Math.min(base, base * width / need)) * 10) / 10;
}

/* Örnek cümlede kelimeyi bulur (büyük/küçük harf ve sonek esnek). */
function markIn(sentence, lemma, tag = 'b') {
  const re = new RegExp('\\b(' + lemma.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[a-z]*)', 'i');
  const m = sentence.match(re);
  if (!m) return esc(sentence);
  const a = m.index, b = a + m[1].length;
  const inner = tag === 'band' ? `<span class="w"><span class="band">${esc(sentence.slice(a, b))}</span></span>` : `<b>${esc(sentence.slice(a, b))}</b>`;
  return esc(sentence.slice(0, a)) + inner + esc(sentence.slice(b));
}

/* Şık sırası kelime kimliğine göre sabit (uygulamadaki quiz gibi). */
function quizOptions(c) {
  const right = c.quiz.answer, wrong = c.quiz.distractors[0];
  return hash(c.id) % 2 ? [right, wrong] : [wrong, right];
}
/* Küçük quiz için çeldiricinin Türkçesi: çeldirici bir kartsa onun anlamı, değilse başka bir kartın. */
function glossDistractor(c) {
  for (const d of c.quiz.distractors) {
    const other = CARDS.find(x => x.lemma.toLowerCase() === d.toLowerCase());
    if (other && other.gloss !== c.gloss) return other.gloss;
  }
  let k = (CARDS.indexOf(c) + 7) % CARDS.length;
  while (CARDS[k].gloss === c.gloss) k = (k + 1) % CARDS.length;
  return CARDS[k].gloss;
}

function wQuizM(c) {
  const q = c.quiz, opts = quizOptions(c), picked = S.qm;
  const parts = q.cloze.split(/_{3,}/);
  const filled = picked
    ? `${esc(parts[0])}<span class="w"><span class="band">${esc(q.answer)}</span></span>${esc(parts.slice(1).join(''))}`
    : `${esc(parts[0])}<span class="blank" aria-label="boşluk"></span>${esc(parts.slice(1).join(''))}`;
  let bottom;
  if (!picked) {
    bottom = `<div class="q-opts">${opts.map(o => `<button type="button" class="opt" data-act="qm" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else {
    const ok = picked === q.answer;
    bottom = `<div class="q-fb"><span class="mk ${ok ? '' : 'x'}">${ic(ok ? 'check' : 'x')}</span>
      <span class="msg">${ok ? 'Doğru.' : 'Doğrusu:'} <span class="en">${esc(c.lemma)}</span> = ${esc(c.gloss)}${ok ? '' : `<small>Seçtiğin: <span class="en">${esc(picked)}</span></small>`}</span>
      ${wb('speaker', 'Kelimeyi dinle', 'speak', c.lemma)}${wb('fwd', 'Sıradaki soru', 'next')}</div>`;
  }
  return `<div class="wg wg-m" role="group" aria-label="Quiz widget'ı, orta">
    <div class="wg-head"><span class="q-lab">Boşluğa hangisi gelir?</span><span class="lv">${c.level}</span></div>
    <div class="q-sent">${filled}</div>${bottom}</div>`;
}

function wQuizS(c) {
  const right = c.gloss, wrong = glossDistractor(c);
  const opts = hash(c.id + 's') % 2 ? [right, wrong] : [wrong, right];
  const picked = S.qs;
  if (picked) {
    const ok = picked === right;
    return `<div class="wg wg-s" role="group" aria-label="Quiz widget'ı, küçük">
      <div class="wg-head">${word(c, 104, 20)}<span class="lv">${c.level}</span></div>
      <div class="wg-body"><div class="q-lab" style="display:flex;gap:4px;align-items:center">${ic(ok ? 'check' : 'x')}${ok ? 'Doğru' : 'Doğrusu'}</div><div class="g" style="-webkit-line-clamp:2">${esc(right)}</div></div>
      <div class="strip">${wb('speaker', 'Kelimeyi dinle', 'speak', c.lemma)}<span></span>${wb('fwd', 'Sıradaki soru', 'next')}</div></div>`;
  }
  return `<div class="wg wg-s" role="group" aria-label="Quiz widget'ı, küçük">
    <div class="wg-head">${word(c, 104, 20)}<span class="lv">${c.level}</span></div>

    how: ['Şimdilik yapılmaz. Kilit ekranı ve quiz oturduktan sonra yeniden bakılır.'],
    benefit: ['Bileğe bakış en kısa etkileşim: günde onlarca kez.'],
    risk: ['İkinci platform: test, TestFlight ve macOS dakikaları (CLAUDE.md: 10 kat sayılıyor).'],
    links: ['accessory', 'watchConn', 'wwdc25']
  }
];

/* ───────── Özel çerçeveler ───────── */
function ccInner() {
  const c = card();
  return `<div class="cc"><div class="cc-grid">
    <div class="mod conn"><span class="on">${ic('plane')}</span><span class="on">${ic('cell')}</span><span class="on">${ic('wifi')}</span><span class="on">${ic('bt')}</span></div>
    <div class="mod music"><b>Çalan yok</b><small>Müzik</small></div>
    <div class="ctl-m" style="grid-column:1/3"><span class="ci">${ic('moon')}</span><span class="tx"><b style="font-family:var(--font-ui)">Odak</b><small>Kapalı</small></span></div>
    <div class="mod slider" style="--v:62%;grid-column:3;grid-row:3/5">${ic('sun')}</div>
    <div class="mod slider" style="--v:40%;grid-column:4;grid-row:3/5">${ic('vol')}</div>
    <button type="button" class="ctl-m mine-ring" style="grid-column:1/3;grid-row:4" data-act="speak" data-v="${esc(c.lemma)}" aria-label="Kelimeyi dinle"><span class="ci">${ic('speaker')}</span><span class="tx"><b style="font-family:var(--font-ui)">Kelimeyi dinle</b><small>Şu anki kelime</small></span></button>
    <div class="mod c">${ic('flash')}</div><div class="mod c">${ic('clock')}</div>
    <button type="button" class="mod c mine-ring" data-act="next" aria-label="Sonraki kelime">${ic('fwd')}</button>
    <div class="mod c">${ic('camera')}</div>
    <div class="mod c">${ic('calc')}</div>
  </div><div class="cc-cap">Beyaz çerçeveli iki kontrol Lockglow’un</div></div>`;
}

function liveActivity() {
  const a = S.la, c = card(a.k);
  const n = Math.min(a.k + 1, LA_TOTAL);
  const prog = (a.done ? LA_TOTAL : a.k) / LA_TOTAL * 100;
  let mid, btns;
  if (a.done) {
    mid = `<div class="la-done">Tur bitti. ${a.good} kelimeyi bildin${a.again ? `, ${a.again} kelime 10 dakika sonra yine gelir` : ''}.</div>`;
    btns = `<div class="la-btns"><button type="button" class="pill" data-act="la-reset">Kapat</button></div>`;
  } else {
    mid = `<div class="la-mid"><div class="wmain"><div style="display:flex;align-items:baseline;gap:8px;min-width:0">${word(c, 230, 26)}${c.ipa ? `<span class="p">${esc(c.ipa)}</span>` : ''}</div>
      ${a.phase === 'ask' ? '<div class="q">Ne demekti? Önce kendin hatırla.</div>' : `<div class="g">${esc(c.gloss)}</div>`}</div></div>`;
    btns = a.phase === 'ask'
      ? `<div class="la-btns"><button type="button" class="pill pri" data-act="la-show">${ic('eye')}Göster</button></div>`
      : `<div class="la-btns"><button type="button" class="pill" data-act="la-again">${ic('x')}Bilemedim</button><button type="button" class="pill pri" data-act="la-good">${ic('check')}Bildim</button></div>`;
  }
  return `<div class="la" role="group" aria-label="Canlı Etkinlik: tekrar turu"><div class="la-top">${appIcon(S.mode !== 'light')}<span>Tekrar turu</span><span class="n">${a.done ? 'Bitti' : `${n} / ${LA_TOTAL}`}</span></div>
    <div class="la-prog"><i style="width:${prog}%"></i></div>${mid}${btns}</div>`;
}

function diFrame() {
  const a = S.la, c = card(a.k), n = a.done ? LA_TOTAL : a.k;
  const r = 7, len = 2 * Math.PI * r;
  return `<div class="fit" data-w="414" data-h="150" data-max=".8"><div class="dev"><div class="di-frame"><div class="di-scr"><div class="wall ${WALL[S.mode]}"></div>${STAT.replace('{T}', '10:02')}
    <div class="di"><span class="l"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/><circle cx="10" cy="10" r="${r}" fill="none" stroke="#E9E040" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(len * n / LA_TOTAL).toFixed(1)} ${len.toFixed(1)}" transform="rotate(-90 10 10)"/></svg>${a.done ? 'Bitti' : `${a.k + 1}/${LA_TOTAL}`}</span><span class="r">${a.done ? '✓' : esc(c.lemma)}</span></div>
  </div></div></div></div>`;
}

function standby(c) {
  return `<div class="fit" data-w="868" data-h="414" data-max=".9"><div class="dev"><div class="phone land"><div class="screen sb ${S.night ? 'sbnight' : 'sbday'}">
    <div class="sb-clock">10:42<small>Perşembe 22 Ekim</small></div>
    <div class="sb-w"><span class="lvl">${c.level}</span>${word(c, 380, 56)}<div class="g">${esc(c.gloss)}</div><div class="d">${esc(c.micro)}</div></div>
  </div></div></div></div>`;
}

function cfgWidget() {
  const c = card();
  if (S.cfg.show === 'quiz') return wQuizM(c);
  if (S.cfg.show === 'cumle') return wSentence();
  return wMedium(c);
}
function editSheet() {
  const o = (k, v, t) => `<button type="button" data-act="cfg" data-v="${k}:${v}" aria-pressed="${S.cfg[k] === v}"><span>${t}</span></button>`;
  return `<div class="edit">${cfgWidget()}<div class="esheet">
    <div class="ehead">${appIcon(S.mode !== 'light')}<div><b>Lockglow</b><small>Ana ekranda öğren</small></div></div>
    <div class="erow"><span class="k">Ne gösterilsin?</span><div class="eopts">${o('show', 'kelime', 'Kelime')}${o('show', 'cumle', 'Cümle')}${o('show', 'quiz', 'Quiz')}</div></div>
    <div class="erow"><span class="k">Türkçe anlam</span><div class="eopts">${o('when', 'now', 'Hemen')}${o('when', 'later', '5 dakika sonra')}</div></div>
  </div></div>`;
}

/* ───────── Sayfalar ───────── */
const dots = n => `<span class="dots" role="img" aria-label="5 üzerinden ${n}">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= n ? 'on' : ''}"></i>`).join('')}</span>`;
const riskCls = r => r === 'Düşük' ? 'risk-d' : r === 'Orta' ? 'risk-o' : 'risk-y';
const facts = d => `<div class="facts"><span class="fact">${esc(d.ios)}</span><span class="fact"><span>Fayda</span>${dots(d.fayda)}</span><span class="fact"><span>Maliyet</span>${esc(d.maliyet)}</span><span class="fact"><span>Risk</span><b class="${riskCls(d.riskLv)}">${esc(d.riskLv)}</b></span></div>`;
const list = arr => `<ul>${arr.map(x => `<li>${x}</li>`).join('')}</ul>`;

function ideaView(d) {
  return `<article aria-labelledby="h-${d.id}">
    <header class="idea-h"><div class="big-rk ${d.rank > 3 ? 'dim' : ''}" aria-label="Önerilen sıra ${d.rank}">${d.rank}</div><div style="min-width:0"><h1 id="h-${d.id}">${esc(d.title)}</h1><p class="pitch">${esc(d.pitch)}</p>${facts(d)}</div></header>
    <div class="stage">${d.stage()}</div>
    <p class="hint">${ic('tap')}<span>${esc(d.hint)}</span></p>
    <div class="notes">
      <section class="nc"><h3>APPLE NE İZİN VERİYOR</h3>${list(d.allow)}</section>
      <section class="nc"><h3>BÜTÇE VE YENİLENME</h3>${list(d.budget)}</section>
      <section class="nc"><h3>NASIL YAPILIR</h3>${list(d.how)}</section>
      <section class="nc"><h3>KULLANICIYA FAYDASI</h3>${list(d.benefit)}</section>
      <section class="nc"><h3>DİKKAT</h3>${list(d.risk)}</section>
      <section class="nc"><h3>KAYNAKLAR</h3>${src(d.links)}<p style="margin:10px 0 0;font-size:13px;color:var(--ink2)">Swift taslağı: <code>docs/tasarim/alternatifler/widget_galerisi.md</code></p></section>
    </div></article>`;
}

function summaryView() {
  const t3 = IDEAS.slice(0, 3).map(d => `<button type="button" class="t3" data-act="view" data-v="${d.id}"><span class="rk">${d.rank}</span><b>${esc(d.title)}</b><p>${esc(d.pitch)}</p>${facts(d)}</button>`).join('');
  const rows = IDEAS.map(d => `<tr><td class="num">${d.rank}</td><td><button type="button" class="lnk" data-act="view" data-v="${d.id}" style="text-decoration:underline;text-underline-offset:3px">${esc(d.title)}</button></td><td class="num">${esc(d.ios)}</td><td>${dots(d.fayda)}</td><td class="num">${esc(d.maliyet)}</td><td class="${riskCls(d.riskLv)}" style="font-weight:600">${esc(d.riskLv)}</td><td>${esc(d.yeni)}</td></tr>`).join('');
  return `<article>
    <header class="idea-h"><div style="min-width:0"><h1>Yeni widget ve kilit ekranı fikirleri</h1>
    <p class="lead">Lockglow’un asıl gücü widget’lar. Bu galeri, bugünkü küçük, orta ve kilit ekranı widget’larının ötesinde on fikri gerçek iPhone çerçevelerinde gösterir. Her fikrin yanında Apple’ın neye izin verdiği, yenilenme sınırları, maliyet ve fayda var. Kartlar <code>content/drafts/kisisel_v1</code> içinden olduğu gibi alındı. Swift koduna dokunulmadı; hiçbiri cihazda denenmedi.</p></div></header>
    <h2>Önerilen ilk üç</h2>
    <div class="top3">${t3}</div>
    <h2>Bütün fikirler</h2>
    <div class="tbl-wrap"><table><thead><tr><th>SIRA</th><th>FİKİR</th><th>SÜRÜM</th><th>FAYDA</th><th>MALİYET</th><th>RİSK</th><th>YENİ HEDEF / İZİN</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h2>Bütün yeni widget’lar için kurallar</h2>
    <div class="rules">
      <div class="nc"><b>Aynı anda her yerde aynı kelime</b><p>Yeni widget’lar ve kontroller de aynı dönüşümü okur (<code>TimelinePlanner.wordAt</code>). “Sıradaki” her yerde aynı imleci ilerletir (ios/README, süreklilik).</p></div>
      <div class="nc"><b>Widget SQLite açmaz</b><p>Quiz, cümle, tekrar saatleri gibi yeni veriyi uygulama plana yazar. Widget yalnız iki küçük JSON okur.</p></div>
      <div class="nc"><b>Sarı yalnız kelimede</b><p>Şerit öğrenilecek kelimede ve örnekteki aynı kelimede. Doğru/yanlış, ilerleme ve seçim mürekkep rengi.</p></div>
      <div class="nc"><b>Renk tek başına anlam taşımaz</b><p>Renklendirilmiş, cam ve kilit ekranında yeşil ve kırmızı kaybolur: her zaman ✓ ✗ ve bir kelime.</p></div>
      <div class="nc"><b>Yormayan</b><p>Seri yok, puan yok, kırmızı rozet yok, hareket yok. Bir widget, bir soru; küçük widget’ta en çok üç düğme.</p></div>
      <div class="nc"><b>44 pt</b><p>Her dokunma alanı en az 44 × 44 pt. Kilit ekranı ve StandBy’da düğme yok.</p></div>
    </div>
    <p class="hint">${ic('info')}<span>Soldan bir fikre geç. Üstteki “Görünüm” açık, koyu, renklendirilmiş ve cam ana ekranı değiştirir; “Kelime” bütün çerçevelerdeki kartı değiştirir.</span></p>
  </article>`;
}

/* ───────── Çizim ───────── */
function renderTop() {
  $('#modeSeg').innerHTML = MODES.map(([k, t]) => `<button type="button" data-act="mode" data-v="${k}" aria-pressed="${S.mode === k}">${t}</button>`).join('');
  $('#tintSw').innerHTML = TINTS.map(([n, c], k) => `<button type="button" class="sw" style="background:${c}" data-act="tint" data-v="${k}" aria-label="Renk: ${n}" aria-pressed="${S.tint === k}" ${S.mode === 'tint' || S.view === 'cam' ? '' : 'disabled'}></button>`).join('');
  $('#wordSel').value = String(S.i);
}
function renderNav() {
  $('#nav').innerHTML = `<span class="nl">ÖNERİLEN SIRA</span>
    <button type="button" class="ni" data-act="view" data-v="ozet" ${S.view === 'ozet' ? 'aria-current="page"' : ''}><span class="rk">${ic('info').replace('class="ic ', 'class="ic " style="width:14px;height:14px" ')}</span><span class="tx"><b>Özet ve sıra</b><small>On fikir, tek tabloda</small></span></button>`
    + IDEAS.map(d => `<button type="button" class="ni" data-act="view" data-v="${d.id}" ${S.view === d.id ? 'aria-current="page"' : ''}><span class="rk ${d.rank <= 3 ? 'top3' : ''}">${d.rank}</span><span class="tx"><b>${esc(d.title)}</b><small>${esc(d.short)}</small></span></button>`).join('');
}
function render() {
  renderTop();
  renderNav();
  const d = IDEAS.find(x => x.id === S.view);
  $('#main').innerHTML = d ? ideaView(d) : summaryView();
  fitAll();
}
function fitAll() {
  document.querySelectorAll('.fit').forEach(f => {
    const w = +f.dataset.w, h = +f.dataset.h, max = +(f.dataset.max || 1);
    const stage = f.closest('.stage');
    const avail = stage ? stage.clientWidth - parseFloat(getComputedStyle(stage).paddingLeft) * 2 : w;
    const k = Math.min(max, avail / w);
    f.style.setProperty('--k', k);
    f.style.width = (w * k) + 'px';
    f.style.height = (h * k) + 'px';
  });
}

/* ───────── Ses ve bildirim ───────── */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function speak(text, btn) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) throw new Error('no speech');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = .9;
    const v = synth.getVoices().find(x => /^en(-|_)US/i.test(x.lang));
    if (v) u.voice = v;
    synth.cancel();
    if (btn) btn.classList.add('playing');
    u.onend = u.onerror = () => btn && btn.classList.remove('playing');
    synth.speak(u);
  } catch (err) {
    toast('Bu tarayıcı sesi çalamıyor. Telefonda kelime İngilizce okunur.');
  }
}

/* ───────── Etkileşim ───────── */
function setWord(i) {
  S.i = ((i % CARDS.length) + CARDS.length) % CARDS.length;
  S.qm = null; S.qs = null; S.sent = false;
  render();
}
function act(a, v, el) {
  switch (a) {
    case 'view':
      S.view = v;
      try { history.replaceState(null, '', v === 'ozet' ? location.pathname + location.search : '#' + v); } catch (err) { /* önizlemede adres değişmez */ }
      render();
      window.scrollTo({ top: 0 });
      break;
    case 'mode': S.mode = v; render(); break;
    case 'tint': S.tint = +v; render(); break;
    case 'word': setWord(S.i + (+v)); break;
    case 'speak': speak(v, el.classList.contains('wb') ? el : null); break;
    case 'next': setWord(S.i + 1); toast('Sonraki kelime: bütün widget’lar aynı kelimeye geçer.'); break;
    case 'know': { const w = card().lemma; setWord(S.i + 1); toast(`“${w}” bilinenlere eklendi; bir daha çıkmaz.`); break; }
    case 'qm': S.qm = v; render(); break;
    case 'qs': S.qs = v; render(); break;
    case 'sent': S.sent = !S.sent; render(); break;
    case 'big': S.big = !S.big; render(); break;
    case 'night': S.night = v === '1'; render(); break;
    case 'cfg': { const [k, val] = v.split(':'); S.cfg[k] = val; render(); break; }
    case 'la-show': S.la.phase = 'show'; render(); break;
    case 'la-good':
    case 'la-again':
      if (a === 'la-good') S.la.good++; else S.la.again++;
      S.la.k++; S.la.phase = 'ask';
      if (S.la.k >= LA_TOTAL) { S.la.done = true; S.la.k = LA_TOTAL - 1; }
      render();
      break;
    case 'la-reset': S.la = { k: 0, phase: 'ask', good: 0, again: 0, done: false }; render(); break;
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  act(b.dataset.act, b.dataset.v, b);
});

/* ───────── Başlangıç ───────── */
$('#wordSel').innerHTML = CARDS.map((c, k) => `<option value="${k}">${esc(c.lemma)} · ${esc(c.level)}</option>`).join('');
$('#wordSel').addEventListener('change', e => setWord(+e.target.value));
const fromHash = (location.hash || '').slice(1);
if (IDEAS.some(d => d.id === fromHash)) S.view = fromHash;
render();
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').slice(1);
  const v = IDEAS.some(d => d.id === h) ? h : 'ozet';
  if (v !== S.view) { S.view = v; render(); window.scrollTo({ top: 0 }); }
});
let fitTimer;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitAll, 60); });
if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch (err) { /* sesler sonra yüklenir */ } }
</script>
</body>
</html>
