name: Lockglow

options:
  deploymentTarget:
    iOS: "17.0"
    # is5-watch: the Apple Watch app and its complications.
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Project-level xcconfig: BUNDLE_ID_PREFIX, APP_ID_SLUG, APP_DISPLAY_NAME, APP_GROUP_ID, DEVELOPMENT_TEAM,
# versions.
# Do not repeat those keys under `settings:` below; explicit settings would override the xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    # iPhone and iPad (2026-10-23). On an Apple silicon Mac the iPad app runs as "Designed for
    # iPad" (whether the App Store offers it there is an App Store Connect setting).
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES

packages:
  # GRDB is declared only in VocabKit's Package.swift (ContentStore depends on it). Declaring it
  # here too would create a second reference to the same package identity.
  VocabKit:
    path: Packages/VocabKit

targets:
  Lockglow:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "Resources/README.md"
          - "Resources/RecordedSpeech/**"
      # The recorded clips of "Dinle" (vocabpipe.recorded_speech), as ONE folder: the voices'
      # subfolders stay in the bundle (RecordedSpeech/us-female/...) and the project file does not
      # list thousands of files.
      - path: App/Resources/RecordedSpeech
        type: folder
        buildPhase: resources
      # Embedded fallback copy of the seed words (shared file with the widget).
      - path: Widgets/Resources/seed_words.json
      # Shared with the widget extension: the speaker intent runs in THIS process (AudioPlaybackIntent).
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_ID_SLUG)
        PRODUCT_NAME: Lockglow
        # App/AppIcon.icon (Icon Composer, iOS 26; Xcode also makes the older icons from it) and the
        # App/Assets.xcassets/AppIcon.appiconset fallback; both from ios/Tools/make_app_icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Default tint for UIKit-presented UI (rule 2: never system blue); same values as Theme.tint.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # FoundationModels exists from iOS 26 only ("Kendi cümleni yaz", OwnSentenceAI.swift); the
        # app starts at iOS 17, where a strong link would stop it at launch. build.yml checks the
        # load command is weak.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # "Söyle" (pronunciation practice): asked on first use only; recognition runs on the device.
        # Apple: the speech key is required for any app using the Speech framework (on-device too).
        # is5-golgeleme: the take is kept in memory for "Kendi sesini dinle" until the page closes.
        NSMicrophoneUsageDescription: "Söyle alıştırmasında sesini dinlemek ve sana geri çalmak için mikrofon kullanılır. Ses telefondan çıkmaz, Söyle sayfası kapanınca silinir."
        NSSpeechRecognitionUsageDescription: "Söylediğin kelimenin anlaşılıp anlaşılmadığını görmek için konuşma tanıma kullanılır. Bu iş telefonda yapılır; sesin hiçbir yere gönderilmez."
        # "Metinden kelime bul": "Kamerayla tara" reads English text live (VisionKit). Nothing is recorded
        # or sent. "Fotoğraftan al" uses the system photo picker, which needs no permission.
        NSCameraUsageDescription: "Kamera yalnız İngilizce yazıyı okumak için kullanılır (Kamerayla tara). Görüntü kaydedilmez, telefondan çıkmaz."
        # is5-haftalik: "Paylaş" on "Geçen hafta" offers "Resmi Kaydet"; without this key iOS stops the app there.
        NSPhotoLibraryAddUsageDescription: "Paylaşım resmini Fotoğraflar'a kaydetmek için. Lockglow fotoğraflarını görmez."
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true # is5-canli: the "Tekrar" round on the Lock Screen (App/ReviewLiveActivity.swift)
        # The page colour (Theme.bg) with the icon's mark in the middle (Assets.xcassets).
        UILaunchScreen: {UIColorName: LaunchBackground, UIImageName: LaunchMark}
        # iPhone: portrait only. iPad: every orientation, which iPad multitasking requires (Split
        # View, Slide Over, Stage Manager windows; the resizable Mac window).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # One window: two windows would run two Tekrar rounds and two openings on one progress.
        # Multitasking still works (the window shares the screen and resizes).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The widget's speaker button (SpeakWordIntent, an AudioPlaybackIntent) starts speech while the
        # app runs in the background; Apple: the .playback category needs this mode to play there.
        UIBackgroundModes:
          - audio
          - fetch # is5-canli: closes the round's Live Activity (ReviewLiveActivity.refreshTaskID)
        BGTaskSchedulerPermittedIdentifiers: # is5-canli
          - $(PRODUCT_BUNDLE_IDENTIFIER).reviewLiveActivity
        WGAppGroupID: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            # Same value as DeepLink.scheme in VocabKit/CoreModels.
            CFBundleURLSchemes:
              - vocabwidget
    entitlements:
      path: App/Lockglow.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: LockglowWidgets
        embed: true
      - package: VocabKit
        product: CoreModels
      - package: VocabKit
        product: TextFold
      - package: VocabKit
        product: SharedState
      - package: VocabKit
        product: Scheduler
      - package: VocabKit
        product: ContentStore
      # App only: the widget extension must not link Learning.
      - package: VocabKit
        product: Learning
      # App only: the "Söyle" pronunciation check.
      - package: VocabKit
        product: Pronunciation

  LockglowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      # Needed for Button(intent: SpeakWordIntent); the intent itself runs in the app.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_ID_SLUG).widgets
        PRODUCT_NAME: LockglowWidgets
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundlePackageType: "XPC!"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WGAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/LockglowWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    # The widget must never open SQLite: no ContentStore, no TextFold, no GRDB.
    dependencies:
      - package: VocabKit
        product: CoreModels
      - package: VocabKit
        product: SharedState
      - package: VocabKit
        product: Scheduler

  # Screenshot-only UI test (CI review of the screens; not a behaviour test). Never shipped.
  LockglowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_ID_SLUG).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lockglow
    dependencies:
      - target: Lockglow

  # Renders the widget views at real widget sizes into test attachments (CI layout review).
  # Compiles the widget sources a second time; it is never shipped.
  LockglowWidgetSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WidgetSnapshots
      # The Tekrar quiz card is rendered here too (it needs SwiftUI, CoreModels and the speaker button).
      - path: App/QuizCardView.swift
      # Its keyboard shortcuts.
      - path: App/AnswerKeys.swift
      - path: App/Speaker.swift
      - path: Shared
      # The words' SF Symbol names (docs/ozellik_planlari/kelime_gorselleri.md): CardSymbolTests
      # checks that this iOS draws each one. Read from the test bundle, not from the repo at run time.
      - path: ../content-pipeline/data/card_symbols.json
        buildPhase: resources
      - path: Widgets
        excludes:
          - "LockglowWidgetsBundle.swift"
          - "Info.plist"
          - "*.entitlements"
          - "PrivacyInfo.xcprivacy"
          - "Resources/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_ID_SLUG).widgetsnapshots
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: VocabKit
        product: CoreModels
      - package: VocabKit
        product: SharedState
      - package: VocabKit
        product: Scheduler

  # Hosted app-view snapshots: imports Lockglow so the real feed/theme code is tested once.
  LockglowNativeSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NativeTransferSnapshots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_ID_SLUG).nativesnapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lockglow.app/Lockglow
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      # CoreModels is already linked into the host; linking it here duplicates the static product.
      - target: Lockglow

  # is5-watch: the Apple Watch app (one SwiftUI target, watchOS 10) and its complications. Words come
  # from the phone over WatchConnectivity (App/WatchBridge.swift); see Watch/README.md.
  # NOT embedded in the iPhone app and in no iPhone scheme yet: archives and TestFlight uploads stay
  # iPhone-only until the watch App IDs exist. CI builds them unsigned for the simulator with the
  # LockglowWatch scheme (build.yml).
  LockglowWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/App
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Watch/Shared
      # The seed words while no plan has come from the phone (same file as the iPhone widget).
      - path: Widgets/Resources/seed_words.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_ID_SLUG).watchkitapp
        PRODUCT_NAME: LockglowWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A single-target watch app with an iPhone companion (WatchConnectivity pairs the two).
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).$(APP_ID_SLUG)
        WGAppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: Watch/App/LockglowWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: LockglowWatchWidgets
        embed: true
      - package: VocabKit
        product: CoreModels
      - package: VocabKit
        product: SharedState
      - package: VocabKit
        product: Scheduler

  # is5-watch: watch face complications (WidgetKit accessory families). Reads the files the watch
  # app writes in the watch's App Group container; never writes.
  LockglowWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Watch/Widgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Watch/Shared
      - path: Widgets/Resources/seed_words.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_ID_SLUG).watchkitapp.widgets
        PRODUCT_NAME: LockglowWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: Watch/Widgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundlePackageType: "XPC!"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WGAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Watch/Widgets/LockglowWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - package: VocabKit
        product: CoreModels
      - package: VocabKit
        product: SharedState
      - package: VocabKit
        product: Scheduler

# Both schemes are declared explicitly: XcodeGen does not generate a default scheme for a target
# unless asked, and Xcode may skip auto-creating one once a shared scheme exists.
# Lockglow-Release runs the app in Release, the only configuration that enforces widget
# refresh budgets.
schemes:
  Lockglow:
    build:
      targets:
        Lockglow: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LockglowUITests
        - LockglowWidgetSnapshots
        - LockglowNativeSnapshots
    archive:
      config: Release
  Lockglow-Release:
    build:
      targets:
        Lockglow: all
    run:
      config: Release
    archive:
      config: Release

  # is5-watch: the Apple Watch app with its complications (build.yml: unsigned simulator build).
  # Kept apart from the iPhone schemes, so testflight.yml (Lockglow-Release) never builds it.
  LockglowWatch:
    build:
      targets:
        LockglowWatch: all
    run:
      config: Debug
    archive:
      config: Release
